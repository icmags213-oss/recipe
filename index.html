    get isMemoryOnly() { return memoryOnly; },
    get wasRepaired() { return repaired; },

    async ready() { await open(); },

    async allPrefs() {
      await open();
      if (memoryOnly) return Object.fromEntries(memory.prefs);
      return new Promise((resolve, reject) => {
        const values = {};
        const transaction = db.transaction('prefs', 'readonly');
        const request = transaction.objectStore('prefs').openCursor();
        request.onsuccess = () => {
          const cursor = request.result;
          if (cursor) { values[cursor.key] = cursor.value; cursor.continue(); }
        };
        transaction.oncomplete = () => resolve(values);
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    },

    async resetData() {
      await open();
      if (memoryOnly) { memory.recipes.clear(); memory.prefs.clear(); return; }
      await new Promise((resolve, reject) => {
        const transaction = db.transaction(['recipes', 'prefs'], 'readwrite');
        transaction.objectStore('recipes').clear();
        transaction.objectStore('prefs').clear();
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    },

    async allRecipes() {
      await open();
      if (memoryOnly) return [...memory.recipes.values()];
      return (await safe('recipes', 'readonly', s => s.getAll(), [])) || [];
    },

    async putRecipes(list) {
      await open();
      if (memoryOnly) { list.forEach(r => memory.recipes.set(r.id, r)); return; }
      await tx('recipes', 'readwrite', s => { list.forEach(r => s.put(r)); });
    },

    async deleteRecipe(id) {
      await open();
      if (memoryOnly) { memory.recipes.delete(id); return; }
      await tx('recipes', 'readwrite', s => s.delete(id));
    },

    async clearRecipes() {
      await open();
      if (memoryOnly) { memory.recipes.clear(); return; }
      await tx('recipes', 'readwrite', s => s.clear());
    },

    async pref(key, value) {
      await open();
      if (value === undefined) {
        if (memoryOnly) return memory.prefs.get(key);
        return await safe('prefs', 'readonly', s => s.get(key), undefined);
      }
      if (memoryOnly) { memory.prefs.set(key, value); return; }
      await safe('prefs', 'readwrite', s => s.put(value, key));
    }
  };

/* ============================================================
   plan.js — which recipe on which day.

   The plan is a flat map of date key to a list of recipe ids:

       { "2026-08-24": ["r3", "r7"], "2026-08-26": ["r1"] }

   Ids rather than copies, so renaming a recipe updates the plan
   too, and deleting one leaves a dangling id that the calendar
   quietly drops rather than rendering a ghost.

   Dates are local. Building the key from toISOString() would be
   a bug: at 8pm in Wheeling that string is already tomorrow.
   ============================================================ */

(function (global) {
  'use strict';

  const DAY_MS = 86400000;

  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const pad = n => String(n).padStart(2, '0');

  /* local date key — never derived from an ISO string */
  function key(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function fromKey(k) {
    const [y, m, d] = k.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function midnight(d) {
    const c = new Date(d);
    c.setHours(0, 0, 0, 0);
    return c;
  }

  function addDays(d, n) {
    const c = midnight(d);
    c.setDate(c.getDate() + n);
    return c;
  }

  /* weeks run Sunday to Saturday */
  function weekStart(d) {
    const c = midnight(d);
    return addDays(c, -c.getDay());
  }

  function weekDays(start) {
    return Array.from({ length: 7 }, (_, i) => addDays(start, i));
  }

  function isToday(d) {
    return key(d) === key(new Date());
  }

  function dayName(d) { return DAYS[d.getDay()]; }
  function shortDay(d) { return DAYS[d.getDay()].slice(0, 3); }

  function label(d) {
    return `${MONTHS[d.getMonth()]} ${d.getDate()}`;
  }

  function rangeLabel(start) {
    const end = addDays(start, 6);
    const sameMonth = start.getMonth() === end.getMonth();
    return sameMonth
      ? `${MONTHS[start.getMonth()]} ${start.getDate()}–${end.getDate()}`
      : `${label(start)} – ${label(end)}`;
  }

  /* "Today", "Tomorrow", "Sat 30 Aug" — for the day picker */
  function relative(d) {
    const diff = Math.round((midnight(d) - midnight(new Date())) / DAY_MS);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff > 1 && diff < 7) return dayName(d);
    return `${shortDay(d)} ${label(d)}`;
  }

  /* the next fortnight, which is as far ahead as anyone plans dinner */
  function upcoming(n) {
    const today = midnight(new Date());
    return Array.from({ length: n || 14 }, (_, i) => addDays(today, i));
  }

  global.Plan = {
    key, fromKey, midnight, addDays, weekStart, weekDays,
    isToday, dayName, shortDay, label, rangeLabel, relative, upcoming
  };

})(window);

</script>
<script>
/* ============================================================
   swipe.js — the mechanics of a card deck.

   Deliberately knows nothing about recipes. It shuffles a list,
   tracks what has been seen, and turns pointer drags into a
   left/right decision. The view layer supplies the cards.
   ============================================================ */

(function (global) {
  'use strict';

  /* Mulberry32. The obvious `s * 1103515245` overflows 2^53 in a double
     and loses low bits, which makes the sequence degenerate. Math.imul
     keeps the arithmetic in 32 bits, where it belongs. */
  function rng(seed) {
    let s = (seed >>> 0) || 1;
    return () => {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Fisher–Yates, seeded so a reload does not reshuffle a deck you are
     halfway through. */
  function shuffle(list, seed) {
    const out = list.slice();
    const rand = rng(seed);
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  /* What is left to look at.

     Shuffle the whole pool first, then drop what has been seen. Filtering
     before shuffling looks equivalent and is not: a Fisher–Yates pass over
     an (n-1)-length list draws a different number of times than over an
     n-length one, so every swipe reshuffles everything that is left. The
     card peeking out from behind is then never the card that arrives —
     which reads, correctly, as the deck skipping one each time. */
  function remaining(all, seenIds, seed) {
    const seen = new Set(seenIds);
    return shuffle(all, seed).filter(x => !seen.has(x.id));
  }

  const THRESHOLD = 84;      // px of travel that counts as a decision
  const TILT = 0.055;        // degrees of rotation per px

  /* With reduced motion the transitions are cut to nothing by CSS, so
     waiting the full travel time would leave a blank deck. Checked per
     throw rather than once, in case the setting changes mid-session. */
  const reduced = () =>
    typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Wire one card element. onDecide('right'|'left') fires once the
     card has been thrown; onDrag reports progress so the view can
     fade in a KEEP / PASS badge. */
  function bindCard(el, { onDecide, onDrag, onCommit } = {}) {
    let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, done = false;

    const setTransform = (x, y, extra) => {
      el.style.transform = `translate(${x}px, ${y}px) rotate(${x * TILT}deg) ${extra || ''}`;
    };

    function down(e) {
      if (done || e.button > 0) return;
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      el.setPointerCapture(e.pointerId);
      el.style.transition = 'none';
    }

    function move(e) {
      if (!dragging) return;
      dx = e.clientX - startX;
      dy = e.clientY - startY;
      setTransform(dx, dy * 0.35);
      if (onDrag) onDrag(Math.max(-1, Math.min(1, dx / THRESHOLD)));
    }

    function up() {
      if (!dragging) return;
      dragging = false;
      el.style.transition = '';
      if (Math.abs(dx) > THRESHOLD) {
        fling(dx > 0 ? 'right' : 'left');
      } else {
        setTransform(0, 0);
        if (onDrag) onDrag(0);
      }
      dx = dy = 0;
    }

    /* Throw the card off screen.

       onCommit fires immediately, so the card underneath can start growing
       into place while this one is still travelling — the two motions
       overlap instead of queueing, which is what stops it looking like a
       pop. onDecide fires once the card is clear and can be removed. */
    function fling(dir) {
      if (done) return;
      done = true;
      const to = dir === 'right' ? window.innerWidth : -window.innerWidth;
      el.style.transition = 'transform .34s cubic-bezier(.32,.06,.28,1), opacity .3s ease-in';
      setTransform(to, -40);
      el.style.opacity = '0';
      el.style.pointerEvents = 'none';
      if (onDrag) onDrag(dir === 'right' ? 1 : -1);
      if (onCommit) onCommit(dir);
      setTimeout(() => { if (onDecide) onDecide(dir); }, reduced() ? 20 : 340);
    }

    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);

    return { fling };
  }

  global.Swipe = { shuffle, remaining, bindCard, THRESHOLD };

})(window);

</script>

    [/onion|leek|scallion|spring onion/, 'onion', 21],
    [/garlic/, 'garlic', 60],
    [/potato|yam|sweet potato/, 'potato', 30],
    [/ginger|turmeric root/, 'ginger', 21],
    [/corn\b|sweetcorn/, 'corn', 5],
    [/parsley|coriander|cilantro|basil|mint|thyme|rosemary|dill|sage|herb/, 'herbs', 5],
    [/bread|loaf|bun|roll|bagel|tortilla|pita/, 'bread', 5],
    [/pasta|spaghetti|noodle|linguine|penne|tagliatelle|tonnarelli/, 'pasta', 365],
    [/rice|quinoa|couscous|lentil|barley|oats|flour|sugar/, 'rice', 365],
    [/ketchup|mustard|mayo|mayonnaise|sriracha|soy|hot sauce|dressing|\bsauce\b|salsa/, 'sauce', 90],
    [/jam|jelly|honey|syrup|peanut butter|nutella|pickle|olives|chutney/, 'jar', 90],
    [/\bcan\b|tinned|canned|beans|chickpea|soup|tomatoes tinned/, 'can', 540],
    [/water|soda|beer|wine|cola|drink|bottle/, 'bottle', 180],
    [/crisps|chips|cereal|snack|crackers|biscuit|cookie|nuts|bag/, 'bag', 90],
    [/box|cake mix|pancake/, 'box', 180]
  ];

  /* Photographs, supplied as a 4x4 sheet. Sixteen foods have one; the other
     thirty fall back to a drawing, which is why both exist. Indices run in
     reading order across the sheet. */
  const SPRITE_COLS = 4;
  const SPRITES = [
    [/\bmilk\b|buttermilk/, 0],
    [/\begg/, 1],
    [/parmesan|pecorino|cheddar|\bcheese\b/, 2],
    [/yogurt|yoghurt|sour cream|creme fraiche|skyr/, 3],
    [/spinach|lettuce|kale|rocket|arugula|greens|chard|salad/, 4],
    [/broccoli/, 5],
    [/strawberr/, 6],
    [/orange juice|\bjuice\b/, 7],
    [/salmon|\bfish\b|\bcod\b|trout/, 8],
    [/\bpeas\b|edamame/, 9],
    [/ice cream|gelato|sorbet/, 10],
    [/mixed berries|frozen berries|blueberr|raspberr|blackberr|\bberries\b/, 11],
    [/spaghetti|pasta|linguine|penne|tagliatelle|noodle|tonnarelli/, 12],
    [/\brice\b|basmati|jasmine rice/, 13],
    [/cannellini|\bbeans\b|chickpea|tinned|canned|\bcan\b/, 14],
    [/olive oil|\boil\b/, 15]
  ];

  /* Pictures you supply yourself, for foods the sheet and the drawings do
     not cover. Keyed by name so every "sacchetti" you ever type gets the
     same picture, in the kitchen and in the picker alike. */
  let custom = {};
  const key = name => String(name).toLowerCase().trim().replace(/\s+/g, ' ');

  const loadCustom = obj => { custom = obj && typeof obj === 'object' ? obj : {}; };
  const customNames = () => Object.keys(custom).sort();
  const hasCustom = name => Object.prototype.hasOwnProperty.call(custom, key(name));
  const customPic = name => custom[key(name)] || null;
  const setCustom = (name, dataUrl) => { custom[key(name)] = dataUrl; return custom; };
  const removeCustom = name => { delete custom[key(name)]; return custom; };
  const allCustom = () => custom;

  /* Shrink a picked file to something a shelf can hold while preserving PNG
     transparency. JPEG used to flatten clear pixels onto black, which made
     transparent food cut-outs appear as black squares in the appliance. */
  function makeSprite(file, size) {
    size = size || 320;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read that image.'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('That file is not an image.'));
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = c.height = size;
          const x = c.getContext('2d');
          x.clearRect(0, 0, size, size);
          const scale = Math.min(size / img.width, size / img.height);
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          x.drawImage(img, Math.round((size - w) / 2), size - h, w, h);
          resolve(c.toDataURL('image/png'));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /** Sprite cell for a name, or null when only a drawing exists. */
  function photo(name) {
    const n = String(name).toLowerCase();
    for (const [re, i] of SPRITES) {
      if (re.test(n)) return { index: i, col: i % SPRITE_COLS, row: Math.floor(i / SPRITE_COLS) };
    }
    return null;
  }

  const hasPhoto = (name) => photo(name) !== null;

  /** Use only photographic assets: a custom upload first, then the built-in
   *  photo sheet. Foods without either remain in inventory without artwork. */
  function visual(name, size) {
    const mine = customPic(name);
    if (mine) {
      /* User photos are usually real packages or leftover containers. Give
         them a wider, taller shelf footprint than the compact icon sprites. */
      return `<span class="fr-own" style="width:${Math.round(size * 1.75)}px;` +
             `height:${Math.round(size * 1.22)}px;` +
             `background-image:url('${mine}')"></span>`;
    }
    const p = photo(name);
    if (p) {
      return `<span class="fr-photo" style="--col:${p.col};--row:${p.row};` +
             `width:${Math.round(size * 1.15)}px;height:${size}px"></span>`;
    }
    return '';
  }

  function lookup(name) {
    const n = String(name).toLowerCase();
    for (const [re, art, days] of TABLE) {
      if (re.test(n)) return { art, days };
    }
    return { art: 'box', days: 14 };            // unknown things get a packet
  }

  function svg(name, size) {
    const { art } = lookup(name);
    const body = ART[art] || ART.box;
    return `<svg viewBox="0 0 100 100" width="${size || 64}" height="${size || 64}"
      role="img" aria-hidden="true" focusable="false"
      stroke-linecap="round" stroke-linejoin="round">
      <g fill="none" stroke="none">${body}</g></svg>`;
  }

  const shelfLife = name => lookup(name).days;

  /* A clean, pickable list — one entry per drawing, plus the photographed
     ones. The lookup table is regexes, which are no use in a menu. */
  const CHOICES = [
    'Milk', 'Cream', 'Yogurt', 'Butter', 'Cheese', 'Eggs', 'Orange juice',
    'Chicken', 'Beef', 'Fish', 'Bacon',
    'Banana', 'Apple', 'Orange', 'Lemon', 'Lime', 'Grapes', 'Berries', 'Strawberries',
    'Avocado', 'Tomato', 'Green pepper', 'Red pepper', 'Carrot', 'Cucumber',
    'Spinach', 'Broccoli', 'Mushroom', 'Onion', 'Red onion', 'Garlic', 'Potato',
    'Ginger', 'Corn', 'Herbs',
    'Bread', 'Pasta', 'Rice', 'Peas', 'Ice cream',
    'Jam', 'Sauce', 'Tinned beans', 'Bottle', 'Box', 'Bag'
  ];

  /* The sprite sheet lives in the CSS — as a file in the multi-file build and
     as a data URI in the standalone one. Reading it back off a probe element
     is the only way to get the same URL in both. */
  let sheetUrl = null;
  function findSheetUrl() {
    if (sheetUrl) return sheetUrl;
    const probe = document.createElement('span');
    probe.className = 'fr-photo';
    probe.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px';
    document.body.appendChild(probe);
    const bg = getComputedStyle(probe).backgroundImage || '';
    probe.remove();
    const m = bg.match(/url\(["']?(.*?)["']?\)/);
    sheetUrl = m ? m[1] : null;
    return sheetUrl;
  }

  const loadImage = src => new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('could not load ' + src.slice(0, 40)));
    i.src = src;
  });

  let sheetPromise = null;
  const sheetImage = () => (sheetPromise = sheetPromise || loadImage(findSheetUrl()));

  /* Turn a food into a picture a recipe can hold — recipes store images as
     data URLs, so the sprite has to be painted onto a canvas either way. */
  async function toDataUrl(name, size, bg) {
    size = size || 640;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    x.fillStyle = bg || '#F7F5F5';
    x.fillRect(0, 0, size, size);

    const mine = customPic(name);
    if (mine) {
      const img = await loadImage(mine);
      const pad = size * 0.04;
      x.drawImage(img, pad, pad, size - pad * 2, size - pad * 2);
      return c.toDataURL('image/jpeg', 0.86);
    }

    const p = photo(name);
    if (p) {
      const sheet = await sheetImage();
      const cell = sheet.width / SPRITE_COLS;
      const pad = size * 0.07;
      x.drawImage(sheet, p.col * cell, p.row * cell, cell, cell,
                  pad, pad, size - pad * 2, size - pad * 2);
    } else {
      const body = ART[lookup(name).art] || ART.box;
      const markup = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" ` +
        `width="${size}" height="${size}">${body}</svg>`;
      const img = await loadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(markup));
      const pad = size * 0.1;
      x.drawImage(img, pad, pad, size - pad * 2, size - pad * 2);
    }
    return c.toDataURL('image/jpeg', 0.86);
  }

  global.Food = {
    svg, lookup, shelfLife, photo, hasPhoto, visual, toDataUrl,
    loadCustom, customNames, hasCustom, customPic, setCustom, removeCustom,
    allCustom, makeSprite, key,
    CHOICES, ART, TABLE, SPRITES
  };

})(window);

</script>
<script>
/* ============================================================
   fridge.js — what you have, and what that lets you cook.

   The drawing is the easy half. The useful half is matching a
   loose list of things you own against 180 recipes written in
   free text, which is fuzzy work: "chicken" has to find "1 whole
   chicken, about 1.6 kg" without also matching "chicken stock"
   being the only thing you own.
   ============================================================ */

(function (global) {
  'use strict';

  /* Three appliances, each with its own shelves. Replaces the single
     cabinet with door bins — a freezer and a pantry are where half a
     kitchen actually lives. */
  const PLACES = [
    { id: 'fridge',  label: 'Fridge'  },
    { id: 'freezer', label: 'Freezer' },
    { id: 'pantry',  label: 'Pantry'  }
  ];

  const LAYOUT = {
    fridge: [
      { id: 'f1', kind: 'shelf' },
      { id: 'f2', kind: 'shelf' },
      { id: 'f3', kind: 'shelf' },
      { id: 'fc1', kind: 'crisper', label: 'Crisper' },
      { id: 'fc2', kind: 'crisper', label: 'Crisper' }
    ],
    freezer: [
      { id: 'z1', kind: 'shelf' },
      { id: 'z2', kind: 'shelf' },
      { id: 'zd1', kind: 'crisper', label: 'Basket' },
      { id: 'zd2', kind: 'crisper', label: 'Basket' }
    ],
    pantry: [
      { id: 'p1', kind: 'shelf' },
      { id: 'p2', kind: 'shelf' },
      { id: 'p3', kind: 'shelf' },
      { id: 'p4', kind: 'shelf' }
    ]
  };

  const shelvesOf = (place) => LAYOUT[place] || LAYOUT.fridge;
  const placeOfShelf = (id) =>
    PLACES.map(p => p.id).find(p => shelvesOf(p).some(s => s.id === id)) || 'fridge';

  // kept so older saved items can be read; see migrate() below
  const SECTIONS = PLACES;

  /* Where a thing probably lives. Wrong guesses are cheap — you can move
     an item — so this leans on obvious words rather than trying to be
     clever about it. */
  const HINTS = [
    ['pantry',  /\b(pasta|spaghetti|noodle|rice|quinoa|flour|sugar|cereal|oats|beans|lentil|tinned|canned|\bcan\b|jar|oil|vinegar|bread|loaf|crackers|chips|crisps|cookie|biscuit|nuts|coffee|tea|honey|syrup|potato|onion|garlic|squash)\b/],
    ['freezer', /\b(frozen|ice cream|ice|sorbet|gelato|peas|fish fingers|waffle|popsicle)\b/],
    ['door',    /\b(milk|cream|butter|margarine|juice|ketchup|mustard|mayo|mayonnaise|sauce|dressing|jam|jelly|syrup|pickle|relish|soda|beer|wine|water|egg|eggs)\b/],
    ['crisper', /\b(lettuce|spinach|kale|carrot|celery|pepper|peppers|onion|garlic|potato|tomato|cucumber|broccoli|cauliflower|mushroom|courgette|zucchini|apple|orange|lemon|lime|berry|berries|strawberr|grape|herb|parsley|coriander|cilantro|basil|scallion|leek|cabbage|greens)\w*/],
  ];

  /* Which appliance, and which shelf inside it. Wrong guesses are cheap —
     everything can be moved — so this leans on obvious words. */
  function guessSpot(name) {
    const n = ' ' + String(name).toLowerCase().trim() + ' ';
    for (const [where, re] of HINTS) {
      if (!re.test(n)) continue;
      if (where === 'freezer') return { place: 'freezer', shelf: 'z1' };
      if (where === 'crisper') return { place: 'fridge', shelf: 'fc1' };
      if (where === 'pantry')  return { place: 'pantry', shelf: 'p1' };
      return { place: 'fridge', shelf: 'f1' };
    }
    return { place: 'fridge', shelf: 'f2' };
  }

  const guessSection = (name) => guessSpot(name).shelf;

  /* Items saved before there were three appliances carry the old
     shelf/door/crisper/freezer section. Read them rather than lose them. */
  const OLD = { shelf: ['fridge', 'f2'], door: ['fridge', 'f1'],
                crisper: ['fridge', 'fc1'], freezer: ['freezer', 'z1'] };

  function migrate(item) {
    if (item.place && item.shelf) return item;
    const [place, shelf] = OLD[item.section] || OLD.shelf;
    return Object.assign({}, item, { place, shelf });
  }

  /* Things nobody writes on a shopping list but everybody has. Counting
     them as missing would bury every recipe under "you need salt". */
  const STAPLES = /\b(salt|pepper|water|oil|olive oil|vegetable oil|sugar|flour|butter|baking powder|baking soda|vinegar|stock|broth|seasoning|spice|spices|to taste)\b/;

  const strip = s => String(s)
    .toLowerCase()
    .replace(/\([^)]*\)/g, ' ')            // drop parentheticals
    .replace(/[^a-z\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  const singular = w => (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) ? w.slice(0, -1) : w;

  /* splitQty removes the number but leaves the unit behind, so "2 kg beef
     short ribs" still starts with "kg". Peel those off, along with the size
     words that describe the packet rather than the food. */
  const LEAD = new RegExp('^(?:x\\s+)?(?:' + [
    'g', 'kg', 'mg', 'ml', 'l', 'cl', 'dl',
    'tsps?', 'teaspoons?', 'tbsps?', 'tablespoons?', 'cups?',
    'oz', 'ounces?', 'lbs?', 'pounds?', 'pints?', 'quarts?',
    'cloves?', 'pinch(?:es)?', 'dash(?:es)?', 'sprigs?', 'sticks?',
    'cans?', 'tins?', 'jars?', 'packets?', 'packs?', 'bags?', 'boxes?',
    'containers?', 'cartons?', 'punnets?', 'tubs?', 'bottles?', 'loa(?:f|ves)',
    'heads?', 'dozen', 'gallons?', 'quarts?', 'bulbs?', 'knobs?', 'sheets?',
    'slices?', 'bunch(?:es)?', 'handfuls?', 'pieces?',
    'large', 'small', 'medium', 'whole', 'fresh', 'ripe', 'good', 'quality', 'of'
  ].join('|') + ')\\s+');

  function trimUnits(text) {
    let out = text;
    for (let i = 0; i < 6 && LEAD.test(out); i++) out = out.replace(LEAD, '');
    return out;
  }

  /* The name of an ingredient, without quantity, unit, or the instructions
     after the comma. Returns both a word list for matching and readable
     text for display — "2 kg beef short ribs" matches on
     ["beef","short","rib"] but reads as "beef short ribs". */
  function ingredientKey(line) {
    const rest = global.Units ? global.Units.splitQty(line).rest : line;
    const label = trimUnits(strip(rest.split(',')[0]));
    return { words: label.split(' ').map(singular).filter(Boolean), label };
  }

  /* Does owning `item` satisfy `line`?

     Every word of the item has to appear in the ingredient, so "chicken"
     matches "whole chicken" but "chicken stock" does not match "chicken" —
     owning stock is not owning a bird. */
  function satisfies(itemWords, lineWords) {
    if (!itemWords.length) return false;
    return itemWords.every(w => lineWords.includes(w));
  }

  /* Some libraries write section headings without the colon that
     Units.isHeading looks for — "For the wings" then a plain list. Left
     alone it turns up as a missing ingredient, which reads as nonsense. */
  const HEADINGY = /^(?:for the|for |to serve|to garnish|to finish|garnish|topping|optional)\b/;

  function matchRecipes(items, recipes, opts) {
    const assumeStaples = !opts || opts.assumeStaples !== false;
    const owned = items.map(i => ({ item: i, words: strip(i.name).split(' ').map(singular).filter(Boolean) }));

    const out = [];
    for (const r of recipes) {
      const lines = r.ingredients.filter(l => global.Units && !global.Units.isHeading(l));
      if (lines.length < 2) continue;             // photo-only entries

      const have = [];
      const missing = [];
      const used = [];

      for (const line of lines) {
        const { words, label } = ingredientKey(line);
        if (!label || HEADINGY.test(label)) continue;

        const hit = owned.find(o => satisfies(o.words, words));
        if (hit) { have.push(label); if (!used.includes(hit.item)) used.push(hit.item); }
        else if (assumeStaples && STAPLES.test(label)) have.push(label);
        else missing.push(label);
      }

      const total = have.length + missing.length;
      if (!total || !have.length) continue;

      const expiring = used.filter(isUrgent);

      out.push({
        recipe: r,
        have: have.length,
        total,
        missing,
        used,
        expiring,
        ratio: have.length / total
      });
    }

    /* Anything that uses something about to turn comes first — that is the
       question a fridge actually answers. Coverage decides the rest. */
    return out.sort((a, b) =>
      b.expiring.length - a.expiring.length ||
      b.ratio - a.ratio ||
      a.missing.length - b.missing.length);
  }

  const DAY = 86400000;

  /* Shelf life is counted in whole days from the start of today. Measuring
     from the current clock time makes a two-day item read "3 days left"
     when added at lunchtime, because the part-day rounds up. */
  function startOfToday() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  /* place is optional: pass one to put a thing somewhere specific — that is
     what putting the shopping away does — and the shelf follows from it. */
  /* A shopping line is "500 ml red wine"; a thing in your kitchen is
     "red wine". Strip the amount, the unit, and anything after the comma,
     but keep the original capitalisation for display. */
  function foodName(text) {
    const rest = global.Units ? global.Units.splitQty(text).rest : String(text);
    let out = rest.split(',')[0].trim();
    for (let i = 0; i < 6; i++) {
      const next = out.replace(LEAD, '');
      if (next === out) break;
      out = next;
    }
    return out.trim() || String(text).trim();
  }

  function item(name, section, place) {
    const clean = String(name).trim().replace(/\s+/g, ' ');
    if (!clean) return null;
    const life = global.Food ? global.Food.shelfLife(clean) : 14;
    let spot = guessSpot(clean);
    if (place && place !== spot.place) {
      spot = { place, shelf: shelvesOf(place)[0].id };
    }
    return {
      id: 'f' + Math.random().toString(36).slice(2, 9),
      name: clean,
      place: spot.place,
      shelf: section || spot.shelf,
      section: section || spot.shelf,      // kept for older readers
      added: Date.now(),
      life,                                  // days, adjustable
      expires: startOfToday() + life * DAY
    };
  }

  /* Whole days remaining, counted from midnight so an item added on Monday
     evening still reads "1 day left" on Tuesday morning rather than "0". */
  function daysLeft(it) {
    if (!it || !it.expires) return null;
    return Math.round((it.expires - startOfToday()) / DAY);
  }

  function freshness(it) {
    const d = daysLeft(it);
    if (d === null) return { label: '', level: 'ok', days: null };
    if (d < 0) return { label: 'past it', level: 'gone', days: d };
    if (d === 0) return { label: 'today', level: 'urgent', days: d };
    if (d === 1) return { label: '1 day left', level: 'urgent', days: d };
    if (d <= 3) return { label: d + ' days left', level: 'soon', days: d };
    return { label: d + ' days left', level: 'ok', days: d };
  }

  const isUrgent = it => {
    const d = daysLeft(it);
    return d !== null && d <= 3;
  };

  function setLife(it, days) {
    it.life = Math.max(0, days);
    it.expires = startOfToday() + it.life * DAY;
    return it;
  }

  function parseList(text) {
    return String(text)
      .split(/[\n,]+/)
      .map(s => item(s))
      .filter(Boolean);
  }

  global.Fridge = {
    PLACES, LAYOUT, shelvesOf, placeOfShelf, SECTIONS,
    guessSpot, guessSection, migrate,
    matchRecipes, item, parseList, foodName,
    ingredientKey, STAPLES, daysLeft, freshness, isUrgent, setLife, DAY
  };

})(window);

</script>

   All 24×24, 1.6 stroke, round caps. Anything with [data-ico]
   gets filled in by paint(), including nodes added later.
   ============================================================ */

(function (global) {
  'use strict';

  const P = {

               '<path d="M10 9h6M10 12.5h6M10 16h4"/>',

    restaurantAdd:'<path d="M4 9h16M5 9v11h14V9M3 5h18l-1 4H4L3 5Z"/><path d="M8 20v-6h4v6M15.5 13.5h1M19 4V2M16.5 3h5"/>',
    clock:    '<circle cx="12" cy="12" r="8.2"/><path d="M12 7.6V12l3 1.8"/>',

    /* A tag with a line through it. The line is separated from the tag by a

    tagoff:   '<mask id="tagoff-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">' +
              '<rect width="24" height="24" fill="#fff"/>' +

    left:     '<path d="M14.5 5.5 8 12l6.5 6.5"/>',
    cards:    '<rect x="7.6" y="6.4" width="12.8" height="13" rx="2"/><path d="M15.6 3.6H5.6a2 2 0 0 0-2 2v10"/>',
    fridge:   '<rect x="6" y="2.8" width="12" height="18.4" rx="2.2"/><path d="M6 9.6h12"/><path d="M8.8 6v1.6M8.8 12.2v2.2"/>',
    sliders:  '<path d="M4 7.4h9M17 7.4h3"/><path d="M4 16.6h3M11 16.6h9"/><circle cx="15" cy="7.4" r="2.2"/><circle cx="9" cy="16.6" r="2.2"/>',

  function svg(name) {
    const d = P[name];
    if (!d) return '';
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${d}</svg>`;
  }

  function paint(root) {
    (root || document).querySelectorAll('[data-ico]').forEach(el => {
      if (el.dataset.painted) return;
      el.innerHTML = svg(el.dataset.ico);
      el.dataset.painted = '1';

<script>
/* ============================================================
   editor.js — writing recipes, not just reading them.

   The form mirrors Mela's field order so that anything typed
   here round-trips through the same normalizer an import uses.
   Ingredients and instructions are plain text, one item a line,
   because that is how Mela stores them and how people paste.
   ============================================================ */

(function (global) {
  'use strict';

  const $ = s => document.querySelector(s);

  const FIELDS = {
    title: '#ed-title', link: '#ed-link', cats: '#ed-cats', yield: '#ed-yield',
    prep: '#ed-prep', cook: '#ed-cook', total: '#ed-total',
    desc: '#ed-desc', steps: '#ed-steps', notes: '#ed-notes',
    nutr: '#ed-nutr', ing: '#ed-ing'
  };

  let editingId = null;
  let editorMode = 'recipe';
  let photos = [];
  let onSaved = () => {};

  function val(k) { return $(FIELDS[k]).value.trim(); }
  function set(k, v) { $(FIELDS[k]).value = v || ''; }

  /* The first photo is the cover — it is what the list row and the top of
     the recipe show. Clicking any other thumbnail promotes it to the front
     rather than opening a separate "set cover" control. */
  function renderPhotos() {
    const wrap = $('#ed-photos');
    wrap.innerHTML = '';

    photos.forEach((src, i) => {
      const cell = document.createElement('div');
      cell.className = 'ed-thumb' + (i === 0 ? ' cover' : '');
      cell.innerHTML =
        `<img src="${src.replace(/"/g, '&quot;')}" alt="">` +
        (i === 0 ? '<span class="ed-cover-tag">Cover</span>' : '') +
        '<button type="button" class="ed-thumb-x" aria-label="Remove photo">&times;</button>';

      cell.querySelector('img').addEventListener('click', () => {
        if (i === 0) return;
        photos.splice(0, 0, photos.splice(i, 1)[0]);
        renderPhotos();
      });
      cell.querySelector('.ed-thumb-x').addEventListener('click', e => {
        e.stopPropagation();
        photos.splice(i, 1);
        renderPhotos();
      });
      wrap.appendChild(cell);
    });

    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'ed-photo';
    add.innerHTML = '<span class="ico" data-ico="plus"></span>';
    add.addEventListener('click', () => $('#ed-photo-file').click());
    wrap.appendChild(add);

    const pick = document.createElement('button');
    pick.type = 'button';
    pick.className = 'ed-photo ed-pick';
    pick.title = 'Choose a food picture';
    pick.innerHTML = Food.svg('tomato', 34) + '<span>Food</span>';
    pick.addEventListener('click', togglePicker);
    wrap.appendChild(pick);

    $('#ed-photo-count').textContent =
      photos.length ? `${photos.length} photo${photos.length === 1 ? '' : 's'}` : '';
    Icons.paint(wrap);
  }

  /* Photos go in as base64, same as Mela's own export, so a recipe
     written here exports back out looking like one that came in.
     Anything large is scaled down first — a 4 MB camera shot would
     otherwise sit in IndexedDB at full size forever. */
  function readPhoto(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read that image.'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => resolve(reader.result);
        img.onload = () => {
          const MAX = 1400;
          if (img.width <= MAX && img.height <= MAX && file.size < 900000) return resolve(reader.result);
          const scale = Math.min(MAX / img.width, MAX / img.height, 1);
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* Not every recipe has a photograph, and hunting for one is a chore. The
     same food pictures the kitchen uses make a serviceable stand-in, so they
     are pickable here and become an ordinary image on the recipe. */
  function togglePicker() {
    const box = $('#ed-picker');
    if (!box.hidden) { box.hidden = true; return; }

    if (!box.dataset.wired) {
      box.dataset.wired = '1';

      /* Delegated from the panel, which survives — buildPicker replaces the
         grid and the search field, so anything bound to those is lost the
         first time a picture is removed. */
      box.addEventListener('input', e => {
        if (e.target.id === 'pick-find') filterPicker(box, e.target.value);
      });

      box.addEventListener('click', async e => {
        const drop = e.target.closest('[data-drop]');
        if (drop) {
          e.stopPropagation();
          const q = $('#pick-find').value;
          await global.Recipe.forgetPicture(drop.dataset.drop);
          buildPicker(box);
          $('#pick-find').value = q;
          filterPicker(box, q);
          return;
        }

        if (e.target.closest('[data-newpic]')) {
          const name = $('#pick-find').value.trim();
          if (!name) return;
          global.Recipe.askForPicture(name, () => {
            buildPicker(box);
            $('#pick-find').value = name;
            filterPicker(box, name);
          });
          return;
        }

        const tile = e.target.closest('[data-food]');
        if (!tile) return;
        tile.disabled = true;
        try {
          photos.push(await Food.toDataUrl(tile.dataset.food));
          renderPhotos();
          box.hidden = true;
        } catch (err) {
          console.error(err);
        }
        tile.disabled = false;
      });
    }

    buildPicker(box);

    box.hidden = false;
    $('#pick-find').value = '';
    box.querySelectorAll('.pick-cell').forEach(c => { c.hidden = false; });
    $('#pick-find').focus();
  }

  function buildPicker(box) {
    const mine = Food.customNames();
    const names = mine.concat(Food.CHOICES);
    box.innerHTML = `<div class="pick-head">
        <span class="ed-lbl">Food pictures</span>
        <input id="pick-find" placeholder="Search, or type a new one" autocomplete="off">
      </div>
      <div class="pick-grid">${names.map(n => `
        <span class="pick-cell">
          <button type="button" data-food="${n}" title="${n}">
            <span class="pick-art">${Food.visual(n, 40)}</span>
            <span class="pick-name">${n}</span>
          </button>
          ${Food.hasCustom(n)
            ? `<button type="button" class="pick-x" data-drop="${n}"
                 aria-label="Remove the picture for ${n}">&times;</button>` : ''}
        </span>`).join('')}
        <button type="button" class="pick-new" data-newpic="1" hidden>
          <span class="pick-art"><span class="ico" data-ico="plus"></span></span>
          <span class="pick-name">Add a picture</span>
        </button>
      </div>`;
    box.dataset.built = '1';
    if (global.Icons) Icons.paint(box);
  }

  /* When nothing matches, offer to make a picture for whatever was typed —
     that is exactly the moment you notice a food is missing. */
  function filterPicker(box, text) {
    const q = String(text).trim().toLowerCase();
    let shown = 0;
    box.querySelectorAll('[data-food]').forEach(b => {
      const hit = !q || b.dataset.food.toLowerCase().includes(q);
      const cell = b.closest('.pick-cell') || b;
      cell.hidden = !hit;
      if (hit) shown++;
    });
    box.querySelector('[data-newpic]').hidden = !(q && shown === 0);
  }

  function open(recipe, saved, defaults) {
    defaults = defaults || {};
    const restaurantMode = defaults.mode === 'restaurant';
    editorMode = restaurantMode ? 'restaurant' : 'recipe';
    onSaved = saved || (() => {});
    editingId = recipe ? recipe.id : null;

    set('title', recipe && recipe.title);
    set('link', recipe && recipe.link);
    set('cats', recipe ? recipe.categories.join(', ') : (defaults.categories || []).join(', '));
    $('#ed-restaurant-state').value = recipe
      ? ((recipe.categories.find(c => /^state\s*:/i.test(c)) || '').replace(/^state\s*:\s*/i, ''))
      : '';
    set('yield', recipe && recipe.yield);
    set('prep', recipe && recipe.prepTime);
    set('cook', recipe && recipe.cookTime);
    set('total', recipe && recipe.totalTime);
    set('desc', recipe && recipe.description);
    set('steps', recipe ? recipe.instructions.join('\n') : '');
    set('notes', recipe && recipe.notes);
    set('nutr', recipe && recipe.nutrition);
    set('ing', recipe ? recipe.ingredients.join('\n') : '');
    photos = recipe ? recipe.images.slice() : [];
    renderPhotos();

    $('#ed-picker').hidden = true;
    $('#editor').dataset.mode = restaurantMode ? 'restaurant' : 'recipe';
    $('#ed-title').placeholder = restaurantMode ? 'Restaurant name' : 'Beef Wellington';
    $('.ed-hint').textContent = restaurantMode
      ? 'Add the website, cuisine, favorite dishes, and anything you want to remember.'
      : 'Blank lines separate steps. A line ending in “:” becomes a section heading.';
    $('#ed-title').previousElementSibling.textContent = restaurantMode ? 'Restaurant name' : 'Title';
    $('#ed-link').previousElementSibling.textContent = restaurantMode ? 'Website' : 'Source';
    $('#ed-desc').previousElementSibling.textContent = restaurantMode ? 'Why I like it' : 'Description';
    $('#ed-notes').previousElementSibling.textContent = restaurantMode ? 'Notes · location, occasion, reservations' : 'Notes';
    $('#ed-ing').previousElementSibling.textContent = restaurantMode ? 'Foods I enjoy ordering' : 'Ingredients';
    $('#ed-ing').placeholder = restaurantMode ? 'Truffle fries\nLobster ravioli\nChocolate soufflé' : '500 g whole beef fillet\n10 g English mustard';
    ['yield','prep','cook','total','steps','nutr'].forEach(name => {
      $(FIELDS[name]).closest('label').hidden = restaurantMode;
    });
    $('#ed-cats').closest('label').hidden = restaurantMode;
    $('#ed-restaurant-state-wrap').hidden = !restaurantMode;
    $('#editor').hidden = false;
    Icons.paint($('#editor'));
    $('#ed-title').focus();
  }

  function close() { $('#editor').hidden = true; }

  function collect() {
    let title = val('title');
    let link = val('link');
    if (editorMode === 'restaurant' && link && !/^https?:\/\//i.test(link)) link = `https://${link}`;
    if (!title && editorMode === 'restaurant' && link) {
      try {
        const host = new URL(/^https?:\/\//i.test(link) ? link : `https://${link}`).hostname
          .replace(/^www\./i, '').split('.')[0].replace(/[-_]+/g, ' ');
        title = host.replace(/\b\w/g, letter => letter.toUpperCase());
      } catch (_) { /* the normal title check below handles an invalid link */ }
    }
    if (!title) { $('#ed-title').focus(); return null; }

    // an existing recipe keeps its id so saving updates rather than duplicates
    const categories = val('cats').split(',').map(s => s.trim()).filter(Boolean)
      .filter(category => !/^state\s*:/i.test(category));
    if (editorMode === 'restaurant') {
      if (!categories.some(category => /^restaurants?$/i.test(category))) categories.unshift('Restaurants');
      const stateName = $('#ed-restaurant-state').value.trim();
      if (stateName) categories.push(`State: ${stateName}`);
    }
    return Mela.normalize({
      id: editingId || undefined,
      title,
      link,
      categories,
      yield: val('yield'),
      prepTime: val('prep'),
      cookTime: val('cook'),
      totalTime: val('total'),
      text: val('desc'),
      instructions: val('steps'),
      ingredients: val('ing'),
      notes: val('notes'),
      nutrition: val('nutr'),
      images: photos.slice(),
      date: Date.now()
    });
  }

  function bind() {
    $('#ed-cancel').addEventListener('click', close);

    $('#ed-save').addEventListener('click', async () => {
      const recipe = collect();
      if (!recipe) return;
      close();
      await onSaved(recipe, editingId !== null);
    });

    $('#ed-photo-file').addEventListener('change', async e => {
      const files = [...e.target.files];
      e.target.value = '';
      for (const file of files) {
        try { photos.push(await readPhoto(file)); }
        catch (err) { console.error(err); }
      }
      renderPhotos();
    });

    document.addEventListener('keydown', e => {
      if ($('#editor').hidden) return;
      if (e.key === 'Escape') close();
      if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); $('#ed-save').click(); }
    });
  }

  document.addEventListener('DOMContentLoaded', bind);
  global.Editor = { open, close, readPhoto };

})(window);

</script>
<script>
/* ============================================================
   app.js — three panes, one selection, no framework.
   ============================================================ */

(function () {
  'use strict';

  /* Shown in the sidebar. Twelve builds of this file share a filename, so a
     visible marker is the only quick way to tell which one is open. */
  const BUILD = 'v144 — Recipe branding';

  const $ = s => document.querySelector(s);

  const SMART = [
    { id: 'all',    label: 'All',           ico: 'allRecipes' },
    { id: 'recent', label: 'Most Recent',   ico: 'clock'   },
    { id: 'want',   label: 'Want to Cook',  ico: 'flag'    },
    { id: 'fav',    label: 'Favorites',     ico: 'heart'   },
    { id: 'none',   label: 'Uncategorized', ico: 'tagoff'  }
  ];

  const LIBRARY_SECTIONS = [
    { id: 'group:drinks',   label: 'Drinks',   ico: 'drink' },
    { id: 'group:appetizers', label: 'Appetizers', ico: 'appetizer' },
    { id: 'group:snacks', label: 'Snacks', ico: 'snack' },
    { id: 'group:mains',    label: 'Main Dishes', ico: 'mainDish' },
    { id: 'group:sides',    label: 'Sides', ico: 'sideDish' },
    { id: 'group:desserts', label: 'Desserts', ico: 'dessert' },
    { id: 'group:holidays', label: 'Holidays', ico: 'holiday' }
  ];
  const NESTED_LIBRARY_SECTIONS = new Set(['drinks', 'mains', 'holidays']);

  const state = {
    recipes: [],
    restaurants: [],
    collection: 'all',      // a SMART id, or 'cat:Desserts'
    page: 'recipe',         // 'recipe' | 'calendar' | 'groceries'
    catsOpen: false,
    libraryOpen: { drinks: false, appetizers: false, snacks: false, mains: false, sides: false, desserts: false, holidays: false },
    sort: 'title',          // 'title' | 'date' | 'stale'
    cookedFilter: 'any',    // 'any' | 'yes' | 'no'
    query: '',
    current: null,
    servings: 4,
    base: 4,
    off: new Set(),
    step: 0,
    list: [],
    plan: {},              // date key -> [recipe id]
    planPeriods: {},       // date key -> { recipe id: morning | afternoon | night }
    fridge: [],
    fridgeStaples: true,
    fridgePlace: 'fridge',
    fridgeView: 'visual',
    kitchenFoodType: 'snacks',
    kitchenRecipes: [],
    kitchenHidden: [],
    customHolidays: [],
    swipe: { seen: [], liked: [], excluded: [], noUncategorized: false },
    swipeView: 'home',     // 'home' | 'deck' | 'picks' | 'filters'
    restaurantDeckIndex: 0,
    restaurantStateFilter: 'all',
    heroFilter: 'all',     // daily slideshow: all | recent | want | fav
    seed: Math.floor(Math.random() * 1e6),
    weekAt: null,          // Date of the week being viewed
    timers: []
  };

  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const domain = url => {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
  };

  /* ─────────── boot ─────────── */

  async function boot() {
    try {
      await load();
    } catch (err) {
      // Never leave a blank window. Draw the interface, say what went wrong,
      // and let the person carry on — a broken read is not a broken app.
      console.error('Startup failed:', err);
      try { bind(); renderSidebar(); renderList(); } catch (e) { console.error(e); }
      toast('Something went wrong loading your data. Your recipes are still saved — reloading may fix it.', 9000);
      return;
    }
  }

  async function load() {
    await Store.ready();
    const allSavedEntries = (await Store.allRecipes()) || [];
    state.restaurants = (await Store.pref('restaurants')) || [];
    const restaurantIds = new Set(state.restaurants.map(item => String(item.id)));
    allSavedEntries.filter(item => inCollection(item, 'restaurants')).forEach(item => {
      if (!restaurantIds.has(String(item.id))) state.restaurants.push(item);
    });
    state.recipes = allSavedEntries.filter(item => !inCollection(item, 'restaurants'));
    await Store.pref('restaurants', state.restaurants);
    for (const legacyRestaurant of allSavedEntries.filter(item => inCollection(item, 'restaurants'))) {
      await Store.deleteRecipe(legacyRestaurant.id);
    }
    state.kitchenRecipes = (await Store.pref('kitchenRecipes')) || [];
    state.kitchenHidden = (await Store.pref('kitchenHidden')) || [];
    state.customHolidays = (await Store.pref('customHolidays')) || [];
    await seedKitchenIngredientCategories();
    await syncKitchenRecipeLibrary();
    state.list = (await Store.pref('list')) || [];
    state.plan = (await Store.pref('plan')) || {};
    state.planPeriods = (await Store.pref('planPeriods')) || {};
    state.fridge = ((await Store.pref('fridge')) || []).map(Fridge.migrate);
    state.fridgePlace = (await Store.pref('fridgePlace')) || 'fridge';
    state.fridgeStaples = (await Store.pref('fridgeStaples')) !== false;
    Food.loadCustom(await Store.pref('foodPics'));
    state.cookedFilter = (await Store.pref('cookedFilter')) || 'any';
    state.sort = (await Store.pref('sort')) || 'title';
    state.heroFilter = (await Store.pref('heroFilter')) || 'all';
    if (!['all', 'recent', 'want', 'fav'].includes(state.heroFilter)) state.heroFilter = 'all';
    await reconcilePastPlans();
    const saved = (await Store.pref('swipe')) || {};
    // the restaurants build nested progress under .recipes; unwrap it so a
    // library swiped through then is not offered up again from scratch
    const nested = saved.recipes || {};
    state.swipe = {
      seen: saved.seen || nested.seen || [],
      liked: saved.liked || nested.liked || [],
      excluded: saved.excluded || [],
      noUncategorized: !!saved.noUncategorized
    };
    state.seed = (await Store.pref('seed')) || state.seed;
    await Store.pref('seed', state.seed);
    state.weekAt = Plan.weekStart(new Date());

    const theme = (await Store.pref('theme')) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
    updateThemeIcon();

    const build = $('#side-build');
    if (build) build.textContent = BUILD;

    bind();
    renderSidebar();
    renderList();
    renderCount();
    Icons.paint();

    if (Store.isMemoryOnly) {
      toast('Storage is unavailable here, so changes will not survive a reload.', 7000);
    } else if (Store.wasRepaired) {
      toast('Storage was out of date and has been repaired.', 4000);
    }
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }

  function bind() {
    const logo = $('.side-title');
    logo.setAttribute('role', 'button');
    logo.setAttribute('tabindex', '0');
    logo.setAttribute('aria-label', 'Show all recipes');
    logo.addEventListener('click', showLibraryHome);
    logo.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showLibraryHome(); }
    });
    $('#btn-side').addEventListener('click', () => openSide(true));
    $('#scrim').addEventListener('click', () => openSide(false));
    $('#btn-back').addEventListener('click', () => { document.body.dataset.pane = 'list'; });

    $('#btn-search').addEventListener('click', toggleSearch);
    $('#btn-filter').addEventListener('click', event => {
      event.stopPropagation();
      const menu = $('#category-filter-menu');
      const opening = menu.hidden;
      if (opening) renderCategoryFilterMenu();
      menu.hidden = !opening;
      $('#btn-filter').setAttribute('aria-expanded', String(opening));
    });
    $('#category-filter-menu').addEventListener('click', event => event.stopPropagation());
    document.addEventListener('click', closeCategoryFilterMenu);
    const SORTS = ['title', 'date', 'stale'];
    $('#btn-sort').addEventListener('click', async () => {
      state.sort = SORTS[(SORTS.indexOf(state.sort) + 1) % SORTS.length];
      await Store.pref('sort', state.sort);
      renderList();
    });

    $('#cookedbar').querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => {
        state.collection = b.dataset.library;
        state.cookedFilter = 'any';
        renderSidebar();
        renderList();
      }));
    $('#search').addEventListener('input', e => {
      state.query = e.target.value.trim().toLowerCase();
      if (state.page === 'fridge') renderKitchenFoodColumn(); else renderList();
    });

    $('#btn-recipe-files').addEventListener('click', e => {
      e.stopPropagation();
      setRecipeFilesMenu($('#recipe-files-menu').hidden);
    });
    $('#recipe-files-menu').addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => setRecipeFilesMenu(false));
    ['#btn-import', '#btn-import-empty'].forEach(s =>
      $(s).addEventListener('click', () => { setRecipeFilesMenu(false); $('#file').click(); }));
    $('#btn-export').addEventListener('click', exportRecipes);
    $('#btn-add').addEventListener('click', openNewEntry);
    $('#btn-new-empty').addEventListener('click', () => Editor.open(null, saveEdited));
    $('#file').addEventListener('change', async e => { await importFiles(e.target.files); e.target.value = ''; });
    $('#btn-demo').addEventListener('click', loadDemo);
    $('#btn-cookbook').addEventListener('click', showLibraryHome);
    $('#btn-discover').addEventListener('click', () => { select('discover'); openSide(false); });
    $('#btn-dining').addEventListener('click', () => { select('restaurants'); openSide(false); });
    $('#btn-calendar').addEventListener('click', () => { select('calendar'); openSide(false); });
    $('#btn-groceries').addEventListener('click', () => { select('groceries'); openSide(false); });
    $('#btn-cookfrom').addEventListener('click', () => { select('cookfrom'); openSide(false); });
    $('#btn-fridge').addEventListener('click', () => { select('fridge'); openSide(false); });
    $('#btn-settings').addEventListener('click', () => {
      const menu = $('#settings-submenu');
      const opening = menu.hidden;
      menu.hidden = !opening;
      $('#btn-settings').setAttribute('aria-expanded', String(opening));
    });
    // reflect the active page on the two footer buttons
    updateFooterState();
    $('#btn-theme').addEventListener('click', toggleTheme);

    $('#lb-close').addEventListener('click', closeLightbox);
    $('#lb-prev').addEventListener('click', () => lightboxStep(-1));
    $('#lb-next').addEventListener('click', () => lightboxStep(1));
    $('#lightbox').addEventListener('click', e => {
      // anything that is not the photo or a control is backdrop, and closes.
      // Listing the backdrop elements instead missed the track itself.
      if (e.target.tagName === 'IMG' || e.target.closest('button')) return;
      closeLightbox();
    });

    $('#cook-close').addEventListener('click', closeCook);
    $('#cook-prev').addEventListener('click', () => cookMove(-1));
    $('#cook-next').addEventListener('click', () => cookMove(1));
    $('#cook-step').addEventListener('click', onChip);
    $('#cook-rail').addEventListener('click', onRailToggle);

    document.addEventListener('keydown', e => {
      if (!$('#lightbox').hidden) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') lightboxStep(-1);
        if (e.key === 'ArrowRight') lightboxStep(1);
        return;
      }
      if ($('#cook').hidden) {
        if (e.key === 'Escape') {
          if (!$('#recipe-files-menu').hidden) setRecipeFilesMenu(false);
          else openSide(false);
        }
        if (state.page === 'discover' && state.swipeView === 'deck' && $('#d-pass')) {
          if (e.key === 'ArrowLeft') $('#d-pass').click();
          if (e.key === 'ArrowRight') $('#d-keep').click();
        }
        return;
      }
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); cookMove(1); }
      if (e.key === 'ArrowLeft') cookMove(-1);
      if (e.key === 'Escape') closeCook();
    });

    ['dragover', 'drop'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
    document.addEventListener('drop', async e => {
      const files = e.dataTransfer && e.dataTransfer.files;
      if (!files || !files.length) return;
      const images = [...files].filter(f => f.type.startsWith('image/'));
      // an image dropped while a recipe is open belongs to that recipe;
      // anything else is a library import
      if (images.length && state.current && state.page === 'recipe') {
        await addPhotosToRecipe(images);
      } else {
        importFiles(files);
      }
    });

    $('#sprite-file').addEventListener('change', async e => {
      const file = [...e.target.files][0];
      e.target.value = '';
      if (!file || !pictureFor) return;
      try {
        Food.setCustom(pictureFor.name, await Food.makeSprite(file));
        await saveFoodPics();
        toast(`Picture set for ${pictureFor.name}.`);
        if (pictureFor.after) pictureFor.after();
      } catch (err) {
        toast(err.message, 4000);
      }
      pictureFor = null;
    });

    $('#photo-file').addEventListener('change', async e => {
      // copy before clearing: FileList is live, so resetting the input to
      // allow re-picking the same file also empties the list you are holding
      const files = [...e.target.files];
      e.target.value = '';
      await addPhotosToRecipe(files);
    });

    // paste an image straight onto an open recipe
    document.addEventListener('paste', async e => {
      if (!state.current || state.page !== 'recipe') return;
      if (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
      const items = [...(e.clipboardData ? e.clipboardData.files : [])];
      if (items.length) { e.preventDefault(); await addPhotosToRecipe(items); }
    });
  }

    document.documentElement.dataset.theme = next;

  /* ─────────── what you have cooked ─────────── */

  const hasCooked = r => (r.cooked || 0) > 0;

  async function markCooked(r, when) {
    r.cooked = (r.cooked || 0) + 1;
    r.history = (r.history || []).concat(when || Date.now());
    r.lastCooked = r.history[r.history.length - 1];
    await Store.putRecipes([r]);
  }

  /* Every way of recording a cook has to be reversible. Two of the three are
     automatic — finishing cook mode, and a planned day going by — so a wrong
     entry is not a rare accident, it is the expected case. */
  async function unmarkCooked(r) {
    r.cooked = Math.max(0, (r.cooked || 0) - 1);
    if (r.history && r.history.length) r.history.pop();
    r.lastCooked = r.cooked && r.history && r.history.length
      ? r.history[r.history.length - 1]
      : 0;
    await Store.putRecipes([r]);
  }

  async function clearCooked(r) {
    r.cooked = 0;
    r.history = [];
    r.lastCooked = 0;
    await Store.putRecipes([r]);
  }

  /* A day on the calendar that has already passed is decent evidence you
     cooked what was on it. Each past day is counted once and remembered, so
     opening the app twice does not claim you cooked it twice. */
  async function reconcilePastPlans() {
    const seen = (await Store.pref('plansCounted')) || [];
    const done = new Set(seen);
    const todayKey = Plan.key(new Date());
    const touched = [];

    Object.keys(state.plan).forEach(k => {
      if (k >= todayKey || done.has(k)) return;
      (state.plan[k] || []).forEach(id => {
        const r = state.recipes.find(x => x.id === id);
        if (!r) return;
        r.cooked = (r.cooked || 0) + 1;
        r.lastCooked = Math.max(r.lastCooked || 0, Plan.fromKey(k));
        touched.push(r);
      });
      done.add(k);
    });

    if (touched.length) await Store.putRecipes(touched);
    if (done.size !== seen.length) await Store.pref('plansCounted', [...done]);
  }

  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];

  /* Relative while that is still meaningful, then a month — "14 weeks ago"
     tells you nothing, "in May" does. */
  function agoLabel(ms) {
    if (!ms) return '';
    const then = new Date(ms);
    const days = Math.round((Plan.midnight(new Date()) - Plan.midnight(then)) / Fridge.DAY);
    if (days <= 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 7) return days + ' days ago';
    if (days < 14) return 'last week';
    if (days < 56) return Math.round(days / 7) + ' weeks ago';
    if (days < 365) return 'in ' + MONTHS[then.getMonth()];
    return 'in ' + MONTHS[then.getMonth()] + ' ' + then.getFullYear();
  }

  /* ─────────── collections ─────────── */

  function categoryNames() {
    const seen = new Set();
    state.recipes.forEach(r => r.categories.forEach(c => seen.add(c)));
    return [...seen].sort((a, b) => a.localeCompare(b));
  }

  function categoryBelongsToSection(category, section) {
    const tag = category.trim().toLowerCase();
    if (section === 'drinks') return /^(drinks?|beverages?|alcoholic|non-alcoholic|cocktails?|mocktails?|smoothies?|coffee|tea|juice|wine|beer|cider|spirits?|liquor)$/.test(tag);
    if (section === 'appetizers') return /^(appetizers?|starters?|dips?|finger food|hors d'oeuvre)$/.test(tag);
    if (section === 'snacks') return /^(snack|snacks)$/i.test(tag);
    if (section === 'mains') return /^(main dishes?|main courses?|entrées?|entrees?|dinner|lunch|burritos? & wraps?|cereal|comfort|grains?|italian|meats?|sandwiches? & subs?|seafood|soups?)$/.test(tag);
    if (section === 'sides') return /^(sides?|side dishes?|salads?|vegetables?|bread|fruits?)$/.test(tag);
    if (section === 'desserts') return /^(desserts?|cakes?|cookies?|brownies?|pies?|pudding|sweets?|candy|chocolate|ice cream)$/.test(tag);
    if (section === 'holidays') return /^(holidays?|christmas|halloween|thanksgiving|easter|valentines?|valentine's day|fourth of july|4th of july|new years?|new year's)$/.test(tag)
      || (state.customHolidays || []).some(name => String(name).trim().toLowerCase() === tag);
    return false;
  }

  function isLibraryRecipe(r, section) {
    return r.categories.some(category => categoryBelongsToSection(category, section));
  }

  function isAlcoholicDrink(r) {
    const text = `${r.title} ${r.categories.join(' ')}`.toLowerCase();
    return /\balcohol|cocktail|wine|beer|hard cider|champagne|prosecco|spirit|liquor|vodka|gin|rum|whiskey|whisky|bourbon|tequila|brandy|liqueur|martini|margarita|sangria/.test(text)
      && !/non[- ]?alcoholic|alcohol[- ]?free|mocktail/.test(text);
  }

  function sectionCategoryNames(section) {
    const seen = new Set();
    if (section === 'holidays') (state.customHolidays || []).forEach(name => seen.add(name));
    state.recipes.forEach(r => r.categories.forEach(category => {
      if (categoryBelongsToSection(category, section)) seen.add(category);
    }));
    return [...seen].sort((a, b) => a.localeCompare(b));
  }

  async function addCustomHoliday() {
    const entered = prompt('What holiday would you like to add?');
    const name = String(entered || '').trim().replace(/\s+/g, ' ');
    if (!name) return;
    const existing = sectionCategoryNames('holidays').find(item => item.toLowerCase() === name.toLowerCase());
    if (existing) return toast(`${existing} is already in Holidays.`);
    state.customHolidays = [...(state.customHolidays || []), name].sort((a, b) => a.localeCompare(b));
    await Store.pref('customHolidays', state.customHolidays);
    state.libraryOpen.holidays = true;
    renderSidebar();
    toast(`${name} added. Add “${name}” as a category when editing a recipe.` , 6000);
  }

  function inCollection(r, id) {
    // Holiday recipes stay in their dedicated Holidays section instead of
    // mixing into the everyday All and Most Recent recipe lists.
    if (id === 'all' || id === 'recent') return !isLibraryRecipe(r, 'holidays');
    if (id === 'want') return r.wantToCook;
    if (id === 'fav') return r.favorite;
    if (id === 'cooked') return hasCooked(r);
    if (id === 'restaurants') return r.categories.some(c => /^(restaurant|restaurants|takeout|dining out|copycat)$/i.test(c.trim()));
    if (id === 'drink:alcoholic') return isLibraryRecipe(r, 'drinks') && isAlcoholicDrink(r);
    if (id === 'drink:nonalcoholic') return isLibraryRecipe(r, 'drinks') && !isAlcoholicDrink(r);
    if (id.startsWith('group:')) return isLibraryRecipe(r, id.slice(6));
    if (id === 'none') return r.categories.length === 0;
    if (id.startsWith('cat:')) return r.categories.includes(id.slice(4));
    return true;
  }

  function collectionLabel(id) {
    if (id.startsWith('cat:')) return id.slice(4);
    if (id === 'drink:alcoholic') return 'Alcoholic';
    if (id === 'drink:nonalcoholic') return 'Non-Alcoholic';
    if (id === 'restaurants') return 'Dining Out';
    if (id === 'cooked') return 'Cooked';
    if (id.startsWith('group:')) return (LIBRARY_SECTIONS.find(s => s.id === id) || {}).label || 'Recipes';
    return (SMART.find(s => s.id === id) || {}).label || 'All';
  }

  function select(id) {
    if (id !== 'all') {
      state.catsOpen = false;
      Object.keys(state.libraryOpen).forEach(name => { state.libraryOpen[name] = false; });
    }
    // Calendar and Groceries are pages, not filters — they open in the
    // detail pane and leave the recipe list alone, so you can still pick
    // something to plan or shop for while looking at them
    if (id === 'calendar' || id === 'groceries' || id === 'discover' || id === 'fridge' || id === 'cookfrom') {
      state.page = id;
      if (id === 'fridge') {
        state.query = '';
        $('#search').value = '';
        $('#searchbar').hidden = true;
      }
      renderSidebar();
      if (id === 'fridge') renderKitchenFoodColumn();
      else if (id === 'cookfrom') renderCookFromColumn();
      else renderList();
      if (id === 'calendar' || id === 'groceries' || id === 'discover') showListPlaceholder();
      ({ calendar: renderCalendar, groceries: renderGroceries,
         discover: renderDiscover, fridge: renderFridge, cookfrom: renderCookFromPantry }[id])();
      document.body.dataset.pane = 'detail';
      return;
    }
    state.collection = id;
    state.page = 'recipe';
    if (id === 'restaurants') resetDetailPlaceholder();
    renderSidebar();
    renderList();
  }

  function resetDetailPlaceholder() {
    state.current = null;
    const sheet = $('#sheet');
    sheet.hidden = true;
    sheet.innerHTML = '';
    $('#placeholder').hidden = false;
    $('#detail').scrollTop = 0;
  }

  function showListPlaceholder() {
    const list = $('#list');
    let rest = list.querySelector('.column-placeholder');
    if (!rest) {
      rest = document.createElement('div');
      rest.className = 'column-placeholder';
      rest.setAttribute('aria-hidden', 'true');
      const mark = $('#placeholder .placeholder-mark').cloneNode(true);
      mark.removeAttribute('class');
      rest.appendChild(mark);
      list.appendChild(rest);
    }
    list.classList.add('is-resting');
    list.scrollTop = 0;
  }

  function showLibraryHome() {
    clearInterval(homeHeroTimer);
    state.current = null;
    state.page = 'recipe';
    state.collection = 'all';
    state.cookedFilter = 'any';
    state.query = '';
    const search = $('#search');
    if (search) search.value = '';
    $('#sheet').hidden = true;
    $('#sheet').innerHTML = '';
    $('#placeholder').hidden = false;
    document.body.dataset.pane = 'list';
    $('#list').scrollTop = 0;
    $('#detail').scrollTop = 0;
    renderSidebar();
    renderList();
    openSide(false);
  }

  function updateFridgeCount() {
    const el = $('#fridge-count');
    if (el) el.textContent = state.fridge.length || '';
  }

  function updateFooterState() {
    updateFridgeCount();
    [['#btn-discover', 'discover'], ['#btn-calendar', 'calendar'],
     ['#btn-groceries', 'groceries'], ['#btn-fridge', 'fridge'], ['#btn-cookfrom', 'cookfrom']].forEach(([sel, page]) => {
      const b = $(sel);
      if (state.page === page) b.setAttribute('aria-current', 'true');
      else b.removeAttribute('aria-current');
    });
    const dining = $('#btn-dining');
    if (state.page === 'recipe' && state.collection === 'restaurants') dining.setAttribute('aria-current', 'true');
    else dining.removeAttribute('aria-current');
    const cookbook = $('#btn-cookbook');
    if (cookbook) {
      const active = state.page === 'recipe' && state.collection !== 'restaurants';
      if (active) cookbook.setAttribute('aria-current', 'true'); else cookbook.removeAttribute('aria-current');
    }
  }

  function renderSidebar() {
    updateFooterState();
    Icons.paint($('#side'));
  }

  function closeCategoryFilterMenu() {
    const menu = $('#category-filter-menu');
    const button = $('#btn-filter');
    if (menu) menu.hidden = true;
    if (button) button.setAttribute('aria-expanded', 'false');
  }

  function renderCategoryFilterMenu() {
    const menu = $('#category-filter-menu');
    if (!menu) return;
    const choices = [
      { id: 'all', label: 'All Recipes', ico: 'allRecipes' },
      { id: 'cooked', label: 'Cooked', ico: 'chefHat' },
      ...LIBRARY_SECTIONS
    ];
    menu.innerHTML = choices.map(item => `<button type="button" data-quick-category="${esc(item.id)}" aria-current="${state.collection === item.id}"><span class="ico" data-ico="${esc(item.ico)}"></span><span>${esc(item.label)}</span></button>`).join('');
    menu.querySelectorAll('[data-quick-category]').forEach(button => button.addEventListener('click', () => {
      closeCategoryFilterMenu();
      select(button.dataset.quickCategory);
    }));
    Icons.paint(menu);
  }

  function sideRow(label, ico, id, twist, onTwist, twistOpen) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'side-row';
    b.type = 'button';
    b.innerHTML =
      (twist ? `<span class="twist ico" data-ico="twist" role="button" tabindex="0"
                 aria-label="Show categories" aria-expanded="${twistOpen ?? state.catsOpen}"></span>` : '')
      + `<span class="ico" data-ico="${ico}"></span><span class="lbl">${esc(label)}</span>`;
    const active = (id === 'calendar' || id === 'groceries')
      ? state.page === id
      : state.page === 'recipe' && state.collection === id;
    if (active) b.setAttribute('aria-current', 'true');

    b.addEventListener('click', e => {
      if (e.target.closest('.twist')) {
        if (onTwist) onTwist();
        else state.catsOpen = !state.catsOpen;
        renderSidebar();
        return;
      }
      select(id);
      openSide(false);
    });
    li.appendChild(b);
    return li;
  }

  /* ─────────── list column ─────────── */

  function setRecipeFilesMenu(open) {
    const menu = $('#recipe-files-menu');
    const button = $('#btn-recipe-files');
    if (!menu || !button) return;
    menu.hidden = !open;
    button.setAttribute('aria-expanded', String(open));
  }

  function exportRecipes() {
    setRecipeFilesMenu(false);
    if (!state.recipes.length) {
      toast('There are no recipes to export yet.');
      return;
    }

    try {
      const json = Mela.toMelaJSON(state.recipes);
      const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const day = new Date().toISOString().slice(0, 10);
      const link = document.createElement('a');
      link.href = url;
      link.download = `Recipe-library-${day}.json`;
      link.hidden = true;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast(`Exported ${state.recipes.length} recipe${state.recipes.length === 1 ? '' : 's'} with photos.`);
      openSide(false);
    } catch (err) {
      console.error('Recipe export failed:', err);
      toast('The export could not be created. Your recipes are still safe.', 6000);
    }
  }

  function visible() {
    let out = state.collection === 'restaurants'
      ? [...state.restaurants]
      : state.recipes.filter(r => inCollection(r, state.collection));
    if (state.query) {
      out = out.filter(r => {
        const hay = (r.title + ' ' + r.ingredients.join(' ') + ' ' + r.categories.join(' ')).toLowerCase();
        return state.query.split(/\s+/).every(w => hay.includes(w));
      });
    }
    if (state.collection !== 'restaurants') {
      if (state.cookedFilter === 'yes') out = out.filter(hasCooked);
      else if (state.cookedFilter === 'no') out = out.filter(r => !hasCooked(r));
    }

    const by = state.collection === 'recent' ? 'date' : state.sort;
    if (by === 'date') return out.sort((a, b) => b.date - a.date);
    // "due a turn": never-cooked first, then whatever you cooked longest ago
    if (by === 'stale') return out.sort((a, b) =>
      (a.lastCooked || 0) - (b.lastCooked || 0) || a.title.localeCompare(b.title));
    return out.sort((a, b) => a.title.localeCompare(b.title));
  }

  function renderCookedBar() {
    const counts = {
      all: state.recipes.filter(r => inCollection(r, 'all')).length,
      want: state.recipes.filter(r => inCollection(r, 'want')).length,
      fav: state.recipes.filter(r => inCollection(r, 'fav')).length
    };
    $('#cookedbar').querySelectorAll('button').forEach(b => {
      const id = b.dataset.library;
      b.querySelector('span').textContent = counts[id];
      b.setAttribute('aria-pressed', String(state.collection === id));
    });
  }

  function renderList() {
    $('#list').classList.remove('is-resting');
    updateAddButton();
    const dining = state.page === 'recipe' && state.collection === 'restaurants';
    $('#cookedbar').hidden = dining;
    $('#btn-filter').hidden = dining;
    $('#btn-search').hidden = false;
    $('#btn-add').hidden = false;
    $('#btn-sort').hidden = false;
    if (!dining) renderCookedBar();
    const found = visible();
    $('#lt-name').textContent = collectionLabel(state.collection);
    $('#lt-count').textContent = dining
      ? `${found.length} restaurant${found.length === 1 ? '' : 's'}`
      : `${found.length} recipe${found.length === 1 ? '' : 's'}`;
    $('#btn-sort').title = { date: 'Sorted by date added', stale: 'Sorted by due a turn' }[state.sort]
      || 'Sorted by title';

    const rows = $('#rows');
    rows.innerHTML = '';
    $('#list-empty').hidden = dining || state.recipes.length > 0;
    if (!dining && state.recipes.length === 0) return;

    if (!found.length) {
      rows.innerHTML = dining
        ? `<div style="padding:28px 16px;color:var(--ink-faint)"><p>No favorite restaurants yet.</p><button type="button" class="btn primary" id="dining-add-empty">Add a restaurant</button></div>`
        : `<p style="color:var(--ink-faint);padding:24px 6px">Nothing here.</p>`;
      const emptyAdd = $('#dining-add-empty');
      if (emptyAdd) emptyAdd.addEventListener('click', openNewEntry);
      return;
    }

    const frag = document.createDocumentFragment();
    if (dining) {
      const groups = new Map();
      found.forEach(r => {
        const stateName = restaurantState(r);
        if (!groups.has(stateName)) groups.set(stateName, []);
        groups.get(stateName).push(r);
      });
      [...groups.keys()].sort((a, b) => a === 'State not added' ? 1 : b === 'State not added' ? -1 : a.localeCompare(b))
        .forEach(stateName => {
          const heading = document.createElement('h3');
          heading.className = 'restaurant-state-heading';
          heading.textContent = stateName;
          frag.appendChild(heading);
          groups.get(stateName).forEach(r => frag.appendChild(restaurantRowEl(r)));
        });
    } else {
      found.forEach(r => frag.appendChild(rowEl(r)));
    }
    rows.appendChild(frag);
    Icons.paint(rows);
  }

  function restaurantState(r) {
    const categories = Array.isArray(r && r.categories) ? r.categories : [];
    const tag = categories.find(category => /^state\s*:/i.test(String(category)));
    return tag ? tag.replace(/^state\s*:\s*/i, '').trim() || 'State not added' : 'State not added';
  }

  function restaurantRowEl(r) {
    const b = document.createElement('button');
    b.className = 'row';
    b.type = 'button';
    if (state.current && state.current.id === r.id) b.setAttribute('aria-current', 'true');

    const dishesList = Array.isArray(r.ingredients) ? r.ingredients : [];
    const img = (r.thumb || images[0])

  function rowEl(r) {
    const b = document.createElement('button');
    b.className = 'row';

  /* ─────────── recipe ─────────── */

  function openRecipe(id) {
    const r = state.recipes.find(x => x.id === id);
    if (!r) return;
    state.current = r;
    state.page = 'recipe';
    updateFooterState();
    state.base = Units.baseServings(r.yield);
    state.servings = state.base;
    state.off = new Set();
    state.step = 0;
    renderRecipe();
    document.body.dataset.pane = 'detail';
    $('#detail').scrollTop = 0;
    renderList();
  }

  function openRestaurant(id) {
    const r = state.restaurants.find(x => String(x.id) === String(id));
    if (!r) return;
    state.current = r;
    state.page = 'recipe';
    state.collection = 'restaurants';
    updateFooterState();
    renderRestaurant(r);
    document.body.dataset.pane = 'detail';
    $('#detail').scrollTop = 0;
    renderList();
  }

  const factor = () => state.servings / state.base;

  async function saveEdited(recipe, wasEditing) {
    recipe.thumb = recipe.images[0] ? await makeThumb(recipe.images[0]) : '';
    await Store.putRecipes([recipe]);
    const i = state.recipes.findIndex(x => x.id === recipe.id);
    if (i >= 0) state.recipes[i] = recipe; else state.recipes.push(recipe);
    await syncKitchenRecipeLibrary();
    renderSidebar();
    renderList();
    openRecipe(recipe.id);
    toast(wasEditing ? 'Saved.' : `Added ${recipe.title}.`);
  }

  async function saveRestaurant(restaurant, wasEditing) {
    restaurant.categories = Array.isArray(restaurant.categories) ? restaurant.categories : [];
    if (!restaurant.categories.some(category => /^(restaurant|restaurants|dining out)$/i.test(category.trim()))) {
      restaurant.categories.unshift('Restaurants');
    }
    restaurant.thumb = restaurant.images[0] ? await makeThumb(restaurant.images[0]) : '';
    const index = state.restaurants.findIndex(item => String(item.id) === String(restaurant.id));
    if (index >= 0) state.restaurants[index] = restaurant; else state.restaurants.push(restaurant);
    await Store.pref('restaurants', state.restaurants);
    renderSidebar();
    renderList();
    openRestaurant(restaurant.id);
    toast(wasEditing ? 'Restaurant saved.' : `${restaurant.title} added to Dining Out.`);
  }

  function renderRecipe() {

      ${r.description ? `<div class="restaurant-about">${md(esc(r.description))}</div>` : ''}
