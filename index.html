<style>
/* ============================================================
   Recipe — a reading room for recipes.

   Three panes, the way a Mac library app is built: collections,
   list, recipe. On a folding phone the same three panes stack
   and slide instead of sitting side by side.
   ============================================================ */

:root {
  --side:     #ECEBDD;   /* soft leafy sage                  */
  --list:     #FFFCF5;   /* warm ceramic white               */
  --page:     #F8F0E3;   /* pita-and-parchment cream         */
  --ink:      #34251F;   /* dark walnut                      */
  --ink-soft: #74645A;
  --ink-faint:#A49486;
  --rule:     rgba(73, 52, 40, .14);
  --accent:      #397A3D;   /* leafy greens from the table      */
  --accent-fill: #397A3D;
  --accent-wash: rgba(76, 145, 68, .14);
  --harvest:     #E87524;   /* roasted pepper and sweet potato  */
  --beet:        #A91F55;   /* beet hummus and radish           */
  --danger:      #B52A3D;
  --sel:      rgba(104, 126, 66, .10);
  --side-panel: #F1E8D9;
  --panel-w: 320px;

  --serif: "Source Serif 4", Charter, Georgia, "Times New Roman", serif;
  --ui: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --side-w: 244px;
  --list-w: 336px;
  --head-h: 58px;
}

[data-theme="dark"] {
  --side:     #211C18;
  --list:     #181512;
  --page:     #1E1915;
  --ink:      #F7EDDC;
  --ink-soft: #C1B19F;
  --ink-faint:#897A6E;
  --rule:     rgba(247, 237, 220, .14);
  --accent:      #91CF68;
  --accent-fill: #477D3B;
  --accent-wash: rgba(145, 207, 104, .16);
  --harvest:     #FF9A45;
  --beet:        #ED628B;
  --danger:      #F2766E;
  --sel:      rgba(247, 237, 220, .09);
  --side-panel: #29231D;
}

* { box-sizing: border-box; }

html { margin: 0; padding: 0; }

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--page);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

.skip { position: absolute; left: -999px; background: var(--accent-fill); color: #fff; padding: 10px 14px; z-index: 99; }
.skip:focus { left: 8px; top: 8px; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 5px; }
[hidden] { display: none !important; }

.ico { display: inline-flex; width: 19px; height: 19px; flex: 0 0 19px; }
.ico svg { width: 100%; height: 100%; display: block; }
.ico.big { width: 76px; height: 76px; flex-basis: 76px; }

.icon-btn {
  display: inline-grid; place-items: center;
  width: 34px; height: 34px; flex: 0 0 34px;
  border: 0; border-radius: 9px;
  background: none; color: var(--ink-soft);
  cursor: pointer;
}
.icon-btn:hover { background: var(--sel); color: var(--ink); }

.btn {
  font-family: var(--ui); font-size: 14.5px; font-weight: 500;
  background: var(--list); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 9px;
  padding: 9px 16px; cursor: pointer;
}
.btn:hover { border-color: var(--ink-faint); }
.btn.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.quiet { background: none; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .38; cursor: default; }

/* ═══════════ the shell ═══════════ */

.shell {
  display: grid;
  grid-template-columns: 1fr;
  min-height: 100dvh;
}

/* ─────────── sidebar ─────────── */

.side {
  background: var(--side);
  padding: 18px 12px 12px;
  display: flex; flex-direction: column;
  overflow-y: auto;
}

.side-title {
  margin: 8px 10px 24px;
  line-height: 0;
  width: fit-content; cursor: pointer; border-radius: 9px;
}
.side-title:hover { opacity: .78; }
/* The mark is a cut-out, so it needs a second file in a light ink rather
   than a filter — inverting would turn the rosemary magenta. */
.side-title img {

.smart, .cats, .library-sections { list-style: none; margin: 0; padding: 0; }
.side.is-browsing-categories .smart > li:not(:first-child),
.side.is-browsing-categories .side-foot { display: none; }

.side-row {
  display: flex; align-items: center; gap: 11px;
  width: 100%; text-align: left;
  font: inherit; font-size: 14.5px;
  background: none; border: 0; border-radius: 9px;
  color: var(--ink);
  padding: 8px 10px; cursor: pointer;
}
.side-row:hover { background: var(--sel); }
.side-row.add-holiday { color: var(--accent); font-size: 12px; font-weight: 650; }
.side-row .ico { color: var(--accent); }
.side-row[aria-current="true"] { background: var(--sel); font-weight: 600; }
.side-row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-row .twist {
  width: 14px; height: 14px; flex-basis: 14px;
  margin-left: -4px; color: var(--ink-faint);
  transition: transform .16s ease;
}
.side-row .twist[aria-expanded="true"] { transform: rotate(90deg); }
.side-row .twist:hover { color: var(--ink); }
.side-row .pill {
  margin-left: auto; background: var(--accent-fill); color: #fff;
  font-family: var(--mono); font-size: 10.5px;
  border-radius: 999px; padding: 1px 7px;
}

.cats { margin: 2px 0 6px; }
.cats .side-row { padding-left: 32px; font-size: 14px; }
.cats .side-row .ico { color: var(--ink-faint); }
.library-sections { margin: 2px 0 7px 18px; }
.library-sections > li > .side-row { font-size: 14px; padding: 7px 9px; }
.library-sections .cats { margin-left: 15px; border-left: 1px solid var(--rule); }
.library-sections .cats .side-row { padding-left: 18px; font-size: 13.5px; }
.side-foot { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--rule); }
.side-build {
  margin: 12px 10px 2px; font-family: var(--mono); font-size: 10.5px;
  color: var(--ink-faint); letter-spacing: .02em;
}

/* ─────────── list column ─────────── */

.list {
  background: var(--list);
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column;
  min-width: 0;
}

.list-head {
  position: sticky; top: 0; z-index: 6;
  display: flex; align-items: center; gap: 6px;
  min-height: var(--head-h);
  padding: 8px 10px;
  padding-top: calc(8px + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--list) 90%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
}
.list-title { margin-right: auto; min-width: 0; padding-left: 6px; }
.lt-name {
  display: block;
  font-family: var(--serif); font-weight: 700; font-size: 19px;
  letter-spacing: -.015em; line-height: 1.15;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lt-sub { display: flex; align-items: center; gap: 2px; }
.lt-count { font-size: 11.5px; color: var(--ink-faint); font-family: var(--mono); }
.sort-btn {
  display: inline-grid; place-items: center;
  width: 18px; height: 18px; padding: 0;
  border: 0; background: none; color: var(--ink-faint); cursor: pointer;
}
.sort-btn .ico { width: 14px; height: 14px; flex-basis: 14px; }
.sort-btn:hover { color: var(--ink); }
.category-filter-menu {
  position: absolute; top: calc(100% - 3px); right: 46px; z-index: 30;
  width: 220px; padding: 6px; border: 1px solid var(--rule); border-radius: 13px;
  background: var(--list); box-shadow: 0 16px 38px rgba(36,28,20,.18);
}
.category-filter-menu button {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border: 0; border-radius: 8px; background: transparent;
  color: var(--ink); font: inherit; font-size: 13px; text-align: left; cursor: pointer;
}
.category-filter-menu button:hover { background: var(--sel); }
.category-filter-menu button[aria-current="true"] { background: var(--accent-wash); color: var(--accent); font-weight: 650; }
.category-filter-menu .ico { color: var(--accent); }
[data-theme="dark"] .category-filter-menu { background: #302e27; }

.searchbar { padding: 10px 12px; border-bottom: 1px solid var(--rule); }
#search {
  width: 100%; font: inherit; font-size: 15px;
  background: var(--sel); color: var(--ink);
  border: 1px solid transparent; border-radius: 9px;
  padding: 9px 12px;
}
#search:focus { border-color: var(--rule); background: transparent; }

.rows { flex: 1; overflow-y: auto; padding: 0 12px 40px; }

.row {
  position: relative;
  display: grid; grid-template-columns: 92px 1fr; gap: 16px;
  align-items: start;
  width: 100%; text-align: left; font: inherit; color: inherit;
  background: none; border: 0;
  padding: 18px 8px; cursor: pointer;
  border-radius: 10px;
}
/* the rule starts where the title starts, not under the thumbnail */
.row::after {
  content: ""; position: absolute; bottom: 0; height: 1px;
  left: 116px; right: 8px; background: var(--rule);
}
.row:last-child::after { display: none; }
.row:hover { background: var(--sel); }
.row[aria-current="true"] { background: var(--accent-fill); }
.row[aria-current="true"] .row-title,
.row[aria-current="true"] .row-meta,
.row[aria-current="true"] .row-meta .ico,
.row[aria-current="true"] .row-snip { color: #fff; }
.row[aria-current="true"] .row-meta .bar { color: rgba(255,255,255,.5); }
.row[aria-current="true"]::after { display: none; }
.row[aria-current="true"] .row-snip { display: -webkit-box; }

.row-snip {
  display: none;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  font-size: 13px; line-height: 1.4; margin-top: 8px;
}
.row-img {
  width: 92px; height: 92px; border-radius: 7px;
  object-fit: cover; display: block;
  background: var(--sel);
}
.row-img.blank {
  display: grid; place-items: center;
  font-family: var(--serif); font-weight: 700; font-size: 30px;
  color: var(--ink-faint);
}
.row-body { min-width: 0; }
.row-title {
  display: block;
  font-family: var(--serif); font-weight: 600; font-size: 17.5px;
  line-height: 1.26; letter-spacing: -.008em;
  margin: 0 0 14px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.row-meta {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--ink-soft);
  min-width: 0;
}
.row-meta .ico { width: 13px; height: 13px; flex-basis: 13px; color: var(--ink-faint); }
.row-meta .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row-meta .txt.cat { flex: 0 1 auto; }
.row-meta .txt.host { flex: 1 1 40px; }
.row-meta .bar { color: var(--ink-faint); }
.row-flag { color: var(--accent); width: 13px; height: 13px; flex-basis: 13px; }

.list-empty { padding: 40px 22px; text-align: center; }
.list-empty p { color: var(--ink-soft); margin: 0 0 18px; }
.list-empty .btn { margin: 4px; }

/* ─────────── detail column ─────────── */

/* overflow-x is clipped so a card thrown off the deck cannot open a
   horizontal scroll region; it simply leaves at the edge of the pane */
.detail { background: var(--page); overflow-y: auto; overflow-x: hidden; position: relative; min-width: 0; }

.placeholder {
  height: 100%; min-height: 60vh;
  display: grid; place-content: center;
}
/* The mark, faint. Two files rather than a filter, for the same reason as
   the wordmark: inverting would turn the rosemary magenta. */
.placeholder-mark {
  display: block;

.back {
  position: sticky; top: 0; left: 0; z-index: 7;
  margin: 8px 0 -8px 8px;
  margin-top: calc(8px + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--page) 84%, transparent);
  backdrop-filter: blur(10px);
}

/* Four blocks — photo, head, ingredients, method — placed by grid.
   Narrow reads photo → title → ingredients → method, the order you
   want on a phone. Wide puts photo and ingredients in a right column.
   A container query, not a media query: what matters is how wide this
   pane ended up, not how wide the device is. */
.detail { container-type: inline-size; }

/* No padding on .sheet, ever. The panel colour is painted by a gradient
   measured against this box, so any padding here shifts the colour away
   from the column it is filling. Pad the blocks inside instead. */
.sheet { display: grid; padding: 0; }
.s-head { padding: 26px 22px 0; min-width: 0; }
.s-steps { padding: 0 22px 80px; min-width: 0; }
.s-ing { background: var(--side-panel); padding: 20px 22px; min-width: 0; }
.s-photo { position: relative; width: 100%; }
.s-photo.none { display: none; }

.ph-track {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.ph-track::-webkit-scrollbar { display: none; }
.ph-track img {
  flex: 0 0 100%;
  width: 100%;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  display: block;
  scroll-snap-align: start;
}

.ph-dots {
  position: absolute; left: 0; right: 0; bottom: 10px;
  display: flex; justify-content: center; gap: 7px;
}
.ph-dot {
  width: 7px; height: 7px; padding: 0;
  border: 0; border-radius: 50%;
  background: rgba(255, 255, 255, .55);
  box-shadow: 0 0 3px rgba(0, 0, 0, .4);
  cursor: pointer;
}
.ph-dot.on { background: #fff; }

@container (max-width: 599px) {
  .sheet { grid-template-areas: "photo" "head" "ing" "steps"; grid-template-columns: 1fr; }
  .s-ing { margin: 22px 0; }
}

@container (min-width: 600px) {
  .sheet {
    grid-template-columns: minmax(0, 1fr) var(--panel-w);
    grid-template-areas: "head photo" "steps ing";
    align-items: start;
    min-height: 100dvh;
    /* the panel colour is painted by the grid itself, so it reaches the
       bottom of the pane even when the ingredient list is short */
    background: linear-gradient(to right,
      transparent calc(100% - var(--panel-w)),
      var(--side-panel) calc(100% - var(--panel-w)));
  }
  .s-ing { background: none; }
  .s-head { padding: 34px 38px 0; }
  .s-steps { padding: 0 38px 80px; }
  .s-ing { min-height: 100%; padding: 26px 26px 60px; position: sticky; top: 0; }
}

.s-photo { grid-area: photo; }
.s-head  { grid-area: head; }
.s-ing   { grid-area: ing; }
.s-steps { grid-area: steps; }

.r-title {
  font-family: var(--serif); font-weight: 700;
  font-size: clamp(29px, 4.6vw, 42px);
  line-height: 1.06; letter-spacing: -.024em;
  margin: 0 0 16px;
}

.r-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-bottom: 20px; }
.mbit {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 14px; color: var(--ink); text-decoration: none;
}
.mbit .ico { width: 17px; height: 17px; flex-basis: 17px; color: var(--ink-soft); }
a.mbit:hover { color: var(--accent); }

.r-tools {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 2px 0; margin-bottom: 24px;
}
.tool {
  display: inline-flex; align-items: center; gap: 8px;
  font: inherit; font-size: 14.5px;
  background: none; border: 0; color: var(--ink);
  padding: 6px 16px; cursor: pointer;
  border-right: 1px solid var(--rule);
}
.tool:first-child { padding-left: 0; }
.tool:last-child { border-right: 0; }
.tool .ico { color: var(--accent); }
.tool:hover { color: var(--accent); }
.tool.on { color: var(--accent); font-weight: 600; }

.r-desc { font-size: 17px; line-height: 1.55; margin: 0 0 4px; }
.r-rule { border: 0; border-top: 1px solid var(--rule); margin: 0 0 24px; width: 60%; }
.r-foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--rule); }

h2.sec {
  font-family: var(--serif); font-weight: 700;
  font-size: 20px; letter-spacing: -.015em;
  margin: 34px 0 4px;
}

/* servings stepper, revealed by Adjust */
.scaler {
  display: inline-flex; align-items: center;
  background: var(--list);
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 3px; margin-bottom: 24px;
}
.scaler button {
  width: 29px; height: 29px; border-radius: 50%;
  border: 0; background: none; color: var(--ink);
  font-size: 17px; line-height: 1; cursor: pointer;
}
.scaler button:hover { background: var(--sel); }
.scaler .read { font-family: var(--mono); font-size: 12.5px; padding: 0 11px; white-space: nowrap; }
.scaler .s-reset {
  width: auto; border-radius: 999px; padding: 0 12px;
  font-family: var(--ui); font-size: 12px; color: var(--ink-soft);
}

/* ingredients: the quantity carries the weight, the name recedes */
.ing { list-style: none; margin: 0; padding: 0; }
.ing li {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px;
  padding: 7px 6px; cursor: pointer; border-radius: 6px;
  line-height: 1.4;
}
.ing li:hover { background: var(--sel); }
.ing li.group {
  font-family: var(--ui); font-weight: 600; font-size: 15px;
  color: var(--ink); cursor: default;
  padding-top: 24px; padding-bottom: 4px;
}
.ing li.group:hover { background: none; }
.ing .q { font-weight: 600; font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
.ing .nm { font-size: 15px; color: var(--ink-soft); }
.ing li.off { opacity: .4; }
.ing li.off .nm, .ing li.off .q { text-decoration: line-through; }
.ing-have {
  width: 18px; height: 18px; flex: 0 0 18px;
  display: inline-grid; place-items: center;
  margin-left: auto; align-self: center;
  border-radius: 50%; background: #14B87A; color: #fff;
  box-shadow: 0 2px 7px rgba(20,184,122,.24);
  font: 800 12px/1 var(--ui);
}
.ing-have::before { content: "✓"; transform: translateY(-.5px); }
.ing li.off .ing-have { opacity: .58; }

.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; }
.steps li {
  counter-increment: s;
  display: grid; grid-template-columns: 22px 1fr; gap: 12px;
  padding: 11px 0;
  font-size: 16.5px; line-height: 1.6; color: var(--ink-soft);
}
.steps li::before {
  content: counter(s);
  font-size: 14px; color: var(--ink-faint); padding-top: 3px;
}
.steps li.group {
  counter-increment: none;      /* a heading is not step 1 */
  grid-template-columns: 1fr;
  font-weight: 700; font-size: 16px; color: var(--ink);
  padding-top: 26px;
}
.steps li.group::before { content: none; }

.timer-chip {
  font-family: var(--mono); font-size: .82em;
  background: var(--accent-wash);
  border: 1px solid transparent; border-radius: 6px;
  padding: 1px 6px; cursor: pointer; color: var(--ink);
  white-space: nowrap;
}
.timer-chip:hover { border-color: var(--accent); }

.prose { font-size: 16px; color: var(--ink-soft); white-space: pre-wrap; margin-top: 10px; }

/* ─────────── groceries ─────────── */

.shop { list-style: none; margin: 14px 0 0; padding: 0; }
.shop li {
  display: grid; grid-template-columns: 20px 1fr; gap: 13px; align-items: baseline;
  padding: 11px 4px; border-bottom: 1px solid var(--rule); cursor: pointer;
}
.shop .box { width: 16px; height: 16px; border: 1.5px solid var(--ink-faint); border-radius: 4px; }
.shop li.off .box { background: var(--accent); border-color: var(--accent); }
.shop li.off .t { opacity: .42; text-decoration: line-through; }
.shop .src { display: block; font-size: 11.5px; color: var(--ink-faint); }

/* ─────────── cook mode ─────────── */

.cook {
  position: fixed; inset: 0; z-index: 60;
  background: #14100F; color: #F5F1EF;
  display: flex; flex-direction: column;
}
[data-theme="dark"] .cook { background: #0D0B0A; }

.cook-head {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  padding-top: calc(10px + env(safe-area-inset-top));
  border-bottom: 1px solid rgba(255,255,255,.12);
}
.cook-head .icon-btn { color: rgba(245,241,239,.68); }
.cook-head .icon-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
.cook-title {
  font-family: var(--serif); font-size: 16px; font-weight: 600;
  margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cook-count { font-family: var(--mono); font-size: 12.5px; color: rgba(245,241,239,.5); }

.cook-body { flex: 1; display: grid; grid-template-columns: 1fr; gap: 22px; padding: 22px; overflow-y: auto; }

.cook-rail {
  font-family: var(--mono); font-size: 13.5px;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 12px; padding: 15px;
  max-height: 40vh; overflow-y: auto;
}
.cook-rail h3 {
  font-family: var(--ui); font-size: 10.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em;
  color: rgba(245,241,239,.45); margin: 0 0 11px;
}
.cook-rail ul { list-style: none; margin: 0; padding: 0; }
.cook-rail li { display: grid; grid-template-columns: 66px 1fr; gap: 10px; padding: 5px 0; cursor: pointer; line-height: 1.35; }
.cook-rail li .q { color: #F0665C; text-align: right; font-variant-numeric: tabular-nums; }
.cook-rail li.off { opacity: .34; }
.cook-rail li.off .n { text-decoration: line-through; }

.cook-stage { display: flex; flex-direction: column; }
.cook-step {
  font-family: var(--serif);
  font-size: clamp(23px, 4.2vw, 33px);
  line-height: 1.42;
  flex: 1;
}
.cook-nav { display: flex; gap: 12px; margin-top: 26px; }
.cook-nav .btn { flex: 1; background: rgba(255,255,255,.08); color: #F5F1EF; border-color: rgba(255,255,255,.2); }
.cook-nav .btn:disabled { opacity: .3; }
.cook-nav .btn.primary { background: #F5F1EF; border-color: #F5F1EF; color: #14100F; font-weight: 600; }

/* ─────────── timers, toast ─────────── */

.timers {
  position: fixed; right: 14px; bottom: 14px; z-index: 70;
  display: flex; flex-direction: column-reverse; gap: 8px;
  padding-bottom: env(safe-area-inset-bottom);
}
/* in cook mode the nav sits at the bottom edge, so running timers
   move up under the header rather than covering the Next button */
.cook:not([hidden]) ~ .timers {
  top: calc(58px + env(safe-area-inset-top)); bottom: auto;
  flex-direction: column;
}

.timer {
  background: #2B2725; color: #F5F1EF;
  border: 1px solid rgba(255,255,255,.18); border-radius: 11px;
  padding: 9px 13px; min-width: 172px;
  font-family: var(--mono); font-size: 13.5px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
.timer.done { background: var(--accent); border-color: var(--accent); animation: pulse 1s ease-in-out infinite; }
.timer .lbl { font-size: 10.5px; opacity: .68; display: block; }
.timer button { background: none; border: 0; color: inherit; cursor: pointer; font-size: 16px; line-height: 1; }
@keyframes pulse { 50% { opacity: .58; } }

.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: #2B2725; color: #F5F1EF;
  padding: 11px 19px; border-radius: 999px; font-size: 14px;
  z-index: 80; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  max-width: 88vw; text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ═══════════ narrow: one pane at a time ═══════════ */

@media (max-width: 719px) {
  .side {
    position: fixed; inset: 0 auto 0 0; z-index: 30;
    width: min(84vw, var(--side-w));
    transform: translateX(-102%);
    transition: transform .22s ease;
    box-shadow: 0 0 34px rgba(0,0,0,.16);
    padding-top: calc(18px + env(safe-area-inset-top));
  }
  body[data-side="open"] .side { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 29; background: rgba(0,0,0,.32); }

  .list, .detail { grid-column: 1; grid-row: 1; }
  body[data-pane="list"] .detail { display: none; }
  body[data-pane="detail"] .list { display: none; }
  .list { border-right: 0; }
  .s-head { padding: 18px 18px 0; }
  .s-steps { padding: 0 18px 80px; }
  .shell { grid-template-columns: 1fr; grid-template-rows: 1fr; }
}

/* ═══════════ unfolded: all three panes ═══════════ */

@media (min-width: 720px) and (max-width: 1023px) {
  :root { --side-w: 200px; --list-w: 240px; }
  /* the nav has to give up some room for the recipe to stay readable */
  .side { padding-left: 8px; padding-right: 8px; }
  .side-row { padding: 8px 6px; gap: 8px; font-size: 13.5px; letter-spacing: -.006em; }
  .side-title img { width: 108px; }
  .row { grid-template-columns: 64px 1fr; gap: 11px; padding: 12px 6px; }
  .row::after { left: 81px; }
  .row-img { width: 64px; height: 64px; }
  .row-title { font-size: 15.5px; }
  .s-head { padding: 20px 18px 0; }
  .s-steps { padding: 0 18px 70px; }

}

@media (min-width: 720px) {
  .shell { grid-template-columns: var(--side-w) var(--list-w) 1fr; height: 100dvh; }
  .side { border-right: 1px solid var(--rule); }
  .scrim { display: none !important; }
  .only-narrow { display: none !important; }
  .list, .detail { height: 100dvh; }
  .rows { padding-bottom: 60px; }

  .cook-body { grid-template-columns: 290px 1fr; gap: 40px; padding: 34px; align-items: stretch; }
  .cook-rail { max-height: none; align-self: start; position: sticky; top: 0; }
  .cook-nav { max-width: 480px; }
}

@media (min-width: 1240px) {
  :root { --list-w: 372px; }
  .s-head { padding-left: 48px; padding-right: 48px; padding-top: 40px; }
  .s-steps { padding-left: 48px; padding-right: 48px; }
}

/* ═══════════ editor ═══════════ */

.editor {
  position: fixed; inset: 0; z-index: 65;
  background: var(--list);
  display: flex; flex-direction: column;
}

.ed-head {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top));
  border-bottom: 1px solid var(--rule);
  background: var(--page);
}
.ed-hint {
  margin: 0 auto; font-size: 12.5px; color: var(--ink-faint);
  text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
@media (max-width: 700px) { .ed-hint { display: none; } }

.ed-body { flex: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr; }
.ed-main { padding: 26px 22px 70px; min-width: 0; }
.ed-side { background: var(--side-panel); padding: 22px 22px 70px; min-width: 0; }

.ed-lbl {
  display: block;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--accent);
  margin-bottom: 7px;
}

.ed-block { display: block; margin-bottom: 26px; }

.editor input, .editor textarea {
  width: 100%; font-family: var(--ui); font-size: 15.5px;
  color: var(--ink); background: none;
  border: 0; border-bottom: 1px solid var(--rule);
  padding: 7px 2px; border-radius: 0;
  resize: vertical;
}
.editor input:focus, .editor textarea:focus {
  outline: none; border-bottom-color: var(--accent);
}
.editor input::placeholder, .editor textarea::placeholder { color: var(--ink-faint); }

.ed-title { font-family: var(--serif); font-weight: 700; font-size: 30px !important; letter-spacing: -.02em; }

/* the short fields sit in a label-right column, as in Mela */
.ed-grid { margin-bottom: 30px; }
.ed-grid label { display: grid; grid-template-columns: 110px 1fr; gap: 14px; align-items: baseline; margin-bottom: 6px; }
.ed-grid .ed-lbl { text-align: right; margin-bottom: 0; }

#ed-ing, #ed-steps { font-family: var(--mono); font-size: 13.5px; line-height: 1.7; }

.ed-photos {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin-bottom: 6px;
}
.ed-thumb {
  position: relative;
  width: 92px; height: 92px;
  border-radius: 10px; overflow: hidden;
  border: 1px solid var(--rule);
}
.ed-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
.ed-thumb.cover { border-color: var(--accent); }
.ed-cover-tag {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--accent-fill); color: #fff;
  font-size: 9.5px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; text-align: center;
  padding: 2px 0;
}
.ed-thumb-x {
  position: absolute; top: 3px; right: 3px;
  width: 20px; height: 20px; padding: 0;
  border: 0; border-radius: 50%;
  background: rgba(20, 16, 15, .62); color: #fff;
  font-size: 14px; line-height: 1; cursor: pointer;
}
.ed-thumb-x:hover { background: var(--accent); }
.ed-photo-count {
  display: block; font-family: var(--mono); font-size: 11.5px;
  color: var(--ink-faint); margin-bottom: 22px;
}

.ed-photo {
  width: 92px; height: 92px;
  display: grid; place-items: center;
  border: 1px solid var(--rule); border-radius: 10px;
  background: var(--sel);
  color: var(--ink-faint); cursor: pointer;
}
.ed-photo:hover { border-color: var(--accent); color: var(--accent); }
.ed-photo .ico { width: 26px; height: 26px; flex-basis: 26px; }

@media (min-width: 720px) {
  .ed-body { grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); }
  .ed-main { padding: 34px 44px 80px; }
  .ed-side { padding: 34px 30px 80px; }
}

/* ═══════════ calendar & plain pages ═══════════ */

.sheet[data-mode="plain"] { display: block; background: none; min-height: 0; }
.plain-wrap, .cal { padding: 26px 22px 80px; }

@container (min-width: 600px) {
  .plain-wrap, .cal { padding: 34px 38px 80px; }
}

.cal-top { margin-bottom: 18px; }
.cal-nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cal-range {
  font-family: var(--mono); font-size: 13.5px;
  min-width: 122px; text-align: center;
}
.cal-nav .btn { padding: 6px 12px; font-size: 13px; }

.cal-grid { display: grid; grid-template-columns: 1fr; gap: 2px; margin-top: 22px; }

.cal-day {
  background: var(--side-panel);
  border-radius: 10px;
  padding: 12px 14px;
  min-height: 62px;
}
.cal-day.today { background: var(--accent-wash); }
.cal-day header {
  display: flex; align-items: baseline; gap: 8px;
  margin-bottom: 8px;
}
.cd-name {
  font-size: 11px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-faint);
}
.cal-day.today .cd-name, .cal-day.today .cd-num { color: var(--accent); }
.cd-num { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }

.cal-empty { margin: 0; color: var(--ink-faint); font-size: 14px; }

.cal-card {
  display: flex; align-items: center; gap: 4px;
  margin-bottom: 6px;
}
.cal-card:last-child { margin-bottom: 0; }
.cal-open {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 10px;
  font: inherit; text-align: left; color: inherit;
  background: var(--list); border: 1px solid var(--rule);
  border-radius: 8px; padding: 6px 10px 6px 6px; cursor: pointer;
}
.cal-open:hover { border-color: var(--accent); }
.cal-open img, .cal-blank {
  width: 34px; height: 34px; border-radius: 5px;
  object-fit: cover; flex: 0 0 34px; background: var(--sel);
}
.cal-name {
  font-family: var(--serif); font-weight: 600; font-size: 14.5px;
  line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.cal-x {
  flex: 0 0 24px; width: 24px; height: 24px;
  border: 0; border-radius: 50%;
  background: none; color: var(--ink-faint);
  font-size: 16px; line-height: 1; cursor: pointer;
}
.cal-x:hover { background: var(--sel); color: var(--accent); }
.cal-day { cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
.cal-day:hover { transform: translateY(-2px); border-color: rgba(63,109,67,.3); box-shadow: 0 10px 24px rgba(43,37,28,.12); }
.day-focus { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px; }
.day-focus-scrim { position: absolute; inset: 0; background: rgba(24,21,17,.46); backdrop-filter: blur(7px); }
.day-focus-card {
  position: relative; width: min(620px, 100%); max-height: min(760px, calc(100dvh - 48px)); overflow-y: auto;
  padding: 28px; border: 1px solid rgba(255,255,255,.5); border-radius: 22px;
  background: rgba(255,253,248,.97); box-shadow: 0 28px 80px rgba(25,20,15,.3);
}
.day-focus-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.day-focus-head small { display: block; color: var(--accent); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.day-focus-head h2 { margin: 5px 0 0; font: 700 clamp(28px,5vw,40px)/1 var(--serif); }
.day-focus-close { width: 36px; height: 36px; border: 1px solid var(--rule); border-radius: 50%; background: transparent; color: var(--ink); font-size: 24px; cursor: pointer; }
.day-focus-list { display: grid; gap: 10px; }
.day-focus-item { display: grid; grid-template-columns: 72px minmax(0,1fr) 34px; align-items: center; gap: 14px; padding: 11px; border: 1px solid var(--rule); border-radius: 15px; background: var(--page); }
.day-focus-open { grid-column: 1 / 3; min-width: 0; display: grid; grid-template-columns: 72px minmax(0,1fr); align-items: center; gap: 14px; padding: 0; border: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.day-focus-open img, .day-focus-blank { width: 72px; height: 72px; border-radius: 11px; object-fit: cover; background: var(--sel); }
.day-focus-copy strong { display: block; font: 700 19px/1.2 var(--serif); }
.day-focus-copy small { display: block; margin-top: 6px; color: var(--ink-faint); font-size: 12px; }
.day-focus-periods { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; margin-top: -3px; }
.day-focus-periods button { padding: 6px 10px; border: 1px solid var(--rule); border-radius: 999px; background: transparent; color: var(--ink-soft); font: 600 11px var(--ui); cursor: pointer; }
.day-focus-periods button:hover { border-color: var(--accent); color: var(--accent); }
.day-focus-periods button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
.day-focus-remove { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-faint); font-size: 20px; cursor: pointer; }
.day-focus-remove:hover { color: var(--danger); background: var(--sel); }
.day-focus-empty { margin: 10px 0 2px; color: var(--ink-faint); font-size: 16px; }
[data-theme="dark"] .day-focus-card { background: rgba(31,29,25,.98); border-color: rgba(255,255,255,.08); }
[data-theme="dark"] .day-focus-item { background: #292720; }

/* seven columns once the pane can carry them */
@container (min-width: 720px) {
  .cal-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: start; }
  .cal-day { min-height: 150px; padding: 10px; }
  .cal-day header { flex-direction: column; gap: 0; align-items: flex-start; }
  .cal-open { flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; }
  .cal-open img, .cal-blank { width: 100%; height: 46px; flex: none; }
  .cal-name { font-size: 13px; }
  .cal-card { gap: 0; position: relative; }
  .cal-x { position: absolute; top: 2px; right: 2px; background: rgba(20,16,15,.55); color: #fff; }
}

/* the day picker hanging off the Plan button */
.r-tools { position: relative; }
.daypick {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 25;
  width: 262px; max-height: 340px; overflow-y: auto;
  background: var(--list);
  border: 1px solid var(--rule); border-radius: 12px;
  box-shadow: 0 10px 34px rgba(20, 16, 15, .18);
  padding: 10px;
}
.daypick h3 {
  font-size: 11px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-faint);
  margin: 4px 6px 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.daypick ul { list-style: none; margin: 0; padding: 0; }
.daypick button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  font: inherit; font-size: 14px; text-align: left; color: inherit;
  background: none; border: 0; border-radius: 8px;
  padding: 8px 10px; cursor: pointer;
}
.daypick button:hover { background: var(--sel); }
.daypick button.on { color: var(--accent); font-weight: 600; }
.dp-date { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }
.dp-mark { width: 14px; text-align: center; color: var(--ink-faint); }
.daypick button.on .dp-mark, .daypick button.on .dp-date { color: var(--accent); }

.bare { color: var(--ink-faint); font-size: 14.5px; line-height: 1.7; margin: 0; }
.linky {
  font: inherit; font-size: 14.5px; background: none; border: 0;
  color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0;
}
.steps strong, .r-desc strong, .prose strong { font-weight: 700; color: var(--ink); }

/* ═══════════ discover ═══════════ */

.discover { width: 100%; max-width: 620px; margin-right: auto; margin-left: auto; }
.discover .d-head { width: 100%; }
.discover .deck { width: 100%; margin-right: auto; margin-left: auto; }
.discover .d-actions, .discover .d-foot { width: 100%; }
.d-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.d-count { font-family: var(--mono); font-size: 12.5px; color: var(--ink-faint); }

.deck {
  position: relative;
  height: min(520px, 58vh);
  margin-bottom: 22px;
  touch-action: pan-y;
}

.swipe-card {
  position: absolute; inset: 0;
  border-radius: 18px; overflow: hidden;
  background: var(--side-panel);
  border: 1px solid var(--rule);
  box-shadow: 0 12px 34px rgba(20, 16, 15, .16);
  cursor: grab;
  transition: transform .36s cubic-bezier(.22,.72,.28,1), opacity .3s ease;
  user-select: none; -webkit-user-select: none;
  will-change: transform;
}
.swipe-card:active { cursor: grabbing; }
.swipe-card.behind { transform: scale(.94) translateY(14px); pointer-events: none; opacity: .82; }

/* A card arriving at the back of the deck starts smaller and lower, then
   settles into .behind. Two rules, one transition — no keyframes needed.
   This must follow .behind to win on equal specificity. */
.swipe-card.enter { transform: scale(.86) translateY(30px); opacity: 0; }
.swipe-card img, .swipe-blank {
  width: 100%; height: 100%; object-fit: cover; display: block;
  pointer-events: none;
}
.swipe-blank { background: var(--sel); }
.restaurant-swipe-blank { display: grid; place-items: center; background: linear-gradient(145deg, var(--accent-wash), var(--side-panel)); color: var(--accent); }
.restaurant-swipe-blank b { font: 700 clamp(90px,18vw,160px)/1 var(--serif); opacity: .42; }
.restaurant-state-filter { margin-left: auto; max-width: 180px; border: 1px solid var(--rule); border-radius: 999px; padding: 7px 30px 7px 12px; background: var(--list); color: var(--ink); font: 600 11px/1.2 var(--ui); cursor: pointer; }

.swipe-meta {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 44px 20px 20px;
  color: #fff;
  background: linear-gradient(to top, rgba(12,9,8,.9), rgba(12,9,8,.55) 45%, transparent);
  pointer-events: none;
}
.swipe-meta h2 {
  font-family: var(--serif); font-weight: 700; font-size: 25px;
  line-height: 1.15; letter-spacing: -.02em; margin: 0;
}
.swipe-meta p { margin: 7px 0 0; font-size: 13px; opacity: .82; }

.d-badge {
  position: absolute; top: 22px; left: 20px;
  font-family: var(--ui); font-weight: 700; font-size: 19px;
  letter-spacing: .14em;
  padding: 7px 14px; border-radius: 8px;
  border: 2.5px solid currentColor;
  pointer-events: none;
  transition: opacity .12s;
}
.d-badge.keep { color: #4FA96B; transform: rotate(-9deg); }
.d-badge.pass { color: var(--accent); left: auto; right: 20px; transform: rotate(9deg); }

.d-actions { display: flex; align-items: center; justify-content: center; gap: 14px; }
.d-btn {
  display: inline-grid; place-items: center;
  font: inherit; cursor: pointer;
  border: 1px solid var(--rule); background: var(--list); color: var(--ink);
  border-radius: 999px;
}
.d-btn.pass, .d-btn.keep { width: 56px; height: 56px; font-size: 25px; line-height: 1; }
.d-btn.pass { color: var(--accent); }
.d-btn.keep { color: #4FA96B; }
.d-btn.keep .ico { width: 26px; height: 26px; flex-basis: 26px; }
.d-btn.open { padding: 0 20px; height: 44px; font-size: 14.5px; color: var(--ink-soft); }
.d-btn:hover { border-color: currentColor; }

.d-foot { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }

/* the picks list */
.picks { list-style: none; margin: 24px 0 0; padding: 0; }
.pick {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--rule);
}
.pick-open {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 14px;
  font: inherit; text-align: left; color: inherit;
  background: none; border: 0; cursor: pointer; padding: 4px;
  border-radius: 8px;
}
.pick-open:hover { background: var(--sel); }
.pick-open img, .pick-blank {
  width: 62px; height: 62px; flex: 0 0 62px;
  border-radius: 8px; object-fit: cover; background: var(--sel);
}
.pick-body { min-width: 0; }
.pick-title {
  display: block;
  font-family: var(--serif); font-weight: 600; font-size: 16.5px; line-height: 1.25;
}
.pick-cats { display: block; font-size: 12.5px; color: var(--ink-faint); margin-top: 3px; }
.pick-when { display: block; font-size: 12.5px; color: var(--accent); margin-top: 3px; }
.pick-actions { position: relative; display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.pick-actions .btn { padding: 7px 12px; font-size: 13px; white-space: nowrap; }
.pick-x {
  width: 28px; height: 28px; border: 0; border-radius: 50%;
  background: none; color: var(--ink-faint);
  font-size: 17px; line-height: 1; cursor: pointer;
}
.pick-x:hover { background: var(--sel); color: var(--accent); }
.pick-actions .daypick { right: 0; left: auto; }

@media (max-width: 560px) {
  .pick { flex-wrap: wrap; }
  .pick-actions { width: 100%; justify-content: flex-end; }
}

/* ── discover: category filters ── */

.d-head { position: relative; }
.d-gear {
  position: relative;
  display: inline-grid; place-items: center;
  width: 34px; height: 34px; margin-left: auto;
  border: 1px solid var(--rule); border-radius: 9px;
  background: var(--list); color: var(--ink-soft); cursor: pointer;
}
.d-gear:hover { border-color: var(--accent); color: var(--accent); }
.d-dot {
  position: absolute; top: -4px; right: -4px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--page);
}

.df-note {
  font-size: 13.5px; line-height: 1.6; color: var(--ink-faint);
  max-width: 46ch; margin: 4px 0 18px;
}

.df-list {
  list-style: none; margin: 0; padding: 0;
  columns: 2; column-gap: 26px;
}
.df-list li { break-inside: avoid; }

.df-row {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 8px; border-radius: 8px;
  cursor: pointer;
}
.df-row:hover { background: var(--sel); }
.df-row input {
  appearance: none; -webkit-appearance: none;
  width: 18px; height: 18px; flex: 0 0 18px; margin: 0;
  border: 1.5px solid var(--ink-faint); border-radius: 5px;
  background: none; cursor: pointer; position: relative;
}
.df-row input:checked { background: var(--accent); border-color: var(--accent); }
.df-row input:checked::after {
  content: ""; position: absolute; left: 5px; top: 1.5px;
  width: 5px; height: 10px;
  border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(43deg);
}
.df-name { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.df-dim { color: var(--ink-faint); font-style: italic; }
.df-n { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }
.df-row input:not(:checked) ~ .df-name { color: var(--ink-faint); }

@media (max-width: 620px) { .df-list { columns: 1; } }



/* ═══════════ my fridge ═══════════ */

/* The appliance fills the pane rather than sitting in it as a small cabinet.
   Full-width shelf rails, big photographs, twin crispers along the bottom —
   the inside of a fridge as you actually see it with the door open. */

.fridge-page { padding: 22px 0 80px; overflow: hidden; }
.fridge-page > *:not(.appliance):not(.fr-list) { margin-left: 22px; margin-right: 22px; }

.fr-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }

.fr-tabs { display: flex; gap: 3px; background: var(--sel); border-radius: 11px; padding: 3px; flex: 1; }
.fr-tabs button {
  flex: 1; border: 0; background: none; border-radius: 8px; padding: 8px 6px;
  font: inherit; font-size: 14px; color: var(--ink-soft); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
}
.fr-tabs button.on { background: var(--list); color: var(--ink); font-weight: 600;
  box-shadow: 0 1px 3px rgba(20,16,15,.14); }
.fr-tabs em { font-style: normal; font-size: 11px; color: var(--ink-faint);
  font-variant-numeric: tabular-nums; }

.fr-viewtoggle { display: flex; gap: 2px; background: var(--sel); border-radius: 9px; padding: 3px; }
.fr-viewtoggle button { border: 0; background: none; border-radius: 7px; padding: 6px 13px;
  font: inherit; font-size: 12.5px; color: var(--ink-soft); cursor: pointer; }
.fr-viewtoggle button.on { background: var(--list); color: var(--ink); font-weight: 600; }

/* ── the appliance ── */
.appliance { margin: 0 0 24px; }

.interior {
  position: relative; min-width: 0;
  padding: 26px clamp(14px, 4vw, 40px) 22px;
  display: flex; flex-direction: column;
  background:
    radial-gradient(ellipse at 50% -4%, rgba(255,255,255,.98), transparent 42%),
    linear-gradient(90deg, #d3d5d6 0%, #f7f8f7 5%, #ffffff 50%, #f4f5f4 95%, #cfd1d2 100%);
  box-shadow:
    inset 0 9px 26px rgba(40,44,46,.20),
    inset 17px 0 30px -14px rgba(40,44,46,.28),
    inset -17px 0 30px -14px rgba(40,44,46,.28),
    inset 0 -10px 20px -12px rgba(40,44,46,.22);
}
[data-theme="dark"] .interior {
  background:
    radial-gradient(ellipse at 50% -4%, rgba(255,250,232,.16), transparent 44%),
    linear-gradient(90deg, #1b1f20 0%, #2a2f30 6%, #333839 50%, #292e2f 94%, #1a1e1f 100%);
}
.appliance.is-freezer .interior {
  background:
    radial-gradient(ellipse at 50% -4%, rgba(255,255,255,.98), transparent 42%),
    linear-gradient(90deg, #cdd6d8 0%, #f2f7f8 5%, #ffffff 50%, #eff5f6 95%, #c9d3d5 100%);
}
.appliance.is-pantry .interior {
  background:
    radial-gradient(ellipse at 50% -4%, rgba(255,252,246,.96), transparent 42%),
    linear-gradient(90deg, #cdc4b6 0%, #f3ede3 5%, #fbf7f0 50%, #f0e9dd 95%, #c8bfb0 100%);
}

/* one shelf: things stand on it, a thin rail holds them up */
.rack { position: relative; display: flex; flex-direction: column; justify-content: flex-end;
  min-height: 152px; padding-bottom: 12px; }
.rack-floor {
  position: relative; z-index: 2; min-width: 0;
  display: flex; flex-wrap: nowrap; align-items: flex-end; justify-content: space-evenly;
  gap: 18px; min-height: 128px; padding: 6px 4px 0;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
}
.rack-floor::-webkit-scrollbar { display: none; }

.rail {
  position: absolute; left: -10px; right: -10px; bottom: 0; height: 11px; border-radius: 2px;
  background: linear-gradient(180deg, #ffffff 0%, #e9ebec 44%, #c0c4c6 52%, #f7f8f8 100%);
  box-shadow: 0 4px 8px rgba(40,44,46,.24), inset 0 1px 0 #fff;
}
[data-theme="dark"] .rail {
  background: linear-gradient(180deg, #6a7173 0%, #4a5052 46%, #33393a 54%, #5c6365 100%);
  box-shadow: 0 4px 9px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.28);
}

/* twin crispers */
.drawers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; min-width: 0; }
.drawers > * { min-width: 0; }
.crisper {
  position: relative; border-radius: 5px; padding: 20px 10px 26px;
  display: flex; flex-direction: column; justify-content: flex-end;
  min-height: 150px;
  border: 1px solid rgba(90,120,128,.42);
  background: linear-gradient(180deg, rgba(236,246,248,.42), rgba(122,154,164,.30));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 3px 7px rgba(40,44,46,.16);
}
[data-theme="dark"] .crisper {
  border-color: rgba(255,255,255,.16);
  background: linear-gradient(180deg, rgba(120,150,158,.16), rgba(30,40,44,.42));
}
.crisper-grip { position: absolute; top: 9px; left: 25%; right: 25%; height: 5px; border-radius: 3px;
  background: rgba(90,120,128,.5); }
.crisper-label { position: absolute; bottom: 7px; left: 0; right: 0; text-align: center;
  font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  color: rgba(60,84,90,.5); }
[data-theme="dark"] .crisper-label { color: rgba(255,255,255,.34); }
/* a crisper is a box you pile things into, so it wraps where a shelf does not */
.crisper .rack-floor { min-height: 108px; gap: 6px 8px; flex-wrap: wrap;
  align-content: flex-end; justify-content: center; overflow: visible; }
.crisper .fr-item { width: 92px; }
.crisper .fr-name { font-size: 11px; }

/* the shelf you are dropping onto is not a thing here — tapping is */
.fr-item {
  position: relative; display: flex; flex-direction: column; align-items: center;
  font: inherit; background: none; border: 0; padding: 0; cursor: pointer;
  flex: 0 0 auto; width: 128px;
}
.fr-art { display: block; line-height: 0; position: relative; }
.fr-art svg { display: block; filter: drop-shadow(0 5px 5px rgba(30,34,36,.24));
  transition: transform .16s ease; }
.fr-item:hover .fr-art svg { transform: translateY(-3px) scale(1.04); }

  background-position: calc(var(--col) * 33.3333%) calc(var(--row) * 33.3333%);
