        </section>` : ''}

      ${state.list.length
        ? `<h2 class="sec">The list</h2><ul class="shop" id="shop"></ul>
           <div class="r-tools">
             <button class="tool" id="g-empty"><span class="ico" data-ico="close"></span>Empty the list</button>
           </div>`
        : `<p class="r-note">Nothing on the list. Open a recipe and choose “Add to groceries”,
           or use “Groceries for this week” on the calendar.</p>`}
    </div>`;

    if (state.list.length) {
      const ul = $('#shop');
      state.list.forEach((item, i) => {
        const li = document.createElement('li');
        if (item.done) li.classList.add('off');
        li.innerHTML = `<span class="box" aria-hidden="true"></span>
          <span><span class="t">${esc(item.text)}</span><span class="src">${esc(item.from)}</span></span>`;
        li.addEventListener('click', async () => {
          state.list[i].done = !state.list[i].done;
          await saveList();
          renderGroceries();          // redraw so the put-away tray follows
        });
        ul.appendChild(li);
      });

      $('#g-empty').addEventListener('click', async () => {
        state.list = []; await saveList(); renderGroceries();
      });
    }

    if (!bought.length) return Icons.paint(sheet);

    sheet.querySelectorAll('.pa-row').forEach(row => {
      const idx = Number(row.dataset.i);
      row.querySelectorAll('.pa-where button').forEach(b =>
        b.addEventListener('click', () => {
          if (b.dataset.drop) return dropBought([bought[idx]]);
          putAway([bought[idx]], b.dataset.place);
        }));
    });

    $('#pa-all').addEventListener('click', () => putAway(bought, null));
    $('#pa-none').addEventListener('click', async () => {
      state.list.forEach(i => { i.done = false; });
      await saveList();
      renderGroceries();
    });

    Icons.paint(sheet);
  }

  /* Move ticked items off the list and into the kitchen. With no place given,
     each one goes where it is guessed to belong. */
  async function putAway(items, place) {
    if (!items.length) return;
    const added = items.map(i => Fridge.item(Fridge.foodName(i.text), null, place || undefined));
    state.fridge = state.fridge.concat(added);
    state.list = state.list.filter(i => !items.includes(i));

    await saveFridge();
    await saveList();
    renderGroceries();

    const where = place
      ? (Fridge.PLACES.find(p => p.id === place) || {}).label
      : 'the kitchen';
    toast(added.length === 1
      ? `${added[0].name} → ${where}`
      : `${added.length} items put away in ${where}.`, 3200);
  }

  async function dropBought(items) {
    state.list = state.list.filter(i => !items.includes(i));
    await saveList();
    renderGroceries();
  }

  /* ─────────── import ─────────── */

  /* A 180-recipe library holds full-resolution photos — some are eight
     megabytes. Handing those straight to a 92px list row makes the browser
     decode the whole thing for every visible row, which is what turns a
     long list janky on a phone. Build one small thumbnail per recipe at
     import time instead; the originals stay untouched for the recipe page. */
  const THUMB = 200;

  function makeThumb(dataUrl) {
    return new Promise(resolve => {
      const img = new Image();
      let finished = false;
      const finish = value => {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        img.onload = img.onerror = null;
        img.removeAttribute('src');
        resolve(value);
      };
      const timer = setTimeout(() => finish(''), 10000);
      img.onerror = () => finish('');
      img.onload = () => {
        try {
          const side = Math.min(img.width, img.height);
          if (!side) return finish('');
          const c = document.createElement('canvas');
          c.width = c.height = THUMB;
          c.getContext('2d').drawImage(img,
            (img.width - side) / 2, (img.height - side) / 2, side, side,
            0, 0, THUMB, THUMB);
          finish(c.toDataURL('image/jpeg', 0.72));
          c.width = c.height = 0;
        } catch (e) { finish(''); }
      };
      img.src = dataUrl;
    });
  }

  async function buildThumbs(recipes, onProgress) {
    let done = 0;
    for (const r of recipes) {
      if (!r.thumb && r.images[0]) r.thumb = await makeThumb(r.images[0]);
      if (onProgress) onProgress(++done, recipes.length);
    }
    return recipes;
  }

  async function importFiles(files) {
    if (!files || !files.length) return;
    toast('Reading…', 60000);
    const { recipes, problems } = await Mela.readFiles(files);

    if (!recipes.length) {
      toast(problems[0] ? 'Could not read that. ' + problems[0] : 'No recipes found in those files.', 6000);
      return;
    }

    // nothing to reconcile against on a first import
    if (!state.recipes.length) return applyImport(recipes, 'merge', problems);

    const have = new Map(state.recipes.map(r => [r.id, r]));
    const incoming = new Set(recipes.map(r => r.id));
    const added = recipes.filter(r => !have.has(r.id)).length;
    const updated = recipes.length - added;
    const gone = state.recipes.filter(r => !incoming.has(r.id));

    toast('');
    askImport({ recipes, problems, added, updated, gone });
  }

  /* Re-importing an updated export is the normal way to keep the library in
     step with Mela, so it asks what to do with the recipes that are in the
     app but not in the file — the ones deleted since the last export. */
  function askImport(info) {
    const wrap = document.createElement('div');
    wrap.className = 'ask-wrap';
    wrap.innerHTML = `
      <div class="ask-scrim"></div>
      <div class="ask" role="dialog" aria-modal="true" aria-label="Update your library">
        <h2>Update your library</h2>
        <p>That file holds <b>${info.recipes.length}</b> recipes.</p>
        <ul class="ask-facts">
          <li><b>${info.added}</b> new</li>
          <li><b>${info.updated}</b> already here, and will be refreshed</li>
          <li><b>${info.gone.length}</b> here but not in the file</li>
        </ul>
        ${info.gone.length ? `<p class="ask-note">Those ${info.gone.length} are most likely ones you
          deleted in Mela. Replacing removes them here too; merging leaves them alone.</p>` : ''}
        <div class="ask-buttons">
          <button class="btn" id="ask-cancel">Cancel</button>
          <button class="btn" id="ask-merge">Merge</button>
          <button class="btn primary" id="ask-replace">Replace library</button>
        </div>
        <p class="ask-small">Either way, what you have cooked, planned, and put in
        your kitchen is kept.</p>
      </div>`;
    document.body.appendChild(wrap);

    const close = () => wrap.remove();
    wrap.querySelector('.ask-scrim').addEventListener('click', close);
    $('#ask-cancel').addEventListener('click', close);
    $('#ask-merge').addEventListener('click', () => { close(); applyImport(info.recipes, 'merge', info.problems); });
    $('#ask-replace').addEventListener('click', () => { close(); applyImport(info.recipes, 'replace', info.problems, info.gone); });
  }

  /* A Mela export knows nothing about cooking history — that is ours. Without
     this, re-importing would silently reset every "cooked" mark on the library. */
  function carryOver(incoming) {
    const have = new Map(state.recipes.map(r => [r.id, r]));
    incoming.forEach(r => {
      const old = have.get(r.id);
      if (!old) return;
      if (!r.cooked && old.cooked) {
        r.cooked = old.cooked;
        r.lastCooked = old.lastCooked;
        r.history = (old.history || []).slice();
      }
      if (!r.thumb && old.thumb && r.images[0] === (old.images || [])[0]) r.thumb = old.thumb;
    });
    return incoming;
  }

  let importRunning = false;
  async function applyImport(recipes, mode, problems, gone) {
    if (importRunning) { toast('An import is already running.', 5000); return; }
    importRunning = true;
    let saved = 0;
    try {
      await Store.ready();
      if (Store.isMemoryOnly) throw new Error('Browser storage is unavailable. Recipes cannot be saved permanently.');
      carryOver(recipes);
      const byId = new Map(state.recipes.map(r => [r.id, r]));
      for (const recipe of recipes) {
        toast(`Preparing thumbnail ${saved + 1} of ${recipes.length}…`, 300000);
        await new Promise(resolve => setTimeout(resolve, 0));
        if (!recipe.thumb && recipe.images[0]) recipe.thumb = await makeThumb(recipe.images[0]);
        toast(`Saving recipe ${saved + 1} of ${recipes.length}… Keep the app open.`, 300000);
        await Store.putRecipes([recipe]);
        byId.set(recipe.id, recipe);
        state.recipes = [...byId.values()];
        saved++;
      }
      // Replace removes old entries only after every incoming recipe is saved.
      if (mode === 'replace' && gone && gone.length) {
        toast('Finishing library replacement…', 300000);
        for (const recipe of gone) {
          await Store.deleteRecipe(recipe.id);
          byId.delete(recipe.id);
        }
        state.recipes = [...byId.values()];
        const drop = new Set(gone.map(r => r.id));
        const plan = JSON.parse(JSON.stringify(state.plan));
        Object.keys(plan).forEach(key => {
          plan[key] = plan[key].filter(id => !drop.has(id));
          if (!plan[key].length) delete plan[key];
        });
        await Store.pref('plan', plan);
        state.plan = plan;
      }
      toast(`Library saved — ${saved} of ${recipes.length} recipes.` +
        (problems && problems.length ? ` ${problems.length} file(s) skipped.` : ''), 9000);
    } catch (error) {
      console.error('Import stopped:', error);
      toast(`Import stopped. ${saved} of ${recipes.length} recipes saved. ${error.message || 'Storage failed.'} Re-import the same file to retry.`, 300000);
    } finally {
      importRunning = false;
      renderSidebar();
      renderList();
    }
  }

  /* ─────────── timers ─────────── */

  function startTimer(seconds, label) {
    const id = Math.random().toString(36).slice(2);
    const el = document.createElement('div');
    el.className = 'timer';
    el.innerHTML = `<span><span class="lbl">${esc(label)}</span><span class="rem">${Units.clock(seconds)}</span></span>
                    <button type="button" aria-label="Stop timer">×</button>`;
    $('#timers').appendChild(el);

    const t = { id, el, endsAt: Date.now() + seconds * 1000, done: false };
    state.timers.push(t);
    el.querySelector('button').addEventListener('click', () => {
      t.el.remove();
      state.timers = state.timers.filter(x => x.id !== id);
    });
    if (state.timers.length === 1) tick();
  }

  function tick() {
    state.timers.forEach(t => {
      const left = Math.round((t.endsAt - Date.now()) / 1000);
      t.el.querySelector('.rem').textContent = left > 0 ? Units.clock(left) : 'ready';
      if (left <= 0 && !t.done) {
        t.done = true;
        t.el.classList.add('done');
        if (navigator.vibrate) navigator.vibrate([220, 120, 220]);
        beep();
      }
    });
    if (state.timers.length) setTimeout(tick, 250);
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
      osc.connect(gain).connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.75);
    } catch (e) { /* the vibration and colour still fire */ }
  }

  /* ─────────── misc ─────────── */

  let toastTimer;
  function toast(msg, ms = 2600) {
    const el = $('#toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, ms);
  }

  /* A toast that can be taken back. Deleting in one tap is only reasonable
     if there is a way back from it. */
  function offerUndo(msg, undo, ms = 6000) {
    const el = $('#toast');
    el.textContent = '';
    el.hidden = false;
    el.append(msg + ' ');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'toast-undo';
    b.textContent = 'Undo';
    b.addEventListener('click', async () => {
      clearTimeout(toastTimer);
      el.hidden = true;
      await undo();
    });
    el.appendChild(b);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; el.textContent = ''; }, ms);
  }

  async function loadDemo() {
    const demo = Mela.normalize({
      id: 'demo-cacio-e-pepe',
      title: 'Cacio e Pepe',
      text: 'Four ingredients and nowhere to hide. The sauce is an emulsion, so the pasta water matters more than the cheese does.',
      yield: '2 servings', prepTime: '5 minutes', cookTime: '12 minutes', totalTime: '17 minutes',
      categories: ['Pasta', 'Weeknight'],
      link: 'https://example.com/cacio-e-pepe',
      favorite: true,
      ingredients: '200 g tonnarelli or spaghetti\n1 tbsp black peppercorns, coarsely cracked\n100 g Pecorino Romano, finely grated\n1 tsp fine sea salt',
      instructions: 'Boil the pasta in barely enough water to cover it — you want the water starchy, so use about half what you normally would.\nToast the cracked pepper in a dry wide pan over medium heat for 45 seconds, until it smells sharp rather than dusty.\nLadle a little pasta water into the pepper pan and let it bubble down for 1 minute.\nDrain the pasta 2 minutes before the packet says, keeping a mugful of water, and finish it in the pepper pan for 2 minutes.\nOff the heat, wait 30 seconds for the pan to stop sizzling. Add the pecorino in three goes, tossing hard and loosening with pasta water until it turns glossy rather than grainy.',
      notes: 'If it seizes into clumps the pan was too hot. Add a splash of cold water and keep tossing — it usually comes back.'
    });
    state.recipes.push(demo);
    await Store.putRecipes([demo]);
    renderSidebar();
    renderList();
  }

  // the editor's picker borrows this to add a picture mid-flow
  window.Recipe = {
    askForPicture,
    async forgetPicture(name) {
      Food.removeCustom(name);
      await saveFoodPics();
      if (state.page === 'fridge') renderFridge();
      toast(`Removed the picture for ${name}.`);
    }
  };

  boot();
})();

</script>
