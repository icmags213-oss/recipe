  filter: drop-shadow(0 5px 5px rgba(30,34,36,.22));
  transition: transform .16s ease;
}
.fr-item:hover .fr-photo { transform: translateY(-3px) scale(1.04); }
.fr-item.gone .fr-photo, .fr-item.gone .fr-art svg {
  opacity: .5; filter: grayscale(.7) drop-shadow(0 3px 3px rgba(30,34,36,.18)); }

.fr-tag, .fr-label {
  position: relative; margin-top: -10px; max-width: 100%;
  padding: 5px 11px 6px; border-radius: 11px;
  background: rgba(255,255,255,.9);
  border: 1px solid rgba(255,255,255,.95);
  box-shadow: 0 2px 9px rgba(30,34,36,.13);
  text-align: center; backdrop-filter: blur(7px);
}
.fr-name { display: block; font-size: 12px; font-weight: 600; line-height: 1.2; color: #121212;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fr-days { display: block; font-size: 10px; color: #4a4a4a; margin-top: 2px;
  font-variant-numeric: tabular-nums; }
.fr-item.soon .fr-days { color: #9a5b00; font-weight: 600; }
.fr-item.urgent .fr-days, .fr-item.gone .fr-days { color: var(--danger); font-weight: 700; }
.fr-opened { position: absolute; bottom: 8px; right: 6px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #fff; }

/* ── the plain list ── */
.fr-list { list-style: none; margin: 0 22px 24px; padding: 0;
  border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.fr-list li + li { border-top: 1px solid var(--rule); }
.fr-row { flex-direction: row; align-items: center; gap: 14px; width: 100%; padding: 9px 13px; }
.fr-row:hover { background: var(--sel); }
.fr-row-art { line-height: 0; width: 40px; display: grid; place-items: center; }
.fr-row-art .fr-photo { filter: none; }
.fr-row-name { flex: 1; text-align: left; font-size: 15px; }
.fr-row-days { font-size: 12.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.fr-row-days.soon { color: #9a5b00; font-weight: 600; }
.fr-row-days.urgent, .fr-row-days.gone { color: var(--danger); font-weight: 700; }

/* ── adding, freshness menu, matches ── */
.fr-menu h3 {
  text-transform: none; letter-spacing: 0; font-size: 13.5px; color: var(--ink);
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
}
.fr-menu { max-height: 380px; }
.fr-menu-days { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.fr-menu-days.soon { color: #b8791f; }
.fr-menu-days.urgent, .fr-menu-days.gone { color: var(--danger); }

.fr-life { padding: 2px 6px 10px; border-bottom: 1px solid var(--rule); margin-bottom: 6px; }
.fr-life .ed-lbl { margin-bottom: 6px; }
.fr-life-row { display: flex; gap: 5px; }
.fr-life-row button {
  flex: 1; font: inherit; font-family: var(--mono); font-size: 11.5px;
  padding: 6px 0; border: 1px solid var(--rule); border-radius: 7px;
  background: none; color: var(--ink-soft); cursor: pointer;
}
.fr-life-row button:hover { border-color: var(--accent); color: var(--accent); }
.fr-life-row button.on { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
.fr-remove { color: var(--danger); }

.fr-add { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.fr-add .ed-block { flex: 1; min-width: 220px; margin-bottom: 0; }
.fr-add input {
  width: 100%; font-family: var(--ui); font-size: 15.5px; color: var(--ink);
  background: none; border: 0; border-bottom: 1px solid var(--rule);
  padding: 7px 2px; border-radius: 0;
}
.fr-add input:focus { outline: none; border-bottom-color: var(--accent); }
.fr-add .ed-block { position: relative; }
.fr-suggestions {
  position: absolute; left: 0; right: 0; top: calc(100% + 7px); z-index: 20;
  padding: 5px; border: 1px solid var(--rule); border-radius: 12px;
  background: var(--list); box-shadow: 0 12px 30px rgba(36,28,20,.16);
}
.fr-suggestions button {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 9px 10px; border: 0; border-radius: 8px; background: transparent;
  color: var(--ink); font: inherit; font-size: 13px; text-align: left; cursor: pointer;
}
.fr-suggestions button:hover, .fr-suggestions button:focus { outline: none; background: var(--sel); }
.fr-suggestions small { overflow: hidden; color: var(--ink-faint); font-size: 10.5px; white-space: nowrap; text-overflow: ellipsis; }
[data-theme="dark"] .fr-suggestions { background: #302e27; }

.fr-staple { display: flex; align-items: center; gap: 10px; font-size: 14px;
  color: var(--ink-soft); margin: 4px 0 18px; cursor: pointer; }
.fr-staple input {
  appearance: none; -webkit-appearance: none;
  width: 17px; height: 17px; flex: 0 0 17px; margin: 0;
  border: 1.5px solid var(--ink-faint); border-radius: 5px; position: relative; cursor: pointer;
}
.fr-staple input:checked { background: var(--accent); border-color: var(--accent); }
.fr-staple input:checked::after {
  content: ""; position: absolute; left: 5px; top: 1.5px;
  width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(43deg);
}

.fr-urgent {
  font-size: 14px; line-height: 1.6; color: var(--ink);
  background: var(--accent-wash); border-radius: 10px;
  padding: 11px 14px; margin: 0 0 18px; max-width: 56ch;
}
.fr-urgent strong { color: var(--danger); }
.fr-urgent span { color: var(--ink-faint); font-size: 12.5px; }

.matches { list-style: none; margin: 0; padding: 0; }
.match { border-bottom: 1px solid var(--rule); }
.match-open {
  display: flex; align-items: center; gap: 14px; width: 100%;
  font: inherit; text-align: left; color: inherit;
  background: none; border: 0; cursor: pointer; padding: 11px 4px; border-radius: 8px;
}
.match-open:hover { background: var(--sel); }
.match-open img, .match-open .pick-blank {
  width: 54px; height: 54px; flex: 0 0 54px;
  border-radius: 8px; object-fit: cover; background: var(--sel);
}
.match-body { flex: 1; min-width: 0; }
.match-bar { display: block; height: 4px; border-radius: 2px;
  background: var(--sel); margin: 7px 0 6px; overflow: hidden; }
.match-bar span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.match-sub { display: block; font-size: 12.5px; color: var(--ink-faint); }
.match-sub.full { color: #4FA96B; font-weight: 600; }
.match-uses { display: block; font-size: 12px; color: var(--accent); margin-top: 3px; }

@media (max-width: 620px) {
  .fridge-page > *:not(.appliance):not(.fr-list) { margin-left: 16px; margin-right: 16px; }
  .fr-list { margin-left: 16px; margin-right: 16px; }
  .interior { padding: 18px 10px 16px; }
  .rack { min-height: 124px; }
  .rack-floor { min-height: 104px; gap: 8px; }
  .fr-item { width: 100px; }
  .fr-name { font-size: 11px; }
  .drawers { gap: 8px; }
  .crisper { padding: 16px 6px 22px; min-height: 124px; }
}

/* ── discover: category filters ── */

.d-head { position: relative; }
.d-gear {
  position: relative;
  display: inline-grid; place-items: center;
  width: 34px; height: 34px; margin-left: auto;
  border: 1px solid var(--rule); border-radius: 9px;
  background: var(--list); color: var(--ink-soft); cursor: pointer;
}
.d-gear:hover { border-color: var(--accent); color: var(--accent); }
.d-dot {
  position: absolute; top: -4px; right: -4px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--page);
}

.df-note {
  font-size: 13.5px; line-height: 1.6; color: var(--ink-faint);
  max-width: 46ch; margin: 4px 0 18px;
}

.df-list {
  list-style: none; margin: 0; padding: 0;
  columns: 2; column-gap: 26px;
}
.df-list li { break-inside: avoid; }

.df-row {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 8px; border-radius: 8px;
  cursor: pointer;
}
.df-row:hover { background: var(--sel); }
.df-row input {
  appearance: none; -webkit-appearance: none;
  width: 18px; height: 18px; flex: 0 0 18px; margin: 0;
  border: 1.5px solid var(--ink-faint); border-radius: 5px;
  background: none; cursor: pointer; position: relative;
}
.df-row input:checked { background: var(--accent); border-color: var(--accent); }
.df-row input:checked::after {
  content: ""; position: absolute; left: 5px; top: 1.5px;
  width: 5px; height: 10px;
  border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(43deg);
}
.df-name { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.df-dim { color: var(--ink-faint); font-style: italic; }
.df-n { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint); }
.df-row input:not(:checked) ~ .df-name { color: var(--ink-faint); }

@media (max-width: 620px) { .df-list { columns: 1; } }



/* ═══════════ my fridge ═══════════ */

/* Drawn as a cabinet with the door swung open beside it, which is the only
   way to show what is inside. Depth comes from layered gradients and inset
   shadows rather than images, so it costs nothing and themes correctly. */

.fridge-page { max-width: 720px; }
.fridge-wrap { margin: 6px 0 30px; }

.fridge {
  display: grid;
  grid-template-columns: 1fr 124px;
  gap: 10px;
  align-items: stretch;
  min-height: 440px;          /* a fridge is tall even when it is empty */
  filter: drop-shadow(0 18px 30px rgba(20, 16, 15, .16));
}

.fr-cabinet { display: flex; flex-direction: column; }
.fr-cabinet, .fr-door {
  position: relative;
  border-radius: 12px;
  padding: 9px;
  background:
    linear-gradient(160deg, #f2f0ee 0%, #dcd8d5 38%, #cfcac6 62%, #e6e3e0 100%);
  border: 1px solid rgba(20, 16, 15, .2);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 -2px 6px rgba(20,16,15,.14);
}
[data-theme="dark"] .fr-cabinet, [data-theme="dark"] .fr-door {
  background: linear-gradient(160deg, #4a4644 0%, #35312f 40%, #2a2624 65%, #403c3a 100%);
  border-color: rgba(0,0,0,.5);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -2px 6px rgba(0,0,0,.4);
}

/* the lit interior */
.fr-freezer, .fr-main {
  position: relative;
  border-radius: 7px;
  background: linear-gradient(180deg, #fbfbfa 0%, #eceae7 100%);
  box-shadow: inset 0 2px 7px rgba(20,16,15,.22), inset 0 0 0 1px rgba(20,16,15,.09);
  padding: 9px;
}
[data-theme="dark"] .fr-freezer, [data-theme="dark"] .fr-main {
  background: linear-gradient(180deg, #26302f 0%, #1b2322 100%);
  box-shadow: inset 0 2px 8px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.07);
}

.fr-freezer { margin-bottom: 9px; }
.fr-main { flex: 1; display: flex; flex-direction: column; gap: 9px; }
.fr-shelf { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }

/* the little bulb glow at the top of the compartment */
.fr-lamp {
  position: absolute; top: 0; left: 12%; right: 12%; height: 54px;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,247,214,.85), transparent 72%);
  pointer-events: none; border-radius: 7px;
}
[data-theme="dark"] .fr-lamp {
  background: radial-gradient(ellipse at 50% 0%, rgba(255,240,190,.3), transparent 72%);
}

.fr-label {
  position: absolute; top: 6px; left: 10px; z-index: 2;
  font-size: 9px; font-weight: 600; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-faint);
}
.fr-label.door { position: static; display: block; margin: 2px 0 8px 4px; }

.fr-shelf, .fr-crisper, .fr-bin { position: relative; }

.fr-slot {
  position: relative; z-index: 1;
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: flex-start;
  gap: 4px 8px;
  min-height: 76px;
  padding: 6px 8px 2px;
}
.fr-freezer .fr-slot { min-height: 60px; padding-top: 22px; }
.fr-bin .fr-slot { min-height: 54px; gap: 2px; padding: 4px; }
.fr-bin .fr-name { font-size: 9.5px; max-width: 74px; }
.fr-bin .fr-days { font-size: 8.5px; }

/* a pane of glass under each shelf of items */
.fr-glass {
  position: absolute; left: 3px; right: 3px; bottom: 0; height: 5px;
  border-radius: 3px;
  background: linear-gradient(180deg, rgba(190,215,220,.85), rgba(120,150,158,.65));
  box-shadow: 0 2px 5px rgba(20,16,15,.28), inset 0 1px 0 rgba(255,255,255,.9);
}
[data-theme="dark"] .fr-glass {
  background: linear-gradient(180deg, rgba(120,160,168,.55), rgba(40,60,64,.75));
  box-shadow: 0 2px 6px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.25);
}

.fr-crispers { margin-top: auto; }
.fr-crisper {
  border-radius: 6px;
  background: linear-gradient(180deg, rgba(214,231,234,.6), rgba(178,201,206,.5));
  border: 1px solid rgba(20,16,15,.14);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 2px 5px rgba(20,16,15,.16);
  padding-bottom: 9px;
}
[data-theme="dark"] .fr-crisper {
  background: linear-gradient(180deg, rgba(56,80,84,.6), rgba(32,48,50,.6));
  border-color: rgba(0,0,0,.45);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 2px 6px rgba(0,0,0,.4);
}
.fr-grip {
  position: absolute; left: 34%; right: 34%; bottom: 3px; height: 3px;
  border-radius: 2px; background: rgba(20,16,15,.24);
}
[data-theme="dark"] .fr-grip { background: rgba(255,255,255,.24); }

/* the door, hinged on its left edge */
.fr-door { display: flex; flex-direction: column; gap: 8px; padding: 10px 8px; }
.fr-bin {
  flex: 1;
  border-radius: 5px;
  background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(214,209,205,.5));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 2px 4px rgba(20,16,15,.14);
  border: 1px solid rgba(20,16,15,.12);
}
[data-theme="dark"] .fr-bin {
  background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(0,0,0,.2));
  border-color: rgba(0,0,0,.4);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 4px rgba(0,0,0,.35);
}
.fr-bin .fr-slot { min-height: 34px; padding: 5px; }

.fr-hinge {
  position: absolute; left: -4px; width: 5px; height: 26px; border-radius: 3px;
  background: linear-gradient(90deg, #9d9793, #cfcac6);
  box-shadow: 0 1px 2px rgba(20,16,15,.3);
  top: 16px;
}
.fr-hinge.low { top: auto; bottom: 16px; }

.fr-handle {
  position: absolute; right: -3px; top: 22%; bottom: 22%; width: 7px;
  border-radius: 4px;
  background: linear-gradient(90deg, #b9b3af, #efedeb 40%, #96908c);
  box-shadow: 1px 0 3px rgba(20,16,15,.3);
}
[data-theme="dark"] .fr-handle { background: linear-gradient(90deg, #6d6764, #a8a29e 40%, #514b48); }

/* the food itself, standing on the shelf with a label under it */
.fr-item {
  position: relative;
  display: flex; flex-direction: column; align-items: center;
  font: inherit; background: none; border: 0; padding: 0 2px;
  cursor: pointer; max-width: 104px;
}
.fr-art { display: block; line-height: 0; }


.fr-art svg {
  display: block;
  filter: drop-shadow(0 3px 3px rgba(20,16,15,.28));
  transition: transform .16s ease;
}
.fr-item:hover .fr-art svg { transform: translateY(-3px) scale(1.04); }

/* the label overlaps the item slightly, the way a shelf tag would */
.fr-tag {
  position: relative;
  margin-top: -9px;
  max-width: 100%;
  padding: 3px 7px 4px;
  border-radius: 5px;
  background: rgba(252, 251, 250, .93);
  box-shadow: 0 1px 3px rgba(20,16,15,.22);
  text-align: center;
}
[data-theme="dark"] .fr-tag { background: rgba(244, 241, 238, .92); }
.fr-name {
  display: block;
  font-size: 10.5px; font-weight: 600; line-height: 1.2; color: #2b2725;
  max-width: 92px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.fr-days { display: block; font-size: 9px; line-height: 1.3; color: #7d7672; }
.fr-item.soon   .fr-days { color: #b8791f; }
.fr-item.urgent .fr-days { color: var(--danger); font-weight: 600; }
.fr-item.gone   .fr-days { color: var(--danger); font-weight: 600; }
.fr-item.gone   .fr-art svg { opacity: .5; filter: grayscale(.7) drop-shadow(0 3px 3px rgba(20,16,15,.2)); }
.fr-item:hover .fr-name { color: var(--accent); }

.fr-menu h3 {
  text-transform: none; letter-spacing: 0; font-size: 13.5px; color: var(--ink);
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
}
.fr-menu-days { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.fr-menu-days.soon { color: #b8791f; }
.fr-menu-days.urgent, .fr-menu-days.gone { color: var(--danger); }

.fr-life { padding: 2px 6px 10px; border-bottom: 1px solid var(--rule); margin-bottom: 6px; }
.fr-life .ed-lbl { margin-bottom: 6px; }
.fr-life-row { display: flex; gap: 5px; }
.fr-life-row button {
  flex: 1; font: inherit; font-family: var(--mono); font-size: 11.5px;
  padding: 6px 0; border: 1px solid var(--rule); border-radius: 7px;
  background: none; color: var(--ink-soft); cursor: pointer;
}
.fr-life-row button:hover { border-color: var(--accent); color: var(--accent); }
.fr-life-row button.on { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }

.fr-urgent {
  font-size: 14px; line-height: 1.6; color: var(--ink);
  background: var(--accent-wash); border-radius: 10px;
  padding: 11px 14px; margin: 0 0 18px; max-width: 56ch;
}
.fr-urgent strong { color: var(--danger); }
.fr-urgent span { color: var(--ink-faint); font-size: 12.5px; }

.match-uses { display: block; font-size: 12px; color: var(--accent); margin-top: 3px; }
.fr-remove { color: var(--danger); }

/* adding, and the payoff list */
.fr-add { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.fr-add .ed-block { flex: 1; min-width: 220px; margin-bottom: 0; }
.fr-add input {
  width: 100%; font-family: var(--ui); font-size: 15.5px; color: var(--ink);
  background: none; border: 0; border-bottom: 1px solid var(--rule);
  padding: 7px 2px; border-radius: 0;
}
.fr-add input:focus { outline: none; border-bottom-color: var(--accent); }

.fr-staple { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-soft); margin: 4px 0 18px; cursor: pointer; }
.fr-staple input {
  appearance: none; -webkit-appearance: none;
  width: 17px; height: 17px; flex: 0 0 17px; margin: 0;
  border: 1.5px solid var(--ink-faint); border-radius: 5px; position: relative; cursor: pointer;
}
.fr-staple input:checked { background: var(--accent); border-color: var(--accent); }
.fr-staple input:checked::after {
  content: ""; position: absolute; left: 5px; top: 1.5px;
  width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(43deg);
}

.matches { list-style: none; margin: 0; padding: 0; }
.match { border-bottom: 1px solid var(--rule); }
.match-open {
  display: flex; align-items: center; gap: 14px; width: 100%;
  font: inherit; text-align: left; color: inherit;
  background: none; border: 0; cursor: pointer; padding: 11px 4px; border-radius: 8px;
}
.match-open:hover { background: var(--sel); }
.match-open img, .match-open .pick-blank {
  width: 54px; height: 54px; flex: 0 0 54px;
  border-radius: 8px; object-fit: cover; background: var(--sel);
}
.match-body { flex: 1; min-width: 0; }
.match-bar {
  display: block; height: 4px; border-radius: 2px;
  background: var(--sel); margin: 7px 0 6px; overflow: hidden;
}
.match-bar span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.match-sub { display: block; font-size: 12.5px; color: var(--ink-faint); }
.match-sub.full { color: var(--celery, #4FA96B); font-weight: 600; }

@media (max-width: 560px) {
  .fridge { grid-template-columns: 1fr 96px; min-height: 400px; }
  .fr-slot { gap: 2px 5px; }
  .fr-name { font-size: 9.5px; max-width: 70px; }
}

/* ── groceries: putting the shopping away ── */

.putaway {
  background: var(--side-panel);
  border-radius: 14px;
  padding: 18px 18px 16px;
  margin-bottom: 26px;
}
.pa-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pa-head h2 {
  font-family: var(--serif); font-weight: 700; font-size: 20px;
  letter-spacing: -.015em; margin: 0;
}
.putaway .df-note { margin: 6px 0 14px; }

.pa-list { list-style: none; margin: 0 0 14px; padding: 0; }
.pa-row {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 0; border-bottom: 1px solid var(--rule);
}
.pa-row:last-child { border-bottom: 0; }
.pa-art { flex: 0 0 44px; width: 44px; line-height: 0; display: grid; place-items: center; }
.pa-art svg, .pa-art .fr-photo { filter: drop-shadow(0 2px 2px rgba(20,16,15,.2)); }
.pa-body { flex: 1; min-width: 0; }
.pa-name {
  display: block; font-family: var(--serif); font-weight: 600; font-size: 16px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pa-from {
  display: block; font-size: 12px; color: var(--ink-faint); margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.pa-where { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.pa-where button {
  font: inherit; font-size: 12.5px;
  background: var(--list); color: var(--ink-soft);
  border: 1px solid var(--rule); border-radius: 8px;
  padding: 6px 10px; cursor: pointer; white-space: nowrap;
}
.pa-where button:hover { border-color: var(--accent); color: var(--accent); }
/* the appliance it would pick on its own, so one tap is usually right */
.pa-where button.guess {
  border-color: var(--accent); color: var(--accent); font-weight: 600;
  background: var(--accent-wash);
}
.pa-drop {
  width: 30px; padding: 0 !important; color: var(--ink-faint) !important;
  border-color: transparent !important; background: none !important;
  font-size: 17px; line-height: 1;
}
.pa-drop:hover { color: var(--accent) !important; }

@media (max-width: 620px) {
  .pa-row { flex-wrap: wrap; }
  .pa-where { width: 100%; justify-content: flex-end; }
}

/* ── taking things out of the kitchen ── */

.fr-cell { position: relative; display: inline-flex; flex: 0 0 auto; }

/* one tap, right on the item — not the last row of a scrolling menu */
.fr-x {
  position: absolute; top: -2px; right: -4px; z-index: 4;
  width: 22px; height: 22px; padding: 0;
  border: 0; border-radius: 50%;
  background: rgba(255, 255, 255, .96);
  color: var(--ink-soft);
  font-size: 15px; line-height: 20px; text-align: center;
  box-shadow: 0 1px 4px rgba(20, 16, 15, .3);
  cursor: pointer; opacity: 0;
  transition: opacity .14s ease, transform .14s ease, background .14s ease;
}
.fr-cell:hover .fr-x, .fr-x:focus-visible { opacity: 1; }
.fr-x:hover { background: var(--danger); color: #fff; transform: scale(1.1); }

/* no hover on a touchscreen, so the control is simply always there */
@media (hover: none) {
  .fr-x { opacity: 1; width: 24px; height: 24px; line-height: 22px; }
}

.fr-used {
  display: block; width: 100%;
  font: inherit; font-size: 14.5px; font-weight: 600;
  background: rgba(192,57,43,.1); color: var(--danger);
  border: 0; border-radius: 9px;
  padding: 11px 12px; margin: 2px 0 12px;
  cursor: pointer;
}
.fr-used:hover { background: var(--danger); color: #fff; }
.fr-move-lbl { display: block; padding: 0 6px; margin-bottom: 4px; }

.toast-undo {
  font: inherit; font-size: 13.5px; font-weight: 700;
  background: none; border: 0; color: #8FD0FF;
  margin-left: 4px; padding: 2px 4px; cursor: pointer;
  text-decoration: underline;
}
.toast-undo:hover { color: #fff; }

/* ── cooked / not yet ── */

.cookedbar {
  display: grid; grid-template-columns: .78fr 1.34fr 1fr; gap: 5px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--rule);
}
.cookedbar button {
  min-width: 0; display: inline-flex; align-items: baseline; justify-content: center; gap: 5px;
  font: inherit; font-size: 12.5px; line-height: 1;
  background: none; border: 1px solid transparent; border-radius: 8px;
  color: var(--ink-soft); padding: 9px 6px; cursor: pointer;
  white-space: nowrap;
}
.cookedbar button span {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.cookedbar button:hover { color: var(--ink); }
.cookedbar button[aria-pressed="true"] {
  background: var(--sel); color: var(--ink); font-weight: 600;
}
.cookedbar button[aria-pressed="true"] span { color: var(--ink-soft); }

.row-cooked { color: #4FA96B; }
.row[aria-current="true"] .row-cooked { color: rgba(255,255,255,.85); }

/* the cooked switch, once it is on */
.btn.quiet.on {
  background: rgba(79, 169, 107, .13);
  color: #2F7D4B;
  border-color: rgba(79, 169, 107, .4);
  font-weight: 600;
}
.btn.quiet.on:hover { border-color: #2F7D4B; }

/* ── the import question ── */

.ask-wrap { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 20px; }
.ask-scrim { position: absolute; inset: 0; background: rgba(20, 16, 15, .38); }
.ask {
  position: relative;
  width: min(440px, 100%);
  background: var(--list); color: var(--ink);
  border-radius: 16px; padding: 24px;
  box-shadow: 0 20px 50px rgba(20, 16, 15, .3);
}
.ask h2 { font-family: var(--serif); font-size: 22px; font-weight: 700; margin: 0 0 10px; letter-spacing: -.02em; }
.ask p { margin: 0 0 12px; font-size: 15px; line-height: 1.55; }
.ask-facts { list-style: none; margin: 0 0 14px; padding: 0; }
.ask-facts li {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 14.5px; color: var(--ink-soft);
  padding: 6px 0; border-bottom: 1px solid var(--rule);
}
.ask-facts b { font-family: var(--mono); font-size: 14px; color: var(--ink); min-width: 34px; }
.ask-note { font-size: 13.5px; color: var(--ink-soft); background: var(--sel); border-radius: 10px; padding: 10px 12px; }
.ask-buttons { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.ask-buttons .btn { flex: 1; min-width: 96px; }
.ask-small { font-size: 12.5px; color: var(--ink-faint); margin: 12px 0 0; }

/* ═══════════ photo viewer ═══════════ */

body.lb-open { overflow: hidden; }

.lightbox {
  position: fixed; inset: 0; z-index: 95;
  background: rgba(16, 13, 12, .94);
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
}
.lightbox[hidden] { display: none; }

.lb-track {
  grid-column: 1 / -1; grid-row: 1;
  display: flex; height: 100dvh; min-width: 0;
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.lb-track::-webkit-scrollbar { display: none; }

.lb-slide {
  flex: 0 0 100%; min-width: 0;      /* or the image's own width stretches it */
  height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  scroll-snap-align: center;
  --lb-chrome: 128px;                /* the room the counter and dots take */
  padding: 56px 16px 72px;
}
/* The height is stated outright rather than as a percentage. A percentage
   max-height resolves against the parent's height, and in an auto-sized
   track that is indefinite, so the browser drops it and a tall photo runs
   off the bottom of the screen. */
.lb-slide img {
  max-width: 100%;
  max-height: calc(100dvh - var(--lb-chrome));
  width: auto; height: auto;
  object-fit: contain;
  border-radius: 6px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
}

.lb-close {
  position: absolute; top: 12px; right: 14px; z-index: 3;
  width: 42px; height: 42px; padding: 0;
  border: 0; border-radius: 50%;
  background: rgba(255, 255, 255, .12); color: #fff;
  font-size: 26px; line-height: 40px; cursor: pointer;
}
.lb-close:hover { background: rgba(255, 255, 255, .24); }

.lb-count {
  position: absolute; top: 22px; left: 0; right: 0; z-index: 2;
  text-align: center; pointer-events: none;
  font-family: var(--mono); font-size: 13px;
  color: rgba(255, 255, 255, .72);
}

.lb-arrow {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
  width: 46px; height: 76px; padding: 0;
  border: 0; border-radius: 10px;
  background: rgba(255, 255, 255, .1); color: #fff;
  font-size: 30px; line-height: 1; cursor: pointer;
}
.lb-arrow:hover { background: rgba(255, 255, 255, .22); }
.lb-arrow.prev { left: 12px; }
.lb-arrow.next { right: 12px; }

.lb-dots {
  position: absolute; left: 0; right: 0; bottom: 24px; z-index: 3;
  display: flex; justify-content: center; gap: 8px;
}
.lb-dot {
  width: 8px; height: 8px; padding: 0;
  border: 0; border-radius: 50%;
  background: rgba(255, 255, 255, .35); cursor: pointer;
}
.lb-dot.on { background: #fff; }

/* arrows are for pointers; a thumb swipes */
@media (hover: none), (max-width: 640px) {
  .lb-arrow { display: none; }
  .lb-slide { padding: 52px 8px 64px; --lb-chrome: 116px; }
}

/* ── attaching a photo from the recipe ── */

.ph-add {
  flex: 0 0 46%; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  aspect-ratio: 16 / 10;
  font: inherit; font-size: 13px; color: var(--ink-faint);
  background: var(--side-panel);
  border: 1px dashed var(--rule); border-radius: 10px;
  margin: 8px; cursor: pointer;
  scroll-snap-align: start;
}
.ph-add:hover { border-color: var(--accent); color: var(--accent); }
.ph-add .ico { width: 26px; height: 26px; flex-basis: 26px; }

/* when the recipe has none at all, the prompt takes the photo's place */
.s-photo.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  width: 100%; aspect-ratio: 16 / 10;
  font: inherit; font-size: 14px; color: var(--ink-faint);
  background: var(--side-panel);
  border: 1px dashed var(--rule); border-radius: 0;
  cursor: pointer;
}
.s-photo.empty:hover { border-color: var(--accent); color: var(--accent); }
.s-photo.empty .ico { width: 30px; height: 30px; flex-basis: 30px; }

/* ── choosing a food picture in the editor ── */

.ed-pick {
  flex-direction: column; gap: 2px;
  font-size: 10px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--ink-faint);
}
.ed-pick svg { display: block; }
.ed-pick:hover { border-color: var(--accent); color: var(--accent); }

.ed-picker {
  border: 1px solid var(--rule); border-radius: 12px;
  background: var(--side-panel);
  padding: 12px; margin-bottom: 20px;
}
.pick-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.pick-head .ed-lbl { margin: 0; white-space: nowrap; }
#pick-find {
  flex: 1; font: inherit; font-size: 14px; color: var(--ink);
  background: var(--list); border: 1px solid var(--rule);
  border-radius: 8px; padding: 7px 10px;
}
#pick-find:focus { outline: none; border-color: var(--accent); }

.pick-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
  gap: 6px; max-height: 260px; overflow-y: auto;
}
.pick-grid button {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--list); border: 1px solid transparent; border-radius: 9px;
  padding: 8px 4px; cursor: pointer;
}
.pick-grid button:hover { border-color: var(--accent); }
.pick-grid button[hidden] { display: none; }
.pick-art { display: block; line-height: 0; height: 40px; }
.pick-name {
  font-size: 10px; color: var(--ink-soft); line-height: 1.2; text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 68px;
}

/* ── your own food pictures ── */

.fr-own {
  display: block;
  background-size: contain; background-position: center bottom; background-repeat: no-repeat;
  background-color: transparent;
  border-radius: 0;
  filter: drop-shadow(0 4px 4px rgba(20, 16, 15, .26));
  transition: transform .16s ease;
}
.fr-item:hover .fr-own { transform: translateY(-3px) scale(1.04); }
.fr-item.gone .fr-own { opacity: .5; filter: grayscale(.7); }

.fr-pic {
  display: block; width: 100%;
  font: inherit; font-size: 14.5px; font-weight: 500;
  background: var(--sel); color: var(--ink);
  border: 0; border-radius: 9px;
  padding: 10px 12px; margin: 0 0 12px;
  cursor: pointer;
}
.fr-pic:hover { color: var(--accent); }

.pick-new { border: 1px dashed var(--rule) !important; }
.pick-new:hover { border-color: var(--accent) !important; }
.pick-new .ico { width: 26px; height: 26px; flex-basis: 26px; color: var(--ink-faint); }
.pick-new .pick-art { display: grid; place-items: center; }

.fr-pic.sub {
  background: none; color: var(--ink-soft);
  font-size: 13.5px; font-weight: 400;
  padding: 6px 12px; margin-bottom: 12px;
}
.fr-pic.sub:hover { color: var(--accent); }

.pick-cell { position: relative; display: block; }
.pick-cell[hidden] { display: none; }
.pick-cell > button[data-food] { width: 100%; }
.pick-x {
  position: absolute; top: -5px; right: -5px;
  width: 20px; height: 20px; padding: 0;
  border: 0; border-radius: 50%;
  background: var(--list); color: var(--ink-soft);
  font-size: 14px; line-height: 18px;
  box-shadow: 0 1px 4px rgba(20, 16, 15, .28);
  cursor: pointer; opacity: 0;
}
.pick-cell:hover .pick-x, .pick-x:focus-visible { opacity: 1; }
.pick-x:hover { background: var(--red, #C0392B); color: #fff; }
@media (hover: none) { .pick-x { opacity: 1; } }

/* Premium open-appliance visual. The contents still come entirely from the
   inventory renderer; these layers only give them a convincing home. */
.appliance {
  position: relative;
  max-width: 680px;
  margin: 10px auto 30px;
  padding: 13px 13px 18px;
  border: 1px solid rgba(31,36,38,.3);
  border-radius: 24px 24px 18px 18px;
  background:
    linear-gradient(90deg, #aeb3b5 0, #e9ebeb 2.3%, #f8f9f8 5%, #d6d9da 8%,
      #f5f6f6 50%, #d1d5d6 92%, #f8f9f9 96%, #a9aeb0 100%);
  box-shadow: 0 24px 55px rgba(21,25,27,.22), 0 5px 14px rgba(21,25,27,.14),
    inset 0 1px rgba(255,255,255,.95), inset 0 -2px 4px rgba(34,39,41,.18);
}
.appliance::before {
  content: ""; position: absolute; inset: 7px 7px 10px; border-radius: 19px 19px 13px 13px;
  border: 1px solid rgba(42,48,50,.22); pointer-events: none;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.45);
}
.appliance::after {
  content: ""; position: absolute; left: 8%; right: 8%; bottom: 7px; height: 5px;
  border-radius: 50%; background: rgba(48,55,58,.22); filter: blur(3px); pointer-events: none;
}
.appliance .interior {
  overflow: hidden;
  min-height: 640px;
  padding: 68px clamp(20px, 5vw, 48px) 28px;
  border: 1px solid rgba(52,63,67,.28);
  border-radius: 15px 15px 10px 10px;
  background:
    linear-gradient(90deg, rgba(93,105,109,.16), transparent 7%, transparent 93%, rgba(86,98,102,.18)),
    radial-gradient(ellipse at 50% 0, rgba(255,255,255,1) 0, rgba(255,255,255,.68) 24%, transparent 54%),
    linear-gradient(180deg, #f7f9f8 0%, #eef2f1 52%, #e4e9e8 100%);
  box-shadow: inset 0 15px 25px rgba(44,52,55,.2), inset 15px 0 24px -16px rgba(33,41,44,.38),
    inset -15px 0 24px -16px rgba(33,41,44,.38), inset 0 -10px 20px -12px rgba(31,39,42,.3);
}
.fridge-light {
  position: absolute; z-index: 5; top: 18px; left: 24%; right: 24%; height: 23px;
  border-radius: 5px 5px 9px 9px;
  border: 1px solid rgba(106,111,105,.3);
  background: linear-gradient(180deg, #f9f8e8, #fffef4 45%, #e9e7d0);
  box-shadow: 0 0 9px rgba(255,249,205,.95), 0 10px 35px 13px rgba(255,248,201,.43),
    inset 0 2px 5px rgba(255,255,255,.9);
}
.fridge-light::after {
  content: ""; position: absolute; left: 18%; right: 18%; bottom: 4px; height: 3px;
  border-radius: 50%; background: rgba(255,255,255,.95); filter: blur(1px);
}
.fridge-vent {
  position: absolute; z-index: 4; top: 49px; left: 38%; right: 38%; height: 4px;
  opacity: .32; border-radius: 3px;
  background: repeating-linear-gradient(90deg, #677174 0 7px, transparent 7px 11px);
}
.appliance .rack { min-height: 160px; padding: 0 0 17px; }
.appliance .rack-floor {
  min-height: 136px; gap: clamp(10px, 3vw, 25px); padding: 8px 10px 0;
  justify-content: space-evenly; align-items: flex-end;
}
.appliance .rail {
  left: -8px; right: -8px; bottom: 3px; height: 12px; border-radius: 3px 3px 6px 6px;
  border: 1px solid rgba(94,119,126,.34);
  background: linear-gradient(180deg, rgba(249,254,255,.96) 0 28%, rgba(184,211,216,.76) 29% 53%,
    rgba(113,142,149,.62) 54% 67%, rgba(226,240,242,.88) 68% 100%);
  box-shadow: 0 7px 10px rgba(38,52,56,.2), inset 0 1px rgba(255,255,255,.95);
}
.appliance .rail::before {
  content: ""; position: absolute; left: 2%; right: 2%; top: -4px; height: 5px;
  transform: perspective(25px) rotateX(18deg); transform-origin: bottom;
  background: rgba(207,230,234,.48); border: 1px solid rgba(126,159,166,.22);
}
.appliance .drawers { gap: 14px; margin-top: 20px; }
.appliance .crisper {
  min-height: 158px; padding: 26px 10px 30px; overflow: hidden;
  border: 1px solid rgba(95,126,134,.42); border-radius: 8px 8px 11px 11px;
  background: linear-gradient(155deg, rgba(255,255,255,.67), rgba(195,221,226,.32) 48%, rgba(131,168,177,.3));
  box-shadow: inset 0 1px 1px rgba(255,255,255,.9), inset 0 -12px 22px rgba(92,128,137,.14),
    0 5px 11px rgba(36,50,54,.18);
  backdrop-filter: blur(1px);
}
.appliance .crisper::before {
  content: ""; position: absolute; left: 0; right: 0; top: 18px; height: 1px;
  background: rgba(88,119,127,.24); box-shadow: 0 2px rgba(255,255,255,.7);
}
.appliance .crisper-grip {
  z-index: 3; top: 7px; left: 29%; right: 29%; height: 5px;
  background: linear-gradient(180deg, rgba(78,103,109,.43), rgba(255,255,255,.38));
  box-shadow: inset 0 1px rgba(35,50,54,.22);
}
.appliance .crisper-label { bottom: 8px; color: rgba(51,78,84,.58); }
.appliance .crisper .rack-floor { min-height: 99px; padding-top: 2px; }
.appliance .fr-cell {
  position: relative; display: inline-flex; align-items: flex-end; justify-content: center;
  transform: translate(var(--food-x, 0px), var(--food-y, 0px)) scale(var(--food-scale, 1));
  transform-origin: center bottom; touch-action: none; cursor: grab;
  user-select: none; -webkit-user-select: none;
}
.appliance .fr-cell.is-dragging { cursor: grabbing; z-index: 20; filter: brightness(1.04); }
.appliance .rack:has(.fr-cell:hover), .appliance .rack:has(.fr-cell.is-dragging),
.appliance .crisper:has(.fr-cell:hover), .appliance .crisper:has(.fr-cell.is-dragging) { z-index: 30; }
.appliance .rack-floor, .appliance .crisper .rack-floor { overflow: visible; }
.appliance.is-fridge .crisper, .appliance.is-freezer .crisper { overflow: visible; }
.appliance .fr-cell { z-index: 8; }
.fr-menu.fr-menu-portal { position: fixed; z-index: 10000; margin: 0; width: min(300px, calc(100vw - 20px)); }
.appliance .fr-item { width: 104px; max-width: 104px; padding: 0 2px; }
.appliance .fr-art svg { filter: drop-shadow(0 5px 4px rgba(32,39,41,.24)); }
.appliance .fr-tag {
  margin-top: -7px; max-width: 100%; padding: 2px 4px 0; border-radius: 0;
  background: transparent; box-shadow: none; text-shadow: 0 1px rgba(255,255,255,.9);
}
.appliance .fr-name { font-size: 10px; max-width: 94px; }
.appliance .fr-days { display: inline-block; margin-top: 2px; padding: 1px 5px; border-radius: 8px;
  background: rgba(255,255,255,.72); font-size: 8.5px; box-shadow: 0 1px 2px rgba(38,49,52,.12); }
.appliance .fr-x {
  z-index: 8; top: -5px; right: -4px; width: 20px; height: 20px; opacity: 0;
  border-radius: 50%; background: rgba(45,51,53,.82); color: #fff;
  transition: opacity .15s ease, transform .15s ease;
}
.appliance .fr-cell:hover .fr-x, .appliance .fr-x:focus-visible { opacity: 1; transform: scale(1.03); }
.appliance.is-pantry .interior { background: linear-gradient(90deg, rgba(102,82,53,.12), transparent 8%, transparent 92%, rgba(102,82,53,.12)), linear-gradient(180deg,#fbf8f1,#eee8dc); }
.appliance.is-freezer .interior { background: linear-gradient(90deg,rgba(70,110,121,.13),transparent 8%,transparent 92%,rgba(70,110,121,.13)),linear-gradient(180deg,#f7fbfc,#e7f1f3); }
[data-theme="dark"] .appliance { background: linear-gradient(90deg,#252a2c,#606668 5%,#353b3d 11%,#555b5d 50%,#303638 90%,#656b6d 96%,#222729); border-color: #16191a; }
[data-theme="dark"] .appliance .interior { background: radial-gradient(ellipse at 50% 0,rgba(255,242,190,.13),transparent 48%),linear-gradient(90deg,#171d1f,#2b3334 8%,#303839 50%,#293132 92%,#171d1f); }
[data-theme="dark"] .appliance .fr-tag { background: transparent; }
[data-theme="dark"] .appliance .fr-name { color: rgba(255,255,255,.87); text-shadow: 0 1px 2px #000; }
[data-theme="dark"] .appliance .fr-days { background: rgba(15,19,20,.68); }
/* The fridge uses a photographed empty appliance as its material layer.
   Inventory remains live HTML above it, so nothing in the image is fake. */
.appliance.is-fridge {
  padding: 0; border: 0; border-radius: 12px; overflow: hidden;
  background: #d7d9d9;
  box-shadow: 0 28px 58px rgba(20,24,26,.27), 0 8px 18px rgba(20,24,26,.16);
}
.appliance.is-fridge::before, .appliance.is-fridge::after { display: none; }
.appliance.is-fridge .interior {
  aspect-ratio: 4 / 5; min-height: 0; padding: 10.5% 10.5% 7%;
  border: 0; border-radius: 0;
  background: url("fridge-realistic.png") center / 100% 100% no-repeat;
  box-shadow: none;
}
.appliance.is-fridge .fridge-light, .appliance.is-fridge .fridge-vent,
.appliance.is-fridge .rail { display: none; }

.appliance.is-fridge .rack-floor {

}
.appliance.is-fridge .crisper {

  overflow: hidden; background: transparent; box-shadow: none; backdrop-filter: none;
}
.appliance.is-fridge .crisper::before, .appliance.is-fridge .crisper-grip,
.appliance.is-fridge .crisper-label { display: none; }
.appliance.is-fridge .crisper .rack-floor { height: 100%; min-height: 0; padding: 0; overflow: hidden; }
.appliance.is-fridge .fr-art svg { filter: drop-shadow(0 5px 3px rgba(20,26,28,.32)); }
.appliance.is-fridge .fr-tag {

.appliance.is-fridge .fr-name { font-weight: 650; color: #242828; }
.appliance.is-fridge .fr-days { background: transparent; box-shadow: none; padding: 0; }
/* Matching photographed material plates for the other two storage spaces. */
.appliance.is-freezer, .appliance.is-pantry {

.appliance.is-freezer::before, .appliance.is-freezer::after,

.appliance.is-freezer .fridge-light, .appliance.is-freezer .fridge-vent,
.appliance.is-freezer .rail, .appliance.is-pantry .fridge-light,

.appliance.is-freezer .rack { min-height: 0; height: 28.5%; padding: 0; flex: 0 0 28.5%; }
.appliance.is-freezer .rack-floor,
.appliance.is-pantry .rack-floor {
  min-height: 0; height: 100%; overflow: visible; padding: 2px 2.5% 2.5%;

.appliance.is-freezer .crisper {

.appliance.is-freezer .crisper::before, .appliance.is-freezer .crisper-grip,
.appliance.is-freezer .crisper-label { display: none; }

.appliance.is-pantry .rack { min-height: 0; height: 22.8%; padding: 0; flex: 0 0 22.8%; }
.appliance.is-freezer .fr-art svg, .appliance.is-pantry .fr-art svg {

.appliance.is-freezer .fr-tag, .appliance.is-pantry .fr-tag {

/* Visual mode should read like an appliance, not an inventory-card grid.
   Names and freshness remain in List view, the item tooltip, and its menu. */
.appliance .fr-tag { display: none; }
.appliance .fr-art:has(.fr-own) { margin-bottom: 1px; }
.appliance .fr-own { filter: drop-shadow(0 7px 5px rgba(24,31,33,.28)); }
.fr-size { padding: 8px 6px 10px; border-bottom: 1px solid var(--rule); margin-bottom: 6px; }
.fr-size-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 6px; }
.fr-size-row button {
  font: inherit; font-family: var(--mono); font-size: 10.5px; padding: 6px 2px;
  border: 1px solid var(--rule); border-radius: 7px; background: none; color: var(--ink-soft); cursor: pointer;
}
.fr-size-row button.on { color: #fff; border-color: var(--accent-fill); background: var(--accent-fill); }
.fr-reset-pos { width: 100%; margin-top: 6px; border: 0; background: none; color: var(--ink-soft); font: inherit; font-size: 12px; cursor: pointer; }
.fr-photo-library { margin: 20px 0 30px; }
.fr-photo-library-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.fr-photo-library-head h3 { margin: 0; font-family: var(--serif); font-size: 17px; font-weight: 700; }
.fr-photo-library-head span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.fr-photo-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px;
  max-height: 310px; overflow-y: auto; padding: 2px; scrollbar-width: thin;
}
.fr-photo-card { min-width: 0; border: 1px solid var(--rule); border-radius: 11px; background: var(--list); overflow: hidden; }
.fr-photo-tile {
  position: relative; min-width: 0; width: 100%; height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  border: 0; border-radius: 0; padding: 7px 5px 6px; background: transparent;
  color: var(--ink); font: inherit; cursor: pointer; transition: border-color .15s ease, background .15s ease, transform .15s ease;
}
.fr-photo-tile:hover { background: var(--accent-wash); }
.fr-photo-tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fr-photo-tile::after {
  content: "+"; position: absolute; top: 5px; right: 6px; width: 18px; height: 18px;
  display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.88);
  color: var(--accent); font-size: 15px; line-height: 1; box-shadow: 0 1px 3px rgba(20,16,15,.15);
}
.fr-photo-tile-art { min-height: 70px; display: grid; place-items: center; line-height: 0; overflow: hidden; }
.fr-photo-tile-art .fr-own { max-width: 92px; max-height: 66px; }
.fr-photo-tile-art .fr-photo { filter: drop-shadow(0 3px 3px rgba(30,34,36,.18)); }
.fr-photo-tile-name { display: block; width: 100%; margin-top: 4px; font-size: 10px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fr-photo-actions { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule); }
.fr-photo-actions button {

}
.fr-photo-actions button + button { border-left: 1px solid var(--rule); color: var(--danger); }
.fr-photo-actions button:hover { background: var(--sel); color: var(--accent); }
.fr-photo-kind { display: block; border-top: 1px solid var(--rule); padding: 6px 3px; text-align: center; font-size: 9px; color: var(--ink-faint); }
.fr-photo-empty { margin: 0; padding: 12px; color: var(--ink-faint); font-size: 13px; border: 1px dashed var(--rule); border-radius: 10px; }
.snack-library { margin: 24px 0 26px; }
.kitchen-food-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 14px 12px 4px; padding: 4px; border-radius: 10px; background: var(--sel); }
.kitchen-food-tabs button { border: 0; border-radius: 7px; padding: 8px 4px; background: transparent; color: var(--ink-soft); font: inherit; font-size: 12px; cursor: pointer; }

/* ============================================================
   Design study — Warm Modern Cookbook
   A visual-only layer: no data model or interaction changes.
   ============================================================ */
:root {
  --side: #EDE6DA;
  --list: #FFFCF7;
  --page: #F8F2E8;
  --ink: #29251F;
  --ink-soft: #6D655B;
  --ink-faint: #A2988B;
  --rule: rgba(61,52,42,.13);
  --accent: #3F6D43;
  --accent-fill: #3F6D43;
  --accent-wash: rgba(63,109,67,.11);
  --danger: #B84D3E;
  --sel: rgba(69,57,43,.065);
  --side-panel: #F0E9DE;
  --shadow-soft: 0 10px 30px rgba(62,48,34,.08);
  --shadow-card: 0 3px 14px rgba(62,48,34,.07);
}
[data-theme="dark"] {
  --side: #24221D; --list: #1B1A17; --page: #201E19; --side-panel: #292720;
  --ink: #F7F1E7; --ink-soft: #C8BEB0; --ink-faint: #A59B8D;
  --rule: rgba(242,236,225,.13); --accent: #91B77E; --accent-fill: #456B42;
  --accent-wash: rgba(145,183,126,.13); --sel: rgba(242,236,225,.075);
}
body {
  background:
    radial-gradient(circle at 82% 4%, rgba(197,154,82,.08), transparent 28rem),
    linear-gradient(135deg, rgba(255,255,255,.22), transparent 42%), var(--page);
  letter-spacing: -.006em;
}
.side {
  background: linear-gradient(180deg, rgba(255,255,255,.18), transparent 38%), var(--side);
  border-right: 1px solid rgba(61,52,42,.1); padding: 22px 14px 14px;
}
.side-title { margin-bottom: 28px; }
.side-row { min-height: 42px; padding: 9px 11px; border-radius: 12px; transition: background .16s ease, transform .16s ease; }
.side-row:hover { transform: translateX(2px); }
.side-row[aria-current="true"] {
  background: rgba(255,252,247,.72); box-shadow: 0 1px 0 rgba(255,255,255,.7), var(--shadow-card);
}
.side-row .ico { color: #5E7E55; }
.side-row .pill { background: rgba(63,109,67,.1); color: var(--accent); border-radius: 999px; padding: 1px 7px; }
.side-foot { border-top-color: rgba(61,52,42,.11); }
.list { background: rgba(255,252,247,.9); border-right: 1px solid var(--rule); }
.list-head {
  min-height: 68px; padding: 12px 16px; background: rgba(255,252,247,.88);
  backdrop-filter: blur(16px); border-bottom: 0;
}
.lt-name { font-family: var(--serif); font-size: 20px; font-weight: 700; letter-spacing: -.025em; }
.searchbar { padding: 4px 16px 14px; border-bottom: 0; }
#search {
  height: 40px; border: 1px solid var(--rule); border-radius: 12px;
  background: rgba(255,255,255,.62); padding: 8px 12px; box-shadow: inset 0 1px rgba(255,255,255,.7);
}
#search:focus { background: var(--list); border-color: rgba(63,109,67,.42); box-shadow: 0 0 0 3px var(--accent-wash); }
.rows { padding: 2px 10px 40px; }
.row { margin: 3px 0; padding: 10px; border-radius: 14px; min-height: 78px; }
.row::after { display: none; }
.row:hover { background: rgba(237,230,218,.65); }
.row[aria-current="true"] { background: var(--accent-fill); box-shadow: 0 8px 22px rgba(63,109,67,.19); }
.row-img { width: 58px; height: 58px; flex-basis: 58px; border-radius: 11px; box-shadow: 0 2px 8px rgba(36,28,20,.12); }
.row-image-wrap {
  position: relative; width: 58px; height: 58px; flex: 0 0 58px;
}
.row-image-wrap .row-img { width: 100%; height: 100%; }
.row-chef-badge {
  position: absolute; right: -6px; bottom: -6px; z-index: 2;
  width: 25px; height: 25px; display: grid; place-items: center;
  border-radius: 50%; color: var(--accent); background: var(--list);
  border: 1px solid var(--rule); box-shadow: 0 3px 9px rgba(36,28,20,.18);
}

  color: var(--accent-fill); background: #fff; border-color: rgba(255,255,255,.72);
}

.row-title { font-family: var(--serif); font-size: 16px; font-weight: 650; }
.detail { background: transparent; }
.placeholder-mark { filter: sepia(.12); opacity: .8; }
.sheet[data-mode="recipe"] { position: relative; isolation: isolate; }
.sheet[data-mode="recipe"] > :not(.recipe-watermark) { position: relative; z-index: 1; }
.recipe-watermark {
  position: fixed !important; z-index: 0 !important;
  left: auto; right: 4vw; top: auto; bottom: 5vh; transform: none;
  width: min(9vw, 115px) !important; height: auto; opacity: .045 !important;
  pointer-events: none; user-select: none; filter: sepia(.2) saturate(.7) !important;
}
[data-theme="dark"] .recipe-watermark { opacity: .065 !important; filter: none !important; }
@container (min-width: 600px) {
  .sheet[data-mode="recipe"] {
    display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w);
    grid-template-areas: none; align-items: start;
    background: var(--list);
  }
  .recipe-main, .recipe-side { min-width: 0; }
  .recipe-main { display: flex; flex-direction: column; }
  .recipe-side { display: flex; flex-direction: column; min-height: 100%; background: var(--side-panel); }
  .recipe-main .s-head { padding: 34px 38px 0; }

}

  .recipe-main, .recipe-side { display: contents; }
  .sheet[data-mode="recipe"] .s-photo { order: 1; }
  .sheet[data-mode="recipe"] .s-head { order: 2; }
  .sheet[data-mode="recipe"] .s-ing { order: 3; }
  .sheet[data-mode="recipe"] .s-steps { order: 4; }
  .recipe-watermark { right: 7vw; bottom: 4vh; width: min(18vw, 90px) !important; }
}
.sheet:not([data-mode="plain"]) { background: var(--list); }
.s-head { padding-top: 32px; }
.r-title { font-size: clamp(31px, 5vw, 48px); line-height: 1.02; letter-spacing: -.04em; }
.r-meta { color: var(--ink-soft); }
.s-photo img, .ph-track img { box-shadow: inset 0 -1px rgba(0,0,0,.08); }
.s-ing {
  background: linear-gradient(145deg, rgba(63,109,67,.08), rgba(197,154,82,.06)), var(--side-panel);

/* Fresh-kitchen photography: real produce, softened so the interface stays calm. */
:root {
  --side: #E9EEE1;
  --list: #FFFDF8;
  --page: #F7F1E5;
  --side-panel: #F0EBDD;
  --sel: rgba(70, 119, 62, .09);
}
body {
  background-color: var(--page);
  background-image:
    linear-gradient(rgba(250,247,238,.78), rgba(250,247,238,.86)),
    url("healthy-kitchen-vegetables.webp");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}
.side {
  position: relative;
  overflow: hidden;
  background-color: rgba(239,242,231,.91);
  background-image:
    linear-gradient(rgba(245,245,236,.82), rgba(235,239,226,.90)),
    url("healthy-kitchen-vegetables.webp");
  background-size: cover;
  background-position: center;
}
.side::after {
  content: ""; position: absolute; pointer-events: none; inset: 0;
  background: linear-gradient(90deg, rgba(255,255,255,.15), transparent 70%);
}
.side > * { position: relative; z-index: 1; }
.list {
  background-color: rgba(255,253,248,.95);
  box-shadow: 10px 0 34px rgba(45,49,35,.06);
}
.detail {
  background-color: var(--page);
  background-image:
    linear-gradient(rgba(250,247,238,.68), rgba(250,247,238,.76)),
    url("healthy-kitchen-vegetables.webp");
  background-size: cover;
  background-position: center;
  background-attachment: local;
}
[data-theme="dark"] {
  --side: #22271F;
  --list: #191713;
  --page: #1E1A16;
  --side-panel: #29251E;
}
[data-theme="dark"] body {
  background-image:
    linear-gradient(rgba(22,23,18,.88), rgba(22,23,18,.92)),
    url("healthy-kitchen-vegetables.webp");
}
[data-theme="dark"] .side {
  background-image:
    linear-gradient(rgba(28,31,25,.84), rgba(28,31,25,.91)),
    url("healthy-kitchen-vegetables.webp");
  background-size: cover;
  background-position: center;
}
[data-theme="dark"] .list { background-color: rgba(25,23,19,.96); }
[data-theme="dark"] .detail {
  background-color: var(--page);
  background-image:
    linear-gradient(rgba(22,21,18,.78), rgba(22,21,18,.84)),
    url("healthy-kitchen-vegetables.webp");
}
/* Keep every third-panel screen legible while allowing the produce photograph
   to read through the empty space around its controls and content cards. */
.detail .plain-wrap,
.detail .fridge-page,
.detail .cookfrom-page { position: relative; z-index: 1; }
/* A calm reading layer over the photograph on every utility screen. */
.detail .plain-wrap,
.detail .cal,
.detail .fridge-page,
.detail .cookfrom-page {
  min-height: 100%;
  background: rgba(255,253,248,.82);
  box-shadow: inset 0 1px rgba(255,255,255,.72);
  backdrop-filter: blur(7px) saturate(.78);
}
.detail .shop li,
.detail .fr-list li { border-color: rgba(65,57,47,.14); }
/* Hide sidebar badges while retaining useful counts inside their pages. */
.side-row .n { display: none !important; }
.list { position: relative; }
.column-placeholder {
  position: absolute; inset: 0; z-index: 5; display: none;
  place-items: center; pointer-events: none;
  background: #FCFAF3;
}
.column-placeholder img { width: min(34%, 118px); height: auto; opacity: .66; filter: sepia(.08); }
.list.is-resting > :not(.column-placeholder) { visibility: hidden; }
.list.is-resting .column-placeholder { display: grid; visibility: visible; }
[data-theme="dark"] .column-placeholder {
  background: #1B1916;
}
[data-theme="dark"] .detail .plain-wrap,
[data-theme="dark"] .detail .cal,
[data-theme="dark"] .detail .fridge-page,
[data-theme="dark"] .detail .cookfrom-page {
  background: rgba(24,23,20,.86);
  box-shadow: inset 0 1px rgba(255,255,255,.035);
}
.detail .fr-tabs,
.detail .fr-list,
.detail .fr-add,
.detail .home-browse-card,
.detail .home-panel,
.detail .home-collections,
.detail .cal-day,
.detail .putaway {
  background-color: rgba(255,253,248,.86);
  backdrop-filter: blur(8px);
}
[data-theme="dark"] .detail .fr-tabs,
[data-theme="dark"] .detail .fr-list,
[data-theme="dark"] .detail .fr-add,
[data-theme="dark"] .detail .home-browse-card,
[data-theme="dark"] .detail .home-panel,
[data-theme="dark"] .detail .home-collections,
[data-theme="dark"] .detail .cal-day,
[data-theme="dark"] .detail .putaway {
  background-color: rgba(35,33,28,.86);
}
/* Kitchen inventory sits as one purposeful card instead of a large white slab. */
.detail .fridge-page {
  min-height: 0;
  width: calc(100% - 44px);
  max-width: 760px;
  margin: 28px auto 72px;
  padding: 0 0 20px;
  overflow: hidden;
  border: 1px solid rgba(65,57,47,.12);
  border-radius: 22px;
  background: rgba(255,253,248,.94);
  box-shadow: 0 18px 50px rgba(43,37,28,.14);
  backdrop-filter: blur(12px) saturate(.8);
}
.detail .fridge-page .fr-tabs {
  margin: 0 !important;
  padding: 8px 14px 0;
  background: rgba(236,239,226,.64);
  border-bottom: 1px solid rgba(65,57,47,.11);
}
.detail .fridge-page .fr-tabs button { padding-top: 13px; padding-bottom: 14px; }
.detail .fridge-page .fr-list {
  margin: 16px 18px 0;
  overflow: hidden;
  border: 1px solid rgba(65,57,47,.10);
  border-radius: 14px;
  background: rgba(255,255,255,.42);
  box-shadow: none;
}
.detail .fridge-page .fr-list .fr-item.fr-row { padding-left: 16px; padding-right: 16px; }
.detail .fridge-page .fr-add {
  margin: 18px 18px 0 !important;
  padding: 12px 14px;
  border: 1px solid rgba(65,57,47,.11);
  border-radius: 14px;
  background: rgba(255,255,255,.58);
}
[data-theme="dark"] .detail .fridge-page { background: rgba(29,28,24,.95); }
[data-theme="dark"] .detail .fridge-page .fr-tabs { background: rgba(67,77,57,.34); }
[data-theme="dark"] .detail .fridge-page .fr-list,
[data-theme="dark"] .detail .fridge-page .fr-add { background: rgba(255,255,255,.035); }
@media (max-width: 719px) {
  .detail .fridge-page {
    width: calc(100% - 24px); margin: 54px auto 36px; border-radius: 17px;
  }
}
.cookfrom-intro { padding: 24px 18px; color: var(--ink-soft); line-height: 1.55; }
.cookfrom-intro strong { display: block; margin-bottom: 5px; color: var(--ink); font-family: var(--serif); font-size: 17px; }
.cookfrom-page { max-width: 920px; }
.cookfrom-head { margin-bottom: 30px; }
.cookfrom-head .ed-lbl { display: block; margin-bottom: 8px; }
.cookfrom-head h1 { margin: 0 0 8px; font-family: var(--serif); font-size: clamp(30px, 4vw, 44px); letter-spacing: -.035em; }
.cookfrom-head p { margin: 0; max-width: 610px; color: var(--ink-soft); line-height: 1.5; }
.cookfrom-page .matches { margin-top: 10px; }

/* The sidebar picked up position:relative from the styling further up, which
   overrode the drawer and left it sitting underneath the list on any screen
   too narrow for three panes. Restated here, after that rule, so it wins. */
@media (max-width: 719px) {
  .side {
    position: fixed !important;
    inset: 0 auto 0 0 !important;
    z-index: 30;
    width: min(84vw, var(--side-w));
    transform: translateX(-102%);
    height: 100dvh;
  }
  body[data-side="open"] .side { transform: none !important; }
}

/* Narrow three-pane range. These have to live at the end of the sheet: the
   same cascade problem as the sidebar, where later rules in the file would
   otherwise override anything set in an earlier media query. */
@media (min-width: 720px) and (max-width: 1023px) {
  .cookedbar { gap: 2px !important; padding-left: 6px !important; padding-right: 6px !important; }
  .cookedbar button { font-size: 11px !important; padding: 6px 3px !important; gap: 3px !important; }
  .side-row { font-size: 13.5px !important; padding: 8px 6px !important; gap: 8px !important; }
  .s-head { padding: 20px 16px 0 !important; }
  .s-steps { padding: 0 16px 70px !important; }
}
</style>

<script>
/* ============================================================
   mela.js — reads Mela exports without any dependencies.

   Mela hands you one of three things:
     .melarecipe   a single JSON document
     .melarecipes  a zip archive full of .melarecipe documents
     .json         a plain array or object, if you exported that way

   The zip reader below uses DecompressionStream('deflate-raw'),
   which every current Chrome and Firefox has. No JSZip, no CDN,
   so the whole app still works with the network off.
   ============================================================ */

(function (global) {
  'use strict';

  /* ---------- minimal zip reader ---------- */

  const EOCD  = 0x06054b50;   // end of central directory
  const CEN   = 0x02014b50;   // central directory entry
  const Z64L  = 0x07064b50;   // zip64 locator
  const Z64E  = 0x06064b50;   // zip64 end of central directory
  const U32MAX = 0xFFFFFFFF;

  /* Mela writes Zip64 archives with streaming data descriptors, so the
     32-bit size fields in the central directory are 0xFFFFFFFF markers and
     the real sizes live in a Zip64 extra field. Reading the marker as a
     length asks for a four gigabyte slice, which clamps to the rest of the
     file — every entry then looks like the whole archive. */
  async function unzip(arrayBuffer) {
    const view = new DataView(arrayBuffer);
    const bytes = new Uint8Array(arrayBuffer);

    const eocd = findSig(view, EOCD, view.byteLength - 22, 66000);
    if (eocd < 0) throw new Error('That file is not a readable zip archive.');

    let count = view.getUint16(eocd + 10, true);
    let ptr = view.getUint32(eocd + 16, true);

    // a Zip64 locator sits just before the EOCD when the archive needs one
    const loc = findSig(view, Z64L, eocd - 20, 80);
    if (loc >= 0) {
      const z64 = num(view.getBigUint64(loc + 8, true));
      if (z64 >= 0 && z64 + 56 <= view.byteLength && view.getUint32(z64, true) === Z64E) {
        count = num(view.getBigUint64(z64 + 32, true));
        ptr   = num(view.getBigUint64(z64 + 48, true));
      }
    }

    const out = [];
    for (let i = 0; i < count; i++) {
      if (ptr + 46 > view.byteLength || view.getUint32(ptr, true) !== CEN) break;

      const method   = view.getUint16(ptr + 10, true);
      const nameLen  = view.getUint16(ptr + 28, true);
      const extraLen = view.getUint16(ptr + 30, true);
      const cmtLen   = view.getUint16(ptr + 32, true);
      const name     = new TextDecoder().decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));

      let compSize   = view.getUint32(ptr + 20, true);
      let uncompSize = view.getUint32(ptr + 24, true);
      let localAt    = view.getUint32(ptr + 42, true);

      if (compSize === U32MAX || uncompSize === U32MAX || localAt === U32MAX) {
        const z = readZip64Extra(view, ptr + 46 + nameLen, extraLen,
                                 { uncompSize, compSize, localAt });
        uncompSize = z.uncompSize; compSize = z.compSize; localAt = z.localAt;
      }

      // the local header repeats the name and extra at its own lengths
      const lNameLen  = view.getUint16(localAt + 26, true);
      const lExtraLen = view.getUint16(localAt + 28, true);
      const dataAt    = localAt + 30 + lNameLen + lExtraLen;

      if (!name.endsWith('/') && compSize >= 0 && dataAt + compSize <= bytes.length) {
        const raw = bytes.subarray(dataAt, dataAt + compSize);
        out.push({ name, data: method === 0 ? raw : await inflate(raw) });
      }
      ptr += 46 + nameLen + extraLen + cmtLen;
    }
    return out;

  /* the Zip64 extra carries only the fields that were marked, in this order */
  function readZip64Extra(view, at, len, sizes) {
    const end = at + len;
    let p = at;

      const id = view.getUint16(p, true);
      const size = view.getUint16(p + 2, true);
      if (id === 0x0001) {
        let q = p + 4;
        if (sizes.uncompSize === U32MAX) { sizes.uncompSize = num(view.getBigUint64(q, true)); q += 8; }
        if (sizes.compSize   === U32MAX) { sizes.compSize   = num(view.getBigUint64(q, true)); q += 8; }
        if (sizes.localAt    === U32MAX) { sizes.localAt    = num(view.getBigUint64(q, true)); q += 8; }

     key spellings between versions, and Paprika-style exports use
     their own. Anything unrecognized is kept under `extra` rather
     than dropped, so nothing is lost on a round trip.

    if (Array.isArray(v)) return v.map(x => (typeof x === 'string' ? x : pick(x, 'text', 'name', 'title'))).filter(Boolean);

    return [];
  }

  function toImages(r) {
    const raw = r.images ?? r.image ?? r.photo ?? r.photos ?? r.imageData ?? [];
    const arr = Array.isArray(raw) ? raw : [raw];
    return arr.filter(Boolean).map(s => {
      if (typeof s !== 'string') return null;
      if (s.startsWith('data:') || s.startsWith('http')) return s;
      return 'data:image/jpeg;base64,' + s;         // Mela stores bare base64
    }).filter(Boolean);

  /* Mela writes dates in Apple's reference epoch — seconds since
     2001-01-01, not 1970. Read as Unix, 750355712 is October 1993,
     which sorts "Most Recent" against dates that never happened.
     If reading a seconds value as Unix lands before 2001, it has to
     be the Apple epoch, because Mela did not exist then. */

    if (n > 1e11) return n;                            // already milliseconds

  }

  const KNOWN = new Set(['id','title','name','text','description','summary','images','image','photo','photos',
    'imageData','categories','tags','keywords','yield','servings','recipeYield','prepTime','cookTime','totalTime',
    'ingredients','instructions','directions','method','notes','nutrition','link','url','source','sourceUrl',
    'favorite','isFavorite','wantToCook','rating','date','created','modified','thumb',
    'cooked','lastCooked','history']);

  function normalize(r, fallbackName) {
    const extra = {};
    for (const k of Object.keys(r)) if (!KNOWN.has(k)) extra[k] = r[k];

    return {
      id:           String(pick(r, 'id') || cryptoId()),
      title:        String(pick(r, 'title', 'name') || fallbackName || 'Untitled recipe'),
      description:  String(pick(r, 'text', 'description', 'summary')),
      images:       toImages(r),
      categories:   toLines(pick(r, 'categories', 'tags', 'keywords')),
      yield:        String(pick(r, 'yield', 'servings', 'recipeYield')),
      prepTime:     String(pick(r, 'prepTime')),
      cookTime:     String(pick(r, 'cookTime')),
      totalTime:    String(pick(r, 'totalTime')),
      ingredients:  toLines(pick(r, 'ingredients')),
      instructions: toLines(pick(r, 'instructions', 'directions', 'method')),
      notes:        String(pick(r, 'notes')),
      nutrition:    String(pick(r, 'nutrition')),
      link:         String(pick(r, 'link', 'url', 'source', 'sourceUrl')),
      favorite:     Boolean(r.favorite ?? r.isFavorite ?? false),
      wantToCook:   Boolean(r.wantToCook ?? false),
      rating:       Number(r.rating || 0),
      date:         toMillis(pick(r, 'date', 'created', 'modified')),
      thumb:        typeof r.thumb === 'string' ? r.thumb : '',

      lastCooked:   Number(r.lastCooked) || 0,
      history:      Array.isArray(r.history) ? r.history.map(Number).filter(Boolean) : [],
      extra
    };
  }

  function cryptoId() {
    return (crypto.randomUUID ? crypto.randomUUID() : 'r' + Math.random().toString(36).slice(2) + Date.now());
  }

  /* ---------- the one function the app calls ---------- */

  async function readFiles(fileList) {
    const recipes = [];
    const problems = [];

    for (const file of fileList) {
      try {
        const lower = file.name.toLowerCase();

        if (lower.endsWith('.melarecipes') || lower.endsWith('.zip')) {
          const entries = await unzip(await file.arrayBuffer());
          const decoder = new TextDecoder();
          for (const e of entries) {
            if (/(^|\/)__MACOSX\//.test(e.name) || /(^|\/)\./.test(e.name)) continue;
            if (!/\.(melarecipe|json)$/i.test(e.name)) continue;
            try {
              const base = e.name.split('/').pop().replace(/\.[^.]+$/, '');
              collect(JSON.parse(decoder.decode(e.data)), base, recipes);
            } catch (err) {
              problems.push(`${e.name}: ${err.message}`);
            }
          }
        } else {
          const base = file.name.replace(/\.[^.]+$/, '');
          collect(JSON.parse(await file.text()), base, recipes);
        }
      } catch (err) {
        problems.push(`${file.name}: ${err.message}`);
      }
    }
    return { recipes, problems };
  }

  function collect(parsed, fallbackName, into) {
    const list = Array.isArray(parsed) ? parsed
               : Array.isArray(parsed.recipes) ? parsed.recipes
               : [parsed];
    for (const r of list) {
      if (r && typeof r === 'object') into.push(normalize(r, fallbackName));
    }
  }

  /* ---------- export back out ---------- */

  function toMelaJSON(recipes) {
    return JSON.stringify(recipes.map(r => ({
      id: r.id, title: r.title, text: r.description,
      images: r.images.map(s => s.replace(/^data:[^,]+,/, '')),
      categories: r.categories, yield: r.yield,
      prepTime: r.prepTime, cookTime: r.cookTime, totalTime: r.totalTime,
      ingredients: r.ingredients.join('\n'),
      instructions: r.instructions.join('\n'),
      notes: r.notes, nutrition: r.nutrition, link: r.link,
      favorite: r.favorite, wantToCook: r.wantToCook,
      rating: r.rating, date: r.date / 1000 - APPLE_EPOCH_OFFSET,
      cooked: r.cooked, lastCooked: r.lastCooked, history: r.history, ...r.extra
    })), null, 2);
  }

  global.Mela = { readFiles, normalize, unzip, toMelaJSON, cryptoId, toMillis };

})(window);

<script>
/* ============================================================
   units.js — the arithmetic of cooking.

   Two jobs:
     splitQty()  pull the number off the front of an ingredient
                 line so quantities can sit in their own column
     scale()     multiply that number and write it back as a
                 fraction a person would actually say out loud
     findTimes() spot durations in instruction text so they can
                 become tappable timers
   ============================================================ */

(function (global) {
  'use strict';

  const VULGAR = {
    '½': 0.5, '⅓': 1/3, '⅔': 2/3, '¼': 0.25, '¾': 0.75,
    '⅕': 0.2, '⅖': 0.4, '⅗': 0.6, '⅘': 0.8,
    '⅙': 1/6, '⅚': 5/6, '⅛': 0.125, '⅜': 0.375, '⅝': 0.625, '⅞': 0.875
  };

  // fractions people recognise, in the order we prefer them
  const NICE = [
    [1/8, '⅛'], [1/4, '¼'], [1/3, '⅓'], [3/8, '⅜'], [1/2, '½'],
    [5/8, '⅝'], [2/3, '⅔'], [3/4, '¾'], [7/8, '⅞']
  ];

  /* Leading quantity: "1 1/2", "1½", "½", "2.5", "1-2", "1 to 2" */
  const QTY_RE = new RegExp(
    // an optional list marker — "2." only counts as a marker when a space
    // follows it, or "2.5 kg" would lose its 2
    '^\\s*(?:[•*]\\s*|-\\s+|\\d+\\.\\s+)?\\s*' +
    '(' +
      '\\d+\\s*[' + Object.keys(VULGAR).join('') + ']' +        // 1½
      '|\\d+\\s+\\d+\\s*/\\s*\\d+' +                            // 1 1/2
      '|\\d+\\s*/\\s*\\d+' +                                    // 1/2
      '|[' + Object.keys(VULGAR).join('') + ']' +               // ½
      '|\\d+(?:[.,]\\d+)?' +                                    // 2.5
    ')' +
    '(\\s*(?:-|–|—|to)\\s*(' +
      '\\d+\\s*[' + Object.keys(VULGAR).join('') + ']' +
      '|\\d+\\s+\\d+\\s*/\\s*\\d+' +
      '|\\d+\\s*/\\s*\\d+' +
      '|[' + Object.keys(VULGAR).join('') + ']' +
      '|\\d+(?:[.,]\\d+)?' +
    '))?' +
    '\\s*'
  );

  function toNumber(str) {
    if (!str) return null;
    let s = String(str).trim().replace(',', '.');

    // 1½  →  1 + ½
    const glued = s.match(new RegExp('^(\\d+)\\s*([' + Object.keys(VULGAR).join('') + '])$'));
    if (glued) return parseInt(glued[1], 10) + VULGAR[glued[2]];

    if (VULGAR[s] !== undefined) return VULGAR[s];

    const mixed = s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
    if (mixed) return parseInt(mixed[1], 10) + parseInt(mixed[2], 10) / parseInt(mixed[3], 10);

    const frac = s.match(/^(\d+)\s*\/\s*(\d+)$/);
    if (frac) return parseInt(frac[1], 10) / parseInt(frac[2], 10);

    const n = parseFloat(s);
    return Number.isFinite(n) ? n : null;
  }

  /* Turn 0.75 back into ¾, 1.5 into 1½, 2.37 into 2.4.
     Above 20 the fraction stops being useful — nobody measures
     666⅔ ml of wine — so round to something pourable. */
  function format(n) {
    if (n === null || !Number.isFinite(n)) return '';
    if (n === 0) return '0';

    if (n >= 20) return String(n >= 400 ? Math.round(n / 10) * 10 : Math.round(n));

    const whole = Math.floor(n + 1e-9);
    const rest = n - whole;

    if (rest < 0.02) return String(whole);

    for (const [value, glyph] of NICE) {
      if (Math.abs(rest - value) < 0.021) {
        return whole > 0 ? whole + glyph : glyph;
      }
    }
    // no tidy fraction — fall back to decimals, trimmed
    const dp = n < 10 ? 2 : n < 100 ? 1 : 0;
    return String(parseFloat(n.toFixed(dp)));
  }

  /* Split "200 g plain flour" into { qty:200, unit:"g", rest:"plain flour" } */
  function splitQty(line) {
    const text = String(line).trim();
    const m = text.match(QTY_RE);
    if (!m || !m[1]) return { qty: null, hi: null, raw: '', rest: text.replace(/^\s*(?:•|-|\*)\s*/, '') };

    return {
      qty: toNumber(m[1]),
      hi:  m[3] ? toNumber(m[3]) : null,
      raw: m[0].trim(),
      rest: text.slice(m[0].length)
    };
  }

  /* Scale a single ingredient line by a factor, keeping the text intact */
  function scaleLine(line, factor) {
    const parts = splitQty(line);
    if (parts.qty === null) return { qty: '', name: parts.rest };

    const lo = format(parts.qty * factor);
    const hi = parts.hi !== null ? format(parts.hi * factor) : null;
    return { qty: hi ? `${lo}–${hi}` : lo, name: parts.rest };
  }

  /* A line with no quantity and a trailing colon is a section heading */
  function isHeading(line) {
    const t = String(line).trim();
    if (!t) return false;
    if (/^#+\s*\S/.test(t)) return true;
    return /:$/.test(t) && t.length < 46 && splitQty(t).qty === null;
  }

  /* Mela writes section headings as "# **For the sauce:**" — a markdown
     heading wrapping a bold run. Strip all three layers, in that order,
     or the asterisks end up on screen. */
  function cleanHeading(line) {
    return String(line).trim()
      .replace(/^#+\s*/, '')
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/\*(.+?)\*/g, '$1')
      .replace(/\s*:\s*$/, '')
      .trim();
  }

  /* Servings out of a yield string: "Makes 4 servings" → 4 */
  function baseServings(yieldStr) {
    const m = String(yieldStr || '').match(/(\d+(?:[.,]\d+)?)/);
    const n = m ? parseFloat(m[1].replace(',', '.')) : NaN;
    return Number.isFinite(n) && n > 0 && n < 400 ? n : 4;
  }

  /* Durations inside instruction text, for the timer chips */
  const TIME_RE = /\b(\d+(?:[.,]\d+)?)(?:\s*(?:-|–|to)\s*(\d+(?:[.,]\d+)?))?\s*(seconds?|secs?|minutes?|mins?|hours?|hrs?)\b/gi;

  function findTimes(text) {
    const hits = [];
    let m;
    TIME_RE.lastIndex = 0;
    while ((m = TIME_RE.exec(text)) !== null) {
      // when it's a range, take the longer end — undercooking is worse
      const value = parseFloat((m[2] || m[1]).replace(',', '.'));
      const unit = m[3].toLowerCase();
      const mult = unit.startsWith('s') ? 1 : unit.startsWith('m') ? 60 : 3600;
      hits.push({ start: m.index, end: m.index + m[0].length, label: m[0], seconds: Math.round(value * mult), mult });
    }

    // "1 hour 20 minutes" arrives as two hits — join them when the gap is
    // only whitespace or "and" and the unit gets smaller, which is how
    // people write compound durations
    const out = [];
    for (const hit of hits) {
      const prev = out[out.length - 1];
      const gap = prev ? text.slice(prev.end, hit.start) : null;
      if (prev && hit.mult < prev.mult && /^(\s+|\s*,?\s*and\s+)$/i.test(gap)) {
        prev.end = hit.end;
        prev.label = text.slice(prev.start, hit.end);
        prev.seconds += hit.seconds;
        prev.mult = hit.mult;
      } else {
        out.push(hit);
      }
    }
    return out;
  }

  function clock(seconds) {
    const s = Math.max(0, Math.round(seconds));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const pad = n => String(n).padStart(2, '0');
    return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
  }

  global.Units = { toNumber, format, splitQty, scaleLine, isHeading, cleanHeading, baseServings, findTimes, clock };

})(window);

<script>
/* ============================================================
   store.js — everything stays on the device.

   IndexedDB holds the recipes (photos are base64 and get large,
   so localStorage is not an option). If IndexedDB is blocked —
   private windows, locked-down browsers — the app keeps working
   from memory for the session and says so.
   ============================================================ */

(function (global) {
  'use strict';

  /* The database keeps its original name. Renaming the app is cosmetic;
     renaming this would orphan every recipe already stored under it. */
  const DB = 'mise';
  const VERSION = 2;
  const STORES = ['recipes', 'prefs'];

  let db = null;
  let memoryOnly = false;
  let repaired = false;
  const memory = { recipes: new Map(), prefs: new Map() };

  function ensureStores(d) {
    if (!d.objectStoreNames.contains('recipes')) d.createObjectStore('recipes', { keyPath: 'id' });
    if (!d.objectStoreNames.contains('prefs')) d.createObjectStore('prefs');
  }

  const missing = d => STORES.filter(n => !d.objectStoreNames.contains(n));

  function openAt(version) {
    return new Promise((resolve, reject) => {
      let req;
      try {
        req = version ? indexedDB.open(DB, version) : indexedDB.open(DB);
      } catch (e) {
        return reject(e);
      }
      req.onupgradeneeded = () => ensureStores(req.result);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('open failed'));
      req.onblocked = () => reject(new Error('Another tab is holding the database open.'));
    });
  }

  /* Open at whatever version exists, then repair.

     A database from the short-lived restaurants build may still carry an
     empty "places" store. It is left alone rather than deleted: dropping it
     would mean another version bump for no benefit, and an unused store
     costs nothing.

     Asking for a fixed version is what broke this: a database already at
     that version is opened without an upgrade, so a store added later is
     simply absent, and the first read of it throws. Opening unversioned
     and bumping only when something is actually missing means a database
     from any past build heals itself instead of killing the app. */
  async function open() {
    if (db || memoryOnly) return;
    try {
      let d = await openAt();

      if (missing(d).length || d.version < VERSION) {
        const next = Math.max(VERSION, d.version + 1);
        d.close();
        d = await openAt(next);
        repaired = missing(d).length === 0;
      }

      if (missing(d).length) throw new Error('Could not create ' + missing(d).join(', '));

      // another tab upgrading must not leave this one holding a stale handle
      d.onversionchange = () => { try { d.close(); } catch (e) {} db = null; };
      db = d;
    } catch (e) {
      console.error('Storage unavailable, continuing in memory:', e);
      memoryOnly = true;
    }
  }

  function tx(store, mode, fn) {
    return new Promise((resolve, reject) => {
      let t;
      try {
        t = db.transaction(store, mode);
      } catch (e) {
        return reject(e);          // store missing — caller falls back
      }
      const req = fn(t.objectStore(store));
      t.oncomplete = () => resolve(req && req.result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }

    await open();
    if (memoryOnly || !db) return fallback;
    try {
      return await tx(store, mode, fn);
    } catch (e) {
      console.error(`Storage read failed on "${store}":`, e);
      return fallback;
    }
  }
