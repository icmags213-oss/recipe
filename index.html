  /* Scroll snapping does the swiping, so the dots only have to follow the
     scroll position and drive it when tapped. No drag maths, and it lands
     on the native momentum behaviour a phone user expects. */
  function bindPhotoStrip() {
    const add = $('#ph-add');
    if (add) add.addEventListener('click', () => $('#photo-file').click());

    const track = $('#ph-track');
    if (track) {
      track.querySelectorAll('img').forEach((img, i) => {
        img.addEventListener('click', () => openLightbox(state.current.images, i));
        img.style.cursor = 'zoom-in';
      });
    }
    const dots = $('#ph-dots');
    if (!track || !dots) return;

    const marks = [...dots.querySelectorAll('.ph-dot')];

    dots.addEventListener('click', e => {
      const dot = e.target.closest('.ph-dot');
      if (dot) track.scrollTo({ left: track.clientWidth * Number(dot.dataset.i), behavior: 'smooth' });
    });

    let queued = false;
    track.addEventListener('scroll', () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        const at = Math.round(track.scrollLeft / track.clientWidth);
        marks.forEach((m, i) => m.classList.toggle('on', i === at));
      });
    }, { passive: true });
  }

  function readServings() {
    const el = $('#s-read');
    if (el) el.textContent = Units.format(state.servings) + (state.servings === 1 ? ' serving' : ' servings');
  }

  function bump(dir) {
    const step = state.base <= 2 ? 0.5 : 1;
    state.servings = Math.max(step, Math.round((state.servings + dir * step) * 2) / 2);
    readServings();
    renderIngredients();
    if (!$('#cook').hidden) renderRail();
  }

  function renderIngredients() {
    const ul = $('#ing');
    if (!ul) return;
    ul.innerHTML = '';
    const f = factor();

    state.current.ingredients.forEach((line, i) => {
      const li = document.createElement('li');
      if (Units.isHeading(line)) {
        li.className = 'group';
        li.textContent = Units.cleanHeading(line);
      } else {
        const { qty, name } = Units.scaleLine(line, f);
        const inKitchen = kitchenHasIngredient(line);
        li.dataset.i = i;
        li.innerHTML = `<b class="q">${esc(qty)}</b><span class="nm">${md(esc(name))}</span>${inKitchen ? '<span class="ing-have" title="In your Kitchen" aria-label="In your Kitchen"></span>' : ''}`;
        if (state.off.has(i)) li.classList.add('off');
      }
      ul.appendChild(li);
    });
  }

  function kitchenHasIngredient(line) {
    if (!state.fridge.length) return false;
    const needed = Fridge.ingredientKey(line).words;
    if (!needed.length) return false;
    return state.fridge.some(item => {
      const owned = Fridge.ingredientKey(item.name).words;
      return owned.length > 0 && owned.every(word => needed.includes(word));
    });
  }

  function onIngToggle(e) {
    const li = e.target.closest('li[data-i]');
    if (!li) return;
    const i = Number(li.dataset.i);
    state.off.has(i) ? state.off.delete(i) : state.off.add(i);
    li.classList.toggle('off');
  }

  /* **bold** and *italic*, applied after escaping so the markup can
     never smuggle in a tag */
  function md(escaped) {
    return escaped
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  }

  function stepHTML(text) {
    const spans = Units.findTimes(text);
    if (!spans.length) return md(esc(text));
    let html = '', at = 0;
    spans.forEach(s => {
      html += md(esc(text.slice(at, s.start)));
      html += `<button type="button" class="timer-chip" data-sec="${s.seconds}" data-label="${esc(s.label)}">${esc(s.label)}</button>`;
      at = s.end;
    });
    return html + md(esc(text.slice(at)));
  }

  function renderSteps() {
    const ol = $('#steps');
    ol.innerHTML = '';
    state.current.instructions.forEach(line => {
      const li = document.createElement('li');
      if (Units.isHeading(line)) {
        li.className = 'group';
        li.textContent = Units.cleanHeading(line);
      } else {
        li.innerHTML = `<span>${stepHTML(line)}</span>`;
      }
      ol.appendChild(li);
    });
  }

  function onChip(e) {
    const chip = e.target.closest('.timer-chip');
    if (chip) startTimer(Number(chip.dataset.sec), chip.dataset.label);
  }

  async function flag(key, sel, onLabel, offLabel) {
    const r = state.current;
    r[key] = !r[key];
    if (state.collection === 'restaurants') await Store.pref('restaurants', state.restaurants);
    else await Store.putRecipes([r]);
    $(sel).textContent = r[key] ? onLabel : offLabel;
    renderSidebar();
    renderList();
  }

  async function removeCurrent() {
    const r = state.current;
    const dining = state.collection === 'restaurants';
    if (dining) {
      state.restaurants = state.restaurants.filter(x => String(x.id) !== String(r.id));
      await Store.pref('restaurants', state.restaurants);
    } else {
      await Store.deleteRecipe(r.id);
      state.recipes = state.recipes.filter(x => x.id !== r.id);
    }
    state.current = null;
    $('#sheet').hidden = true;
    $('#placeholder').hidden = false;
    document.body.dataset.pane = 'list';
    renderSidebar();
    renderList();
    toast(`Removed ${r.title}.`);
  }

  /* Photos can be attached straight from the recipe — no need to open the
     editor to drop a picture on something. */
  async function addPhotosToRecipe(files, recipe) {
    const r = recipe || state.current;
    const pics = [...files].filter(f => f.type.startsWith('image/'));
    if (!r || !pics.length) return false;

    toast(`Adding ${pics.length} photo${pics.length === 1 ? '' : 's'}…`, 30000);
    for (const file of pics) {
      try { r.images.push(await Editor.readPhoto(file)); }
      catch (e) { console.error(e); }
    }
    r.thumb = r.images[0] ? await makeThumb(r.images[0]) : '';
    await Store.putRecipes([r]);
    if (state.current === r) renderRecipe();
    renderList();
    toast(`Added to ${r.title}.`);
    return true;
  }

  /* ─────────── the photo viewer ─────────── */

  /* Recipes carry up to eleven photos and the sheet only ever shows them an
     inch wide. This is the same scroll-snap idea as the strip, full screen,
     so paging works by swipe, arrow key, dot, or the side arrows. */
  let lbAt = 0;

  function openLightbox(images, index) {
    if (!images || !images.length) return;
    const box = $('#lightbox');
    const track = $('#lb-track');
    const dots = $('#lb-dots');

    track.innerHTML = images.map(src =>
      `<div class="lb-slide"><img src="${esc(src)}" alt=""></div>`).join('');
    dots.innerHTML = images.length > 1
      ? images.map((_, i) => `<button type="button" class="lb-dot" data-i="${i}"
          aria-label="Photo ${i + 1}"></button>`).join('')
      : '';

    box.hidden = false;
    document.body.classList.add('lb-open');
    $('#lb-prev').hidden = $('#lb-next').hidden = images.length < 2;

    // jump before the first paint so it opens on the one that was tapped
    requestAnimationFrame(() => {
      track.scrollLeft = track.clientWidth * index;
      setLightbox(index, images.length);
    });

    let queued = false;
    track.onscroll = () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        setLightbox(Math.round(track.scrollLeft / track.clientWidth), images.length);
      });
    };

    dots.onclick = e => {
      const d = e.target.closest('.lb-dot');
      if (d) track.scrollTo({ left: track.clientWidth * Number(d.dataset.i), behavior: 'smooth' });
    };
  }

  function setLightbox(i, total) {
    lbAt = Math.max(0, Math.min(i, total - 1));
    $('#lb-count').textContent = total > 1 ? `${lbAt + 1} of ${total}` : '';
    $('#lb-dots').querySelectorAll('.lb-dot')
      .forEach((d, n) => d.classList.toggle('on', n === lbAt));
  }

  function lightboxStep(dir) {
    const track = $('#lb-track');
    const total = track.children.length;
    const to = Math.max(0, Math.min(lbAt + dir, total - 1));
    track.scrollTo({ left: track.clientWidth * to, behavior: 'smooth' });
  }

  function closeLightbox() {
    $('#lightbox').hidden = true;
    $('#lb-track').innerHTML = '';
    document.body.classList.remove('lb-open');
  }

  /* ─────────── cook mode ─────────── */

  const cookSteps = () => state.current.instructions.filter(l => !Units.isHeading(l));

  function openCook() {
    state.step = 0;
    $('#cook').hidden = false;
    $('#cook-title').textContent = state.current.title;
    renderRail();
    renderCookStep();
  }

  function closeCook() { $('#cook').hidden = true; }

  function renderRail() {
    const f = factor();
    const items = state.current.ingredients
      .map((line, i) => ({ line, i }))
      .filter(x => !Units.isHeading(x.line));

    $('#cook-rail').innerHTML =
      `<h3>Ingredients · ${Units.format(state.servings)} servings</h3><ul>` +
      items.map(({ line, i }) => {
        const { qty, name } = Units.scaleLine(line, f);
        return `<li data-i="${i}" class="${state.off.has(i) ? 'off' : ''}">
          <span class="q">${esc(qty)}</span><span class="n">${esc(name)}</span></li>`;
      }).join('') + '</ul>';
  }

  function onRailToggle(e) {
    const li = e.target.closest('li[data-i]');
    if (!li) return;
    const i = Number(li.dataset.i);
    state.off.has(i) ? state.off.delete(i) : state.off.add(i);
    li.classList.toggle('off');
    renderIngredients();
  }

  function renderCookStep() {
    const steps = cookSteps();
    const total = steps.length;
    const i = Math.min(state.step, Math.max(0, total - 1));

    $('#cook-step').innerHTML = total ? stepHTML(steps[i]) : 'This recipe has no written method.';
    $('#cook-count').textContent = total ? `${i + 1} / ${total}` : '';
    $('#cook-prev').disabled = i === 0;
    $('#cook-next').textContent = i >= total - 1 ? 'Finish' : 'Next';
  }

  async function cookMove(dir) {
    const total = cookSteps().length;
    const next = state.step + dir;
    if (next >= total) {
      // walked off the end of the method — that is a cook
      const r = state.current;
      closeCook();
      if (r) {
        await markCooked(r);
        renderList();
        if (state.page === 'recipe' && state.current === r) renderRecipe();
        toast(`Cooked ${r.title}.`, 3200);
      }
      return;
    }
    state.step = Math.max(0, next);
    renderCookStep();
  }

  /* ─────────── discover ─────────── */

  async function saveSwipe() { await Store.pref('swipe', state.swipe); }

  const progress = () => state.swipe;
  const itemsOf = id => state.recipes.find(x => x.id === id);

  /* A recipe stays in the deck while at least one of its categories is
     still ticked. Requiring every category to be ticked would hide a
     Desserts recipe just because it is also tagged Halloween, which is
     not what unticking Halloween is meant to mean. */
  function inDeck(r) {
    if (!r.categories.length) return !state.swipe.noUncategorized;
    const off = new Set(state.swipe.excluded);
    return r.categories.some(c => !off.has(c));
  }

  const deckPool = () => state.recipes.filter(inDeck);

  const likedItems = () => progress().liked.map(itemsOf).filter(Boolean);

  function renderDiscover() {
    state.current = null;
    $('#placeholder').hidden = true;
    const sheet = $('#sheet');
    sheet.hidden = false;
    sheet.dataset.mode = 'plain';
    closeDayPicker();

    if (state.swipeView === 'picks') return renderPicks(sheet);
    if (state.swipeView === 'filters') return renderFilters(sheet);
    if (state.swipeView === 'home') return renderDiscoverHome(sheet);
    if (state.swipeView === 'restaurants') return renderRestaurantDeck();
    if (state.swipeView === 'restaurantPicks') return renderRestaurantPicks();

    const pool = deckPool();
    const queue = Swipe.remaining(pool, progress().seen, state.seed);
    const liked = progress().liked.length;
    const total = pool.length;
    const seen = total - queue.length;
    const filtered = state.recipes.length - total;

    // this asks whether the library is empty, not whether the filter
    // emptied the deck — using the filtered count here strands you on a
    // dead-end page with no way back to the category switches
    if (!state.recipes.length) {
      sheet.innerHTML = `<div class="plain-wrap"><h1 class="r-title">Discover</h1>
        <p class="r-note">Import or write some recipes first.</p></div>`;
      return;
    }

    if (!queue.length) {
      sheet.innerHTML = `<div class="plain-wrap">
        <h1 class="r-title">${total ? "That's everything" : 'Nothing in the deck'}</h1>
        <p class="r-note">${total
          ? `You've been through all ${total} recipes and kept ${liked}.`
          : `Everything is switched off. Turn some back on to start swiping.`}
          ${filtered ? `<br>${filtered} recipe${filtered === 1 ? ' is' : 's are'} filtered out.` : ''}</p>
        <div class="r-tools">
          <button class="tool" id="d-home"><span class="ico" data-ico="archive"></span>Discover home</button>
          <button class="tool" id="d-filters"><span class="ico" data-ico="sliders"></span>Categories</button>
          <button class="tool" id="d-picks"><span class="ico" data-ico="heartfill"></span>See your picks (${liked})</button>
          <button class="tool" id="d-reset"><span class="ico" data-ico="close"></span>Start over</button>
        </div></div>`;
      $('#d-home').addEventListener('click', () => { state.swipeView = 'home'; renderDiscover(); });
      $('#d-filters').addEventListener('click', () => { state.swipeView = 'filters'; renderDiscover(); });
      $('#d-picks').addEventListener('click', () => { state.swipeView = 'picks'; renderDiscover(); });
      $('#d-reset').addEventListener('click', resetSwipe);
      Icons.paint(sheet);
      return;
    }

    // only the top two cards exist in the DOM; the rest is just a count
    const top = queue[0], next = queue[1];

    sheet.innerHTML = `<div class="plain-wrap discover">
      <div class="d-head">
        <h1 class="r-title">Discover</h1>
        <span class="d-count">${seen} of ${total} · ${liked} kept</span>
        <button class="d-gear" id="d-filters" aria-label="Choose categories">
          <span class="ico" data-ico="sliders"></span>${filtered ? `<span class="d-dot"></span>` : ''}
        </button>
      </div>

      <div class="deck" id="deck">
        ${next ? cardHTML(next, true) : ''}
        ${cardHTML(top, false)}
      </div>

      <div class="d-actions">
        <button class="d-btn pass" id="d-pass" aria-label="Pass">&times;</button>
        <button class="d-btn open" id="d-open">View recipe</button>
        <button class="d-btn keep" id="d-keep" aria-label="Keep"><span class="ico" data-ico="heartfill"></span></button>
      </div>

      <div class="d-foot">
        <button class="linky" id="d-home">Discover home</button>
        <button class="linky" id="d-picks">See your picks (${liked})</button>
        <button class="linky" id="d-reset">Start over</button>
      </div>
    </div>`;

    bindTopCard($('#deck .swipe-card:last-child'), top);

    // the controls stay bound across advances; they act on whatever card
    // is currently on top
    $('#d-pass').addEventListener('click', () => deckHandle && deckHandle.fling('left'));
    $('#d-keep').addEventListener('click', () => deckHandle && deckHandle.fling('right'));
    $('#d-open').addEventListener('click', () => deckTop && openRecipe(deckTop.id));
    $('#d-home').addEventListener('click', () => { state.swipeView = 'home'; renderDiscover(); });
    $('#d-picks').addEventListener('click', () => { state.swipeView = 'picks'; renderDiscover(); });
    $('#d-reset').addEventListener('click', resetSwipe);
    $('#d-filters').addEventListener('click', () => { state.swipeView = 'filters'; renderDiscover(); });
    Icons.paint(sheet);
  }

  function renderDiscoverHome(sheet) {
    clearInterval(homeHeroTimer);
    if (!state.recipes.length) {
      sheet.innerHTML = `<div class="plain-wrap home-discover"><div class="home-welcome">
        <span class="home-kicker">Your personal cookbook</span>
        <h1>What shall we cook?</h1>
        <p>Import or write your first recipe and this page will become your daily kitchen overview.</p>
      </div></div>`;
      return;
    }

    const photoOf = r => r.images[0] || r.thumb || '';
    const catCounts = new Map();
    state.recipes.forEach(r => r.categories.forEach(c => catCounts.set(c, (catCounts.get(c) || 0) + 1)));
    const filterRecipe = r => state.heroFilter === 'all' || state.heroFilter === 'recent'
      || (state.heroFilter === 'fav' && r.favorite)
      || (state.heroFilter === 'want' && r.wantToCook);
    const eligible = state.recipes.filter(filterRecipe);
    const heroRecipes = state.heroFilter === 'recent'
      ? [...state.recipes].sort((a, b) => b.date - a.date).slice(0, 12)
      : (eligible.length ? eligible : state.recipes);
    const matches = Fridge.matchRecipes(state.fridge, state.recipes,
      { assumeStaples: state.fridgeStaples });
    const matched = matches.find(m => !m.missing.length && heroRecipes.some(r => r.id === m.recipe.id))
      || matches.find(m => heroRecipes.some(r => r.id === m.recipe.id));
    const featured = matched ? matched.recipe : (heroRecipes.find(photoOf) || heroRecipes[0]);
    const dailyKey = Plan.key(new Date());
    const dailyScore = r => {
      const text = dailyKey + ':' + r.id;
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) hash = Math.imul(hash ^ text.charCodeAt(i), 16777619);
      return hash >>> 0;
    };
    const dailyPool = heroRecipes.filter(r => r.id !== featured.id && photoOf(r));
    const dailyFour = state.heroFilter === 'recent'
      ? heroRecipes.slice(0, 4)
      : [featured, ...dailyPool.sort((a, b) => dailyScore(a) - dailyScore(b))].slice(0, 4);
    const recent = [...state.recipes].reverse().filter(r => r.id !== featured.id).slice(0, 4);
    const urgent = state.fridge.filter(Fridge.isUrgent)
      .sort((a, b) => Fridge.daysLeft(a) - Fridge.daysLeft(b)).slice(0, 5);
    const today = Plan.key(new Date());
    const planned = Object.keys(state.plan).filter(k => k >= today).sort().flatMap(k =>
      (state.plan[k] || []).map(id => ({ key: k, recipe: itemsOf(id) })).filter(x => x.recipe)
    ).slice(0, 4);
    const collections = [...catCounts].sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 6);
    const filterName = state.heroFilter === 'recent' ? 'Most Recent'
      : state.heroFilter === 'fav' ? 'Favorites'
      : state.heroFilter === 'want' ? 'Want to Cook'
      : 'All recipes';
    const favoriteCount = state.recipes.filter(r => r.favorite).length;
    const wantCount = state.recipes.filter(r => r.wantToCook).length;
    const filterOptions = [
      ['all', 'All recipes', state.recipes.length],
      ['recent', 'Most Recent', Math.min(4, state.recipes.length)],
      ['want', 'Want to Cook', wantCount],
      ['fav', 'Favorites', favoriteCount]
    ];

    const mini = r => `<button type="button" class="home-mini" data-home-recipe="${esc(r.id)}">
      ${photoOf(r) ? `<img src="${esc(photoOf(r))}" alt="">` : '<span class="home-mini-blank"></span>'}
      <span><strong>${esc(r.title)}</strong><small>${esc((r.categories || []).slice(0,2).join(' · ') || r.totalTime || 'Recipe')}</small></span>
    </button>`;

    sheet.innerHTML = `<div class="plain-wrap home-discover">
      <header class="home-top">
        <div><span class="home-kicker">Your personal cookbook</span><h1>What shall we cook?</h1></div>
      </header>

      <section class="home-hero" id="home-hero" aria-label="Four recipes for today">
        <details class="home-hero-filter" id="home-hero-filter">
          <summary><span class="ico" data-ico="adjust"></span>${esc(filterName)}</summary>
          <div class="home-filter-menu">${filterOptions.map(([value, label, count]) => `<button type="button" class="${state.heroFilter === value ? 'on' : ''}" data-hero-filter="${esc(value)}"${count === 0 ? ' disabled' : ''}><span>${esc(label)}</span><small>${count}</small></button>`).join('')}</div>
        </details>
        ${dailyFour.map((recipe, index) => `<article class="home-slide${index === 0 ? ' on' : ''}" data-hero-slide="${index}" aria-hidden="${index !== 0}">
          ${photoOf(recipe) ? `<img src="${esc(photoOf(recipe))}" alt="">` : '<span class="home-hero-blank"></span>'}
          <div class="home-hero-shade"></div>
          <div class="home-hero-copy">
            <span class="home-kicker light">Today’s pick ${index + 1} of ${dailyFour.length}</span>
            <h2 class="${recipe.title.length > 64 ? 'very-long' : recipe.title.length > 38 ? 'long' : ''}">${esc(recipe.title)}</h2>
            <p>${esc((recipe.categories || []).slice(0,3).join(' · ') || recipe.totalTime || recipe.cookTime || 'From your recipe box')}</p>
            <button type="button" class="btn home-open" data-home-recipe="${esc(recipe.id)}">Open recipe</button>
          </div>
        </article>`).join('')}
        ${dailyFour.length > 1 ? `<div class="home-slide-controls">
          <button type="button" class="home-slide-arrow" id="hero-prev" aria-label="Previous recipe">&#8249;</button>
          <div class="home-slide-dots">${dailyFour.map((_, i) => `<button type="button" class="home-slide-dot${i === 0 ? ' on' : ''}" data-hero-dot="${i}" aria-label="Show recipe ${i + 1}"></button>`).join('')}</div>
          <button type="button" class="home-slide-arrow" id="hero-next" aria-label="Next recipe">&#8250;</button>
        </div>` : ''}
      </section>

      <nav class="home-browse-grid" aria-label="Browse your saved places">
        <button type="button" class="home-browse-card" id="home-browse-recipes">
          <span class="home-browse-card-icon"><span class="ico" data-ico="cards"></span></span>
          <span class="home-browse-card-copy"><span><strong>Browse recipes</strong><small>${state.recipes.length} saved recipes</small></span><span class="home-browse-card-arrow">→</span></span>
        </button>
        <button type="button" class="home-browse-card" id="home-browse-restaurants">
          <span class="home-browse-card-icon"><span class="ico" data-ico="diningOut"></span></span>
          <span class="home-browse-card-copy"><span><strong>Browse restaurants</strong><small>${state.restaurants.length} saved restaurant${state.restaurants.length === 1 ? '' : 's'}</small></span><span class="home-browse-card-arrow">→</span></span>
        </button>
      </nav>
    </div>`;

    sheet.querySelectorAll('[data-home-recipe]').forEach(b => b.addEventListener('click', () => openRecipe(b.dataset.homeRecipe)));
    sheet.querySelectorAll('[data-home-cat]').forEach(b => b.addEventListener('click', () => {
      state.collection = 'cat:' + b.dataset.homeCat; select('recipe'); renderList();
    }));
    $('#home-browse-recipes').addEventListener('click', () => { state.swipeView = 'deck'; renderDiscover(); });
    $('#home-browse-restaurants').addEventListener('click', () => {
      state.swipeView = 'restaurants';
      renderRestaurantDeck();
    });
    sheet.querySelectorAll('[data-hero-filter]').forEach(button => button.addEventListener('click', async () => {
      state.heroFilter = button.dataset.heroFilter;
      await Store.pref('heroFilter', state.heroFilter);
      renderDiscoverHome(sheet);
    }));
    bindHomeHero(dailyFour.length);
    Icons.paint(sheet);
  }

  let homeHeroTimer = 0;
  function bindHomeHero(count) {
    if (count < 2 || !$('#home-hero')) return;
    let at = 0;
    const show = next => {
      at = (next + count) % count;
      document.querySelectorAll('[data-hero-slide]').forEach((slide, i) => {
        slide.classList.toggle('on', i === at);
        slide.setAttribute('aria-hidden', String(i !== at));
      });
      document.querySelectorAll('[data-hero-dot]').forEach((dot, i) => dot.classList.toggle('on', i === at));
    };
    const restart = () => {
      clearInterval(homeHeroTimer);
      homeHeroTimer = setInterval(() => {
        if ($('#home-hero')) show(at + 1); else clearInterval(homeHeroTimer);
      }, 6500);
    };
    $('#hero-prev').addEventListener('click', () => { show(at - 1); restart(); });
    $('#hero-next').addEventListener('click', () => { show(at + 1); restart(); });
    document.querySelectorAll('[data-hero-dot]').forEach(dot => dot.addEventListener('click', () => {
      show(Number(dot.dataset.heroDot)); restart();
    }));
    restart();
  }

  function cardHTML(r, behind, entering) {
    const photo = r.images[0] || r.thumb;
    const bits = [];
    if (r.categories.length) bits.push(esc(r.categories.join(', ')));
    if (r.totalTime) bits.push(esc(r.totalTime));
    else if (r.cookTime) bits.push(esc(r.cookTime));

    return `<article class="swipe-card${behind ? ' behind' : ''}${entering ? ' enter' : ''}">
      ${photo ? `<img src="${esc(photo)}" alt="" draggable="false">` : '<span class="swipe-blank"></span>'}
      <div class="swipe-meta">
        <h2>${esc(r.title)}</h2>
        ${bits.length ? `<p>${bits.join(' · ')}</p>` : ''}
      </div>
      <span class="d-badge" style="opacity:0"></span>
    </article>`;
  }

  let restaurantDeckHandle = null;
  let restaurantDeckTop = null;

  function restaurantCardHTML(restaurant, behind) {
    const images = Array.isArray(restaurant && restaurant.images) ? restaurant.images : [];
    const photo = images[0] || restaurant.thumb || '';
    const dishes = Array.isArray(restaurant.ingredients) ? restaurant.ingredients.slice(0, 3) : [];
    const details = [restaurantState(restaurant), ...dishes].filter(Boolean);
    return `<article class="swipe-card${behind ? ' behind' : ''}">
      ${photo ? `<img src="${esc(photo)}" alt="" draggable="false">` : `<span class="swipe-blank restaurant-swipe-blank"><b>${esc((restaurant.title || 'R').trim().charAt(0).toUpperCase() || 'R')}</b></span>`}
      <div class="swipe-meta"><span class="home-kicker light">Dining Out</span>
        <h2>${esc(restaurant.title || 'Unnamed restaurant')}</h2>
        ${details.length ? `<p>${esc(details.join(' · '))}</p>` : ''}
      </div>
      <span class="d-badge" style="opacity:0"></span>
    </article>`;
  }

  function renderRestaurantDeck() {
    state.current = null;
    state.page = 'discover';
    $('#placeholder').hidden = true;
    const sheet = $('#sheet');
    sheet.hidden = false;
    sheet.dataset.mode = 'plain';
    closeDayPicker();
    const allRestaurants = Array.isArray(state.restaurants)
      ? state.restaurants.filter(item => item && item.id != null && String(item.title || '').trim())
      : [];
    const states = [...new Set(allRestaurants.map(restaurantState).filter(name => name && name !== 'State not added'))].sort((a, b) => a.localeCompare(b));
    if (state.restaurantStateFilter !== 'all' && !states.includes(state.restaurantStateFilter)) state.restaurantStateFilter = 'all';
    const pool = state.restaurantStateFilter === 'all' ? allRestaurants : allRestaurants.filter(item => restaurantState(item) === state.restaurantStateFilter);
    const stateOptions = `<select class="restaurant-state-filter" id="restaurant-state-filter" aria-label="Filter restaurants by state"><option value="all">All states</option>${states.map(name => `<option value="${esc(name)}" ${state.restaurantStateFilter === name ? 'selected' : ''}>${esc(name)}</option>`).join('')}</select>`;
    if (!pool.length) {
      sheet.innerHTML = `<div class="plain-wrap discover"><div class="d-head"><h1 class="r-title">Restaurants</h1>${allRestaurants.length ? stateOptions : ''}</div>
        <p class="r-note">${allRestaurants.length ? 'No restaurants are saved in this state yet.' : 'Add a restaurant in Dining Out and it will appear here.'}</p>
        <div class="d-foot"><button class="linky" id="restaurant-deck-home">Discover home</button><button class="linky" id="restaurant-picks">See your picks (${allRestaurants.filter(item => item.favorite).length})</button><button class="linky" id="restaurant-reset">Start over</button></div></div>`;
      $('#restaurant-picks').addEventListener('click', () => { state.swipeView = 'restaurantPicks'; renderDiscover(); });
      $('#restaurant-deck-home').addEventListener('click', () => { state.swipeView = 'home'; renderDiscover(); });
      $('#restaurant-reset').addEventListener('click', () => { state.restaurantDeckIndex = 0; state.restaurantStateFilter = 'all'; renderRestaurantDeck(); });
      if ($('#restaurant-state-filter')) $('#restaurant-state-filter').addEventListener('change', event => { state.restaurantStateFilter = event.target.value; state.restaurantDeckIndex = 0; renderRestaurantDeck(); });
      Icons.paint(sheet);
      return;
    }
    state.restaurantDeckIndex = ((state.restaurantDeckIndex || 0) % pool.length + pool.length) % pool.length;
    const top = pool[state.restaurantDeckIndex];
    const next = pool.length > 1 ? pool[(state.restaurantDeckIndex + 1) % pool.length] : null;
    restaurantDeckTop = top;
    sheet.innerHTML = `<div class="plain-wrap discover">
      <div class="d-head"><h1 class="r-title">Restaurants</h1><span class="d-count">${state.restaurantDeckIndex + 1} of ${pool.length}</span>${stateOptions}</div>
      <div class="deck" id="restaurant-deck">${next ? restaurantCardHTML(next, true) : ''}${restaurantCardHTML(top, false)}</div>
      <div class="d-actions">
        <button class="d-btn pass" id="restaurant-pass" aria-label="Pass">&times;</button>
        <button class="d-btn open" id="restaurant-view">View restaurant</button>
        <button class="d-btn keep" id="restaurant-save" aria-label="Save restaurant"><span class="ico" data-ico="heartfill"></span></button>
      </div>
      <div class="d-foot"><button class="linky" id="restaurant-deck-home">Discover home</button><button class="linky" id="restaurant-picks">See your picks (${allRestaurants.filter(item => item.favorite).length})</button><button class="linky" id="restaurant-reset">Start over</button></div>
    </div>`;
    const card = $('#restaurant-deck .swipe-card:last-child');
    const badge = card.querySelector('.d-badge');
    restaurantDeckHandle = Swipe.bindCard(card, {
      onDrag: amount => {
        badge.textContent = amount > 0 ? 'SAVE' : 'PASS';
        badge.className = 'd-badge ' + (amount > 0 ? 'keep' : 'pass');
        badge.style.opacity = Math.abs(amount);
      },
      onDecide: async direction => {
        if (direction === 'right' && !top.favorite) {
          top.favorite = true;
          await Store.pref('restaurants', state.restaurants);
        }
        state.restaurantDeckIndex = (state.restaurantDeckIndex + 1) % pool.length;
        renderRestaurantDeck();
      }
    });
    $('#restaurant-pass').addEventListener('click', () => restaurantDeckHandle && restaurantDeckHandle.fling('left'));
    $('#restaurant-save').addEventListener('click', () => restaurantDeckHandle && restaurantDeckHandle.fling('right'));
    $('#restaurant-view').addEventListener('click', () => restaurantDeckTop && openRestaurant(restaurantDeckTop.id));
    $('#restaurant-picks').addEventListener('click', () => { state.swipeView = 'restaurantPicks'; renderDiscover(); });
    $('#restaurant-deck-home').addEventListener('click', () => { state.swipeView = 'home'; renderDiscover(); });
    $('#restaurant-reset').addEventListener('click', () => { state.restaurantDeckIndex = 0; state.restaurantStateFilter = 'all'; renderRestaurantDeck(); });
    $('#restaurant-state-filter').addEventListener('change', event => { state.restaurantStateFilter = event.target.value; state.restaurantDeckIndex = 0; renderRestaurantDeck(); });
    Icons.paint(sheet);
  }

  function renderRestaurantPicks() {
    state.current = null;
    state.page = 'discover';
    $('#placeholder').hidden = true;
    const sheet = $('#sheet');
    sheet.hidden = false;
    sheet.dataset.mode = 'plain';

    const picks = (Array.isArray(state.restaurants) ? state.restaurants : [])

    sheet.innerHTML = `<div class="plain-wrap">
      <div class="d-head"><h1 class="r-title">My Restaurant Picks</h1><span class="d-count">${picks.length} saved</span></div>

      ${picks.length ? `<ul class="picks">${picks.map(restaurant => {
        const images = Array.isArray(restaurant.images) ? restaurant.images : [];

        return `<li class="pick" data-id="${esc(restaurant.id)}">

            <span class="pick-body"><span class="pick-title">${esc(restaurant.title)}</span>

        </li>`;
      }).join('')}</ul>` : '<p class="r-note">No restaurant picks yet. Save one with the heart while browsing restaurants.</p>'}
    </div>`;

    $('#restaurant-picks-back').addEventListener('click', () => { state.swipeView = 'restaurants'; renderDiscover(); });
    sheet.querySelectorAll('.pick').forEach(row => {

      if (!restaurant) return;
      row.querySelector('.pick-open').addEventListener('click', () => openRestaurant(restaurant.id));
      row.querySelector('.restaurant-pick-plan').addEventListener('click', () => openDayPicker(restaurant, row.querySelector('.pick-actions'), () => renderRestaurantPicks()));
      row.querySelector('.pick-x').addEventListener('click', async () => {

  let deckHandle = null;
  let deckTop = null;

  function bindTopCard(card, recipe) {
    deckTop = recipe;
    const badge = card.querySelector('.d-badge');

    deckHandle = Swipe.bindCard(card, {
      onDrag: t => {
        badge.textContent = t > 0 ? 'KEEP' : 'PASS';
        badge.className = 'd-badge ' + (t > 0 ? 'keep' : 'pass');
        badge.style.opacity = Math.abs(t);
      },
      // start the card underneath growing while this one is still leaving
      onCommit: () => promoteNext(),
      onDecide: dir => decide(recipe, dir)
    });
  }

  /* Bring the card behind forward and slide a fresh one in underneath.
     Nothing is rebuilt, so the promoted card animates from the size it
     already had rather than appearing at full size. */
  function promoteNext() {
    const deck = $('#deck');
    if (!deck) return;

    const behind = deck.querySelector('.swipe-card.behind');
    if (behind) behind.classList.remove('behind');

    // the one after next, if there is one
    const queue = Swipe.remaining(deckPool(), progress().seen, state.seed);
    const upcoming = queue[2];
    if (!upcoming) return;

    deck.insertAdjacentHTML('afterbegin', cardHTML(upcoming, true, true));
    const fresh = deck.firstElementChild;
    // two frames: one to commit the entering styles, one to transition off them
    requestAnimationFrame(() => requestAnimationFrame(() => fresh.classList.remove('enter')));
  }

  async function decide(recipe, dir) {
    if (!progress().seen.includes(recipe.id)) progress().seen.push(recipe.id);
    if (dir === 'right' && !progress().liked.includes(recipe.id)) {
      progress().liked.push(recipe.id);
    }
    await saveSwipe();
    advanceDeck();
  }

  function advanceDeck() {
    const deck = $('#deck');
    const pool = deckPool();
    const queue = Swipe.remaining(pool, progress().seen, state.seed);

    // out of cards, or the view moved on — fall back to a full render
    if (!deck || !queue.length || state.page !== 'discover' || state.swipeView !== 'deck') {
      return renderDiscover();
    }

    // drop the card that was thrown; promoteNext already moved the rest up
    const cards = [...deck.querySelectorAll('.swipe-card')];
    const flung = cards[cards.length - 1];
    const front = cards[cards.length - 2];
    if (flung) flung.remove();

    if (front) {
      front.classList.remove('behind');
      bindTopCard(front, queue[0]);
    } else {
      deck.insertAdjacentHTML('beforeend', cardHTML(queue[0], false));
      bindTopCard(deck.lastElementChild, queue[0]);
    }

    const seen = pool.length - queue.length;
    const count = $('.d-count');
    if (count) count.textContent = `${seen} of ${pool.length} · ${progress().liked.length} kept`;
    const picks = $('#d-picks');
    if (picks) picks.textContent = `See your picks (${progress().liked.length})`;
  }

  async function resetSwipe() {
    // the category choices are a preference, not progress — keep them
    state.swipe.seen = [];
    state.swipe.liked = [];
    state.seed = Math.floor(Math.random() * 1e6);
    await Store.pref('seed', state.seed);
    await saveSwipe();
    state.swipeView = 'deck';
    renderDiscover();
  }

  /* The category switchboard. Counts update live as you tick, without
     re-rendering the list, so a checkbox never loses focus mid-click. */
  function renderFilters(sheet) {
    const cats = categoryNames();
    const uncat = state.recipes.filter(r => !r.categories.length).length;
    const off = new Set(state.swipe.excluded);

    const countFor = name => state.recipes.filter(r => r.categories.includes(name)).length;

    sheet.innerHTML = `<div class="plain-wrap">
      <div class="d-head">
        <h1 class="r-title">Categories</h1>
        <span class="d-count" id="df-count"></span>
      </div>

      <div class="r-tools">
        <button class="tool" id="df-done"><span class="ico" data-ico="cards"></span>Back to swiping</button>
        <button class="tool" id="df-all"><span class="ico" data-ico="check"></span>Turn all on</button>
        <button class="tool" id="df-none"><span class="ico" data-ico="close"></span>Turn all off</button>
      </div>

      <p class="df-note">A recipe stays in the deck while at least one of its
      categories is on, so something tagged both Halloween and Desserts survives
      turning Halloween off.</p>

      <ul class="df-list">
        ${cats.map(name => `<li>
          <label class="df-row">
            <input type="checkbox" data-cat="${esc(name)}" ${off.has(name) ? '' : 'checked'}>
            <span class="df-name">${esc(name)}</span>
            <span class="df-n">${countFor(name)}</span>
          </label></li>`).join('')}
        ${uncat ? `<li>
          <label class="df-row">
            <input type="checkbox" data-uncat="1" ${state.swipe.noUncategorized ? '' : 'checked'}>
            <span class="df-name df-dim">Uncategorized</span>
            <span class="df-n">${uncat}</span>
          </label></li>` : ''}
      </ul>
    </div>`;

    const refresh = () => {
      const n = deckPool().length;
      const all = state.recipes.length;
      $('#df-count').textContent = n === all ? `all ${all} recipes` : `${n} of ${all} recipes`;
    };

    sheet.querySelectorAll('.df-row input').forEach(box => {
      box.addEventListener('change', async () => {
        if (box.dataset.uncat) {
          state.swipe.noUncategorized = !box.checked;
        } else {
          const name = box.dataset.cat;
          const set = new Set(state.swipe.excluded);
          box.checked ? set.delete(name) : set.add(name);
          state.swipe.excluded = [...set];
        }
        refresh();
        await saveSwipe();
      });
    });

    const setAll = async on => {
      state.swipe.excluded = on ? [] : categoryNames();
      state.swipe.noUncategorized = !on;
      sheet.querySelectorAll('.df-row input').forEach(b => { b.checked = on; });
      refresh();
      await saveSwipe();
    };

    $('#df-all').addEventListener('click', () => setAll(true));
    $('#df-none').addEventListener('click', () => setAll(false));
    $('#df-done').addEventListener('click', () => { state.swipeView = 'deck'; renderDiscover(); });

    refresh();
    Icons.paint(sheet);
  }

  /* The point of the whole exercise: what you kept, and a day for each. */
  function renderPicks(sheet) {
    const picks = likedItems();

    sheet.innerHTML = `<div class="plain-wrap">
      <div class="d-head">
        <h1 class="r-title">Your picks</h1>
        <span class="d-count">${picks.length} kept</span>
      </div>

      <div class="r-tools">
        <button class="tool" id="p-back"><span class="ico" data-ico="cards"></span>Keep swiping</button>

      </div>

      ${picks.length
        ? `<ul class="picks">${picks.map(r => {
            const days = Object.keys(state.plan).filter(k => state.plan[k].includes(r.id)).sort();
            const when = days.length
              ? days.map(k => Plan.relative(Plan.fromKey(k))).join(', ')
              : '';
            const title = r.title;
            const sub = r.categories.join(', ');
            const art = (r.thumb || r.images[0])
              ? `<img src="${esc(r.thumb || r.images[0])}" alt="">`
              : '<span class="pick-blank"></span>';

            return `<li class="pick" data-id="${esc(r.id)}">
              <button type="button" class="pick-open">
                ${art}
                <span class="pick-body">
                  <span class="pick-title">${esc(title)}</span>
                  ${sub ? `<span class="pick-cats">${esc(sub)}</span>` : ''}
                  ${when ? `<span class="pick-when">Planned ${esc(when)}</span>` : ''}
                </span>
              </button>
              <span class="pick-actions">
                <button type="button" class="btn quiet pick-plan">${when ? 'Change day' : 'Add to a day'}</button>
                <button type="button" class="pick-x" aria-label="Remove from picks">&times;</button>
              </span>
            </li>`;
          }).join('')}</ul>`
        : `<p class="r-note">Nothing kept yet. Swipe right on something you fancy.</p>`}
    </div>`;

    $('#p-back').addEventListener('click', () => { state.swipeView = 'deck'; renderDiscover(); });
    const clear = $('#p-clear');
    if (clear) clear.addEventListener('click', async () => {
      progress().liked = [];
      await saveSwipe();
      renderDiscover();
    });

    sheet.querySelectorAll('.pick').forEach(li => {
      const r = itemsOf(li.dataset.id);
      li.querySelector('.pick-open').addEventListener('click', () => openRecipe(r.id));
      li.querySelector('.pick-plan').addEventListener('click', e => {
        e.stopPropagation();
        openDayPicker(r, li.querySelector('.pick-actions'), () => renderDiscover());
      });
      li.querySelector('.pick-x').addEventListener('click', async () => {
        progress().liked = progress().liked.filter(id => id !== r.id);
        await saveSwipe();
        renderDiscover();
      });
    });

    Icons.paint(sheet);
  }

  /* ─────────── calendar ─────────── */

  async function savePlan() { await Store.pref('plan', state.plan); }

  function plannedOn(k) {
    return (state.plan[k] || [])
      .map(id => state.recipes.find(r => String(r.id) === String(id))
        || state.restaurants.find(r => String(r.id) === String(id)))
      .filter(Boolean);        // a deleted item just drops out
  }

  async function addToDay(recipeId, dateKey) {
    const day = state.plan[dateKey] || (state.plan[dateKey] = []);
    if (!day.includes(recipeId)) day.push(recipeId);
    await savePlan();
  }

  async function removeFromDay(recipeId, dateKey) {
    state.plan[dateKey] = (state.plan[dateKey] || []).filter(id => id !== recipeId);
    if (!state.plan[dateKey].length) delete state.plan[dateKey];
    if (state.planPeriods[dateKey]) {
      delete state.planPeriods[dateKey][recipeId];
      if (!Object.keys(state.planPeriods[dateKey]).length) delete state.planPeriods[dateKey];
      await Store.pref('planPeriods', state.planPeriods);
    }
    await savePlan();
  }

  function planPeriod(dateKey, recipeId) {
    return (state.planPeriods[dateKey] || {})[recipeId] || '';
  }

  async function setPlanPeriod(dateKey, recipeId, period) {
    const day = state.planPeriods[dateKey] || (state.planPeriods[dateKey] = {});
    day[recipeId] = period;
    await Store.pref('planPeriods', state.planPeriods);
  }

  function openDayPicker(recipe, anchor, after) {
    closeDayPicker();
    const pop = document.createElement('div');
    pop.className = 'daypick';
    const dining = state.restaurants.some(item => String(item.id) === String(recipe.id));
    pop.innerHTML = `<h3>${dining ? 'Visit on…' : 'Cook this on…'}</h3><ul></ul>`;
    const ul = pop.querySelector('ul');

    Plan.upcoming(14).forEach(d => {
      const k = Plan.key(d);
      const on = (state.plan[k] || []).includes(recipe.id);
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.className = on ? 'on' : '';
      b.innerHTML = `<span>${esc(Plan.relative(d))}</span>
        <span class="dp-date">${esc(Plan.label(d))}</span>
        <span class="dp-mark">${on ? '✓' : '+'}</span>`;
      b.addEventListener('click', async () => {
        if (on) await removeFromDay(recipe.id, k); else await addToDay(recipe.id, k);
        closeDayPicker();
        toast(on ? `Removed from ${Plan.relative(d)}.` : `${recipe.title} on ${Plan.relative(d)}.`);
        if (after) after(!on, k);
      });
      li.appendChild(b);
      ul.appendChild(li);
    });

    const host = anchor || $('#a-plan');
    host.parentNode.appendChild(pop);
    pop.dataset.anchor = host.id || 'anchor';
    lastAnchor = host;
    setTimeout(() => document.addEventListener('click', outsidePicker), 0);
  }

  let lastAnchor = null;

  function outsidePicker(e) {
    if (!e.target.closest('.daypick') && (!lastAnchor || !lastAnchor.contains(e.target))) closeDayPicker();
  }

  function closeDayPicker() {
    const pop = document.querySelector('.daypick');
    if (pop) pop.remove();
    document.removeEventListener('click', outsidePicker);
  }

  function openCalendarRestaurantPicker() {
    closeDayPicker();
    const anchor = $('#cal-dining');
    if (!anchor) return;
    const pop = document.createElement('div');
    pop.className = 'daypick';
    pop.innerHTML = `<h3>Choose a restaurant</h3><ul>${state.restaurants
      .slice().sort((a, b) => String(a.title || '').localeCompare(String(b.title || '')))
      .map(r => `<li><button type="button" data-restaurant="${esc(r.id)}"><span>${esc(r.title)}</span><span class="dp-date">${esc(restaurantState(r))}</span><span class="dp-mark">›</span></button></li>`).join('')}</ul>`;
    anchor.parentNode.appendChild(pop);
    lastAnchor = anchor;
    pop.querySelectorAll('[data-restaurant]').forEach(button => button.addEventListener('click', event => {
      event.stopPropagation();
      const restaurant = state.restaurants.find(item => String(item.id) === String(button.dataset.restaurant));
      closeDayPicker();
      if (restaurant) openDayPicker(restaurant, anchor, () => renderCalendar());
    }));
    setTimeout(() => document.addEventListener('click', outsidePicker), 0);
  }

  function renderCalendar() {
    state.current = null;
    $('#placeholder').hidden = true;
    const sheet = $('#sheet');
    sheet.hidden = false;
    sheet.dataset.mode = 'plain';

    const start = state.weekAt;
    const days = Plan.weekDays(start);
    const total = days.reduce((n, d) => n + plannedOn(Plan.key(d)).length, 0);

    sheet.innerHTML = `
      <div class="cal">
        <div class="cal-top">
          <h1 class="r-title">Calendar</h1>
          <div class="cal-nav">
            <button class="icon-btn" id="cal-prev" aria-label="Previous week"><span class="ico" data-ico="left"></span></button>
            <span class="cal-range">${esc(Plan.rangeLabel(start))}</span>
            <button class="icon-btn" id="cal-next" aria-label="Next week"><span class="ico" data-ico="right"></span></button>
            <button class="btn quiet" id="cal-today">Today</button>
          </div>
        </div>

        <div class="r-tools">
          <button class="tool" id="cal-shop"><span class="ico" data-ico="bag"></span>Groceries for this week</button>
          ${state.restaurants.length ? `<button class="tool" id="cal-dining"><span class="ico" data-ico="diningOut"></span>Add Dining Out</button>` : ''}
          ${total ? `<button class="tool" id="cal-clear"><span class="ico" data-ico="close"></span>Clear week</button>` : ''}
        </div>

        <div class="cal-grid">${days.map(d => dayColumn(d)).join('')}</div>
      </div>`;

    $('#cal-prev').addEventListener('click', () => { state.weekAt = Plan.addDays(start, -7); renderCalendar(); });
    $('#cal-next').addEventListener('click', () => { state.weekAt = Plan.addDays(start, 7); renderCalendar(); });
    $('#cal-today').addEventListener('click', () => { state.weekAt = Plan.weekStart(new Date()); renderCalendar(); });
    $('#cal-shop').addEventListener('click', () => weekToGroceries(days));
    if ($('#cal-dining')) $('#cal-dining').addEventListener('click', openCalendarRestaurantPicker);
    if (total) $('#cal-clear').addEventListener('click', async () => {
      days.forEach(d => {
        const key = Plan.key(d);
        delete state.plan[key];
        delete state.planPeriods[key];
      });
      await savePlan();
      await Store.pref('planPeriods', state.planPeriods);
      renderCalendar();
      toast('Week cleared.');
    });

    sheet.querySelectorAll('.cal-card').forEach(card => {
      card.querySelector('.cal-open').addEventListener('click', () => {
        const dining = state.restaurants.some(item => String(item.id) === String(card.dataset.id));
        if (dining) openRestaurant(card.dataset.id); else openRecipe(card.dataset.id);
      });
      card.querySelector('.cal-x').addEventListener('click', async e => {
        e.stopPropagation();
        await removeFromDay(card.dataset.id, card.dataset.day);
        renderCalendar();
      });
    });

    sheet.querySelectorAll('.cal-day').forEach(day => {
      day.setAttribute('tabindex', '0');
      day.setAttribute('role', 'button');
      day.setAttribute('aria-label', `Open ${day.dataset.day}`);
      const open = event => {
        if (event.target.closest('.cal-card')) return;
        if (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ') return;
        if (event.type === 'keydown') event.preventDefault();
        openDayFocus(day.dataset.day);
      };
      day.addEventListener('click', open);
      day.addEventListener('keydown', open);
    });

    Icons.paint(sheet);
  }

  function dayColumn(d) {
    const k = Plan.key(d);
    const items = plannedOn(k);
    return `<section class="cal-day${Plan.isToday(d) ? ' today' : ''}" data-day="${k}">
      <header>
        <span class="cd-name">${esc(Plan.shortDay(d))}</span>
        <span class="cd-num">${d.getDate()}</span>
      </header>
      ${items.length
        ? items.map(r => {
          const dining = state.restaurants.some(item => String(item.id) === String(r.id));

  function openDayFocus(dateKey) {
    const date = Plan.fromKey(dateKey);
    const rank = { morning: 0, afternoon: 1, night: 2, '': 3 };
    const items = plannedOn(dateKey).slice().sort((a, b) =>
      rank[planPeriod(dateKey, a.id)] - rank[planPeriod(dateKey, b.id)] ||
      String(a.title).localeCompare(String(b.title)));
    const wrap = document.createElement('div');
    wrap.className = 'day-focus';
    wrap.innerHTML = `<div class="day-focus-scrim"></div><section class="day-focus-card" role="dialog" aria-modal="true" aria-label="Plans for ${esc(Plan.label(date))}">

      ${items.length ? `<div class="day-focus-list">${items.map(r => {
        const dining = state.restaurants.some(item => String(item.id) === String(r.id));
        return `<article class="day-focus-item" data-id="${esc(r.id)}">

      }).join('')}</div>` : '<p class="day-focus-empty">Nothing planned for this day yet.</p>'}

  async function seedKitchenIngredientCategories() {
    const saved = Array.isArray(state.kitchenRecipes) ? state.kitchenRecipes : [];
    const hidden = new Set((state.kitchenHidden || []).map(String));
    const byName = new Map(saved.map(entry => [Food.key(entry.title), entry]));
    const byId = new Map(saved.map(entry => [String(entry.id), entry]));
    let changed = false;
    Object.entries(KITCHEN_STARTER_ITEMS).forEach(([type, names]) => names.forEach(title => {
      const key = Food.key(title);
      const stableId = `ingredient-${key.replace(/[^a-z0-9]+/g, '-')}`;
      const existing = byName.get(key) || byId.get(stableId);
      if (existing) {
        if (existing.edited) return;
        const types = Array.isArray(existing.types) ? existing.types : (existing.type ? [existing.type] : []);
        if (!types.includes(type)) { existing.types = [...types, type]; delete existing.type; changed = true; }
      } else if (!hidden.has(stableId)) {
        const entry = { id: stableId, title, image: '', types: [type] };
        saved.push(entry);
        byName.set(key, entry);
        byId.set(stableId, entry);
        changed = true;
      }
    }));
    state.kitchenRecipes = saved;
    if (changed) await Store.pref('kitchenRecipes', saved);
  }

  function looksLikeSnackRecipe(recipe) {
    const text = `${recipe.title || ''} ${(recipe.categories || []).join(' ')}`.toLowerCase();
    return /\b(snacks?|chips?|crisps?|popcorn|pretzels?|crackers?|granola|trail mix|mixed nuts?|jerky|protein bars?|energy bars?|fruit leather|rice cakes?|cheese sticks?|hummus|salsa|guacamole|nachos?)\b/.test(text);
  }

  function kitchenRecipeTypes(recipe, recoverSnacks) {
    const categories = Array.isArray(recipe.categories) ? recipe.categories : [];
    return ['snacks', 'desserts', 'drinks'].filter(type => categories.some(category =>
      type === 'snacks'
        ? /^snacks?$/i.test(String(category).trim())
        : categoryBelongsToSection(category, type)) || (type === 'snacks' && recoverSnacks && looksLikeSnackRecipe(recipe)));
  }

  /* My Kitchen is an additive saved collection. Recipes enter it when they
     are categorized as a snack, dessert or drink, but removing or changing
     that recipe category never removes the saved kitchen entry. */
  async function syncKitchenRecipeLibrary() {
    const saved = Array.isArray(state.kitchenRecipes) ? state.kitchenRecipes : [];
    const byId = new Map(saved.map(entry => [String(entry.id), entry]));
    const hidden = new Set((state.kitchenHidden || []).map(String));
    const recoverSnacks = !(await Store.pref('kitchenSnackRecoveryV96'));
    let changed = false;
    state.recipes.forEach(recipe => {
      if (hidden.has(String(recipe.id))) return;
      const types = kitchenRecipeTypes(recipe, recoverSnacks);
      if (!types.length) return;
      const existing = byId.get(String(recipe.id));
      if (existing) {
        if (existing.edited) return;
        const oldTypes = Array.isArray(existing.types) ? existing.types : (existing.type ? [existing.type] : []);
        const mergedTypes = [...new Set([...oldTypes, ...types])];
        if (mergedTypes.length !== oldTypes.length) {
          existing.types = mergedTypes;
          delete existing.type;
          changed = true;
        }
        const currentImage = (Array.isArray(recipe.images) && recipe.images[0]) || recipe.thumb || existing.image || '';
        if (existing.title !== recipe.title || existing.image !== currentImage) {
          existing.title = recipe.title || existing.title;
          existing.image = currentImage;
          changed = true;
        }
        return;
      }
      const entry = {
        id: recipe.id,
        title: recipe.title || 'Untitled recipe',
        image: (Array.isArray(recipe.images) && recipe.images[0]) || recipe.thumb || '',
        types
      };
      saved.push(entry);
      byId.set(String(entry.id), entry);
      changed = true;
    });
    state.kitchenRecipes = saved;
    if (changed) await Store.pref('kitchenRecipes', state.kitchenRecipes);
    if (recoverSnacks && state.recipes.length) await Store.pref('kitchenSnackRecoveryV96', true);
  }

  async function setKitchenRecipeLocation(name, place, recipeId) {
    const wanted = Food.key(name);
    const current = state.fridge.find(item => Food.key(item.name) === wanted);
    const nextPlace = current && current.place === place ? null : place;
    state.fridge = state.fridge.filter(item => Food.key(item.name) !== wanted);
    if (nextPlace) {
      const recipe = state.kitchenRecipes.find(item => String(item.id) === String(recipeId));
      const image = recipe && recipe.image;
      if (image && !Food.hasCustom(name)) {
        Food.setCustom(name, image);
        await saveFoodPics();
      }
      const item = Fridge.item(name, null, nextPlace);
      if (item) state.fridge.push(item);
      state.fridgePlace = nextPlace;
      await Store.pref('fridgePlace', nextPlace);
    }
    await saveFridge();
    renderFridge();
    toast(nextPlace ? `${name} added to the ${nextPlace}.` : `${name} removed from storage.`);
  }

  function bindFoodPlacement(el) {
    const cell = el.closest('.fr-cell');
    const floor = el.closest('.rack-floor');
    const item = state.fridge.find(i => i.id === el.dataset.id);
    if (!cell || !floor || !item) return;
    let start = null, moved = false, suppressClick = false;
    const clampX = value => start ? Math.max(start.minX, Math.min(start.maxX, value)) : value;

    /* Bring old free-position values back inside their shelf when opening a
       newer build, including values saved before shelf bounds were enforced. */
    requestAnimationFrame(() => {
      const box = cell.getBoundingClientRect(), bounds = floor.getBoundingClientRect();
      let correction = 0;
      if (box.width > bounds.width) correction = bounds.left + bounds.width / 2 - (box.left + box.width / 2);
      else if (box.left < bounds.left) correction = bounds.left - box.left;
      else if (box.right > bounds.right) correction = bounds.right - box.right;
      if (Math.abs(correction) > .5) {
        item.visualX = Math.round((Number(item.visualX) || 0) + correction);
        cell.style.setProperty('--food-x', `${item.visualX}px`);
        saveFridge();
      }
    });
    el.addEventListener('pointerdown', e => {
      if (e.button !== undefined && e.button !== 0) return;
      const box = cell.getBoundingClientRect(), bounds = floor.getBoundingClientRect();
      const x = Number(item.visualX) || 0;
      start = { pointerX: e.clientX, pointerY: e.clientY, x, y: Number(item.visualY) || 0,
        minX: box.width > bounds.width ? x : x + bounds.left - box.left,
        maxX: box.width > bounds.width ? x : x + bounds.right - box.right };
      moved = false;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      if (!start || !el.hasPointerCapture(e.pointerId)) return;
      const dx = e.clientX - start.pointerX, dy = e.clientY - start.pointerY;
      if (!moved && Math.hypot(dx, dy) < 5) return;
      moved = true; cell.classList.add('is-dragging');
      cell.style.setProperty('--food-x', `${clampX(start.x + dx)}px`);
      cell.style.setProperty('--food-y', `${Math.max(-130, Math.min(100, start.y + dy))}px`);
    });
    el.addEventListener('pointerup', async e => {
      if (!start) return;
      if (moved) {
        item.visualX = Math.round(clampX(start.x + e.clientX - start.pointerX));
        item.visualY = Math.round(Math.max(-130, Math.min(100, start.y + e.clientY - start.pointerY)));
        suppressClick = true; await saveFridge();
        setTimeout(() => { suppressClick = false; }, 0);
      }
      cell.classList.remove('is-dragging'); start = null;
    });
    el.addEventListener('pointercancel', () => { cell.classList.remove('is-dragging'); start = null; });
    el.addEventListener('click', e => {
      if (suppressClick || moved) { e.preventDefault(); e.stopPropagation(); return; }
      itemMenu(el, el.dataset.id);
    });
  }

  async function addFridgeItems() {
    const input = $('#fr-input');
    const added = Fridge.parseList(input.value);
    if (!added.length) return toast('Type something you have first.', 3000);
    // produce all guesses into the left crisper; even them out so the right
    // one is not permanently empty
    const PAIRS = { fc1: 'fc2', z1: 'z2', zd1: 'zd2', p1: 'p2' };
    const tally = {};
    state.fridge.forEach(x => { tally[x.shelf] = (tally[x.shelf] || 0) + 1; });
    added.forEach(it => {
      const other = PAIRS[it.shelf];
      // count what this batch has already placed, or every item in one go
      // lands on the same side and the other stays empty
      if (other && (tally[it.shelf] || 0) > (tally[other] || 0)) {
        it.shelf = other; it.section = other;
      }
      tally[it.shelf] = (tally[it.shelf] || 0) + 1;
    });

    state.fridge = state.fridge.concat(added);
    input.value = '';
    // land on the appliance the first new thing went into
    state.fridgePlace = added[0].place;
    await Store.pref('fridgePlace', state.fridgePlace);
    await saveFridge();
    renderFridge();
    toast(`Added ${added.length} item${added.length === 1 ? '' : 's'}.`);
  }

  function renderFridgeSuggestions() {
    const input = $('#fr-input');
    const host = $('#fr-suggestions');
    if (!input || !host) return;
    const query = Food.key(input.value.split(',').pop() || '');
    if (!query) { host.hidden = true; host.innerHTML = ''; return; }

    const seen = new Set();
    const choices = state.kitchenRecipes
      .filter(item => {
        const key = Food.key(item.title || '');
        if (!key || seen.has(key) || !key.includes(query)) return false;
        seen.add(key);
        return true;
      })
      .sort((a, b) => {
        const ak = Food.key(a.title); const bk = Food.key(b.title);
        return Number(!ak.startsWith(query)) - Number(!bk.startsWith(query)) || ak.localeCompare(bk);
      })
      .slice(0, 7);

    if (!choices.length) { host.hidden = true; host.innerHTML = ''; return; }
    host.innerHTML = choices.map(item => {
      const types = Array.isArray(item.types) ? item.types : (item.type ? [item.type] : []);
      const category = types.map(type => (KITCHEN_FOOD_LABELS[type] || type).replace(/^\S+\s/, '')).join(', ');
      return `<button type="button" data-fr-suggestion="${esc(item.title)}"><span>${esc(item.title)}</span><small>${esc(category || 'My Kitchen')}</small></button>`;
    }).join('');
    host.hidden = false;
    host.querySelectorAll('[data-fr-suggestion]').forEach(button => button.addEventListener('click', () => {
      input.value = button.dataset.frSuggestion;
      host.hidden = true;
      addFridgeItems();
    }));
  }

  /* Tap an item: move it somewhere else, or take it out */
  function itemMenu(anchor, id) {
    closeDayPicker();
    const item = state.fridge.find(i => i.id === id);
    if (!item) return;

    const f = Fridge.freshness(item);
    const pop = document.createElement('div');
    pop.className = 'daypick fr-menu';
    pop.innerHTML = `<h3>${esc(item.name)}<span class="fr-menu-days ${esc(f.level)}">${esc(f.label)}</span></h3>
      <button type="button" class="fr-used" data-remove="1">Used it up</button>
      <button type="button" class="fr-pic" data-pic="1">${Food.hasCustom(item.name)
        ? 'Change its picture' : 'Give it a picture'}</button>
      ${Food.hasCustom(item.name)
        ? `<button type="button" class="fr-pic sub" data-unpic="1">Use the built-in picture</button>` : ''}
      <div class="fr-size">
        <span class="ed-lbl">Visual size</span>
        <div class="fr-size-row">
          ${[[.75,'XS'],[1,'S'],[1.25,'M'],[1.5,'L'],[2,'XL']].map(([n, label]) =>
            `<button type="button" data-scale="${n}" class="${Math.abs((Number(item.visualScale) || 1) - n) < .01 ? 'on' : ''}">${label}</button>`).join('')}
        </div>
        <button type="button" class="fr-reset-pos" data-reset-pos="1">Reset size &amp; position</button>
      </div>
      <div class="fr-life">
        <span class="ed-lbl">Good for</span>
        <div class="fr-life-row">
          ${[1, 3, 7, 14, 30].map(d =>
            `<button type="button" data-life="${d}" class="${item.life === d ? 'on' : ''}">${d}d</button>`).join('')}
        </div>
      </div>
      <span class="ed-lbl fr-move-lbl">Move to</span>
      <ul>
      ${Fridge.PLACES.map(p => Fridge.shelvesOf(p.id).map((sh, n) => `<li>
        <button type="button" data-move="${sh.id}" class="${sh.id === item.shelf ? 'on' : ''}">
          <span>${esc(p.label)} · ${esc(sh.label || 'Shelf ' + (n + 1))}</span>
          <span class="dp-mark">${sh.id === item.shelf ? '✓' : ''}</span>
        </button></li>`).join('')).join('')}
    </ul>`;

    /* Put the menu at document level so the appliance's photographic frame
       cannot clip it. Position it beside the tapped item and keep it onscreen. */
    pop.classList.add('fr-menu-portal');
    document.body.appendChild(pop);
    const box = anchor.getBoundingClientRect();
    const menuW = Math.min(300, window.innerWidth - 20);
    const left = Math.max(10, Math.min(window.innerWidth - menuW - 10, box.left + box.width / 2 - menuW / 2));
    const roomBelow = window.innerHeight - box.bottom - 12;
    const maxH = Math.min(460, window.innerHeight - 20);
    pop.style.left = `${left}px`;
    pop.style.maxHeight = `${maxH}px`;
    pop.style.top = roomBelow >= Math.min(360, maxH)
      ? `${box.bottom + 8}px`
      : `${Math.max(10, box.top - Math.min(pop.scrollHeight, maxH) - 8)}px`;
    lastAnchor = anchor;
    setTimeout(() => document.addEventListener('click', outsidePicker), 0);

    pop.querySelectorAll('button').forEach(b => b.addEventListener('click', async e => {
      e.stopPropagation();
      if (b.dataset.pic) {
        closeDayPicker();
        return askForPicture(item.name, () => renderFridge());
      }
      if (b.dataset.unpic) {
        Food.removeCustom(item.name);
        await saveFoodPics();
        closeDayPicker();
        renderFridge();
        return toast(`${item.name} is back to its built-in picture.`);
      }
      if (b.dataset.scale) item.visualScale = Number(b.dataset.scale);
      else if (b.dataset.resetPos) {
        item.visualX = 0; item.visualY = 0; item.visualScale = 1;
      }
      else if (b.dataset.remove) state.fridge = state.fridge.filter(i => i.id !== id);
      else if (b.dataset.life) Fridge.setLife(item, Number(b.dataset.life));
      else {
        item.shelf = b.dataset.move;
        item.section = b.dataset.move;
        item.place = Fridge.placeOfShelf(b.dataset.move);
        item.visualX = 0; item.visualY = 0;
        state.fridgePlace = item.place;
      }
      closeDayPicker();
      await saveFridge();
      renderFridge();
    }));
  }

  function renderMatches() {
    const host = $('#fr-matches');
    if (!host) return;

    if (!state.fridge.length) {
      host.innerHTML = `<p class="r-note">Put something in the fridge and this fills up.</p>`;
      return;
    }

    const matches = Fridge.matchRecipes(state.fridge, state.recipes,
      { assumeStaples: state.fridgeStaples });

    const urgent = state.fridge.filter(Fridge.isUrgent)
      .sort((a, b) => Fridge.daysLeft(a) - Fridge.daysLeft(b));

    if (!matches.length) {
      host.innerHTML = `<p class="r-note">Nothing in your library uses these yet.</p>`;
      return;
    }

    const banner = urgent.length
      ? `<p class="fr-urgent"><strong>Use soon:</strong> ${urgent.map(i =>
          `${esc(i.name)} <span>(${esc(Fridge.freshness(i).label)})</span>`).join(', ')}</p>`
      : '';

    host.innerHTML = banner + `<ul class="matches">${matches.slice(0, 24).map(m => {
      const pct = Math.round(m.ratio * 100);
      const full = m.missing.length === 0;
      return `<li class="match" data-id="${esc(m.recipe.id)}">
        <button type="button" class="match-open">
          ${(m.recipe.thumb || m.recipe.images[0])
            ? `<img src="${esc(m.recipe.thumb || m.recipe.images[0])}" alt="">`
            : '<span class="pick-blank"></span>'}
          <span class="match-body">
            <span class="pick-title">${esc(m.recipe.title)}</span>
            <span class="match-bar"><span style="width:${pct}%"></span></span>
            <span class="match-sub${full ? ' full' : ''}">${full
              ? 'You have everything'
              : `${m.have} of ${m.total} · need ${esc(m.missing.slice(0, 3).join(', '))}${m.missing.length > 3 ? ` +${m.missing.length - 3}` : ''}`}</span>
            ${m.expiring.length ? `<span class="match-uses">Uses ${esc(m.expiring.map(i => i.name).join(', '))}</span>` : ''}
          </span>
        </button>
      </li>`;
    }).join('')}</ul>`;

    host.querySelectorAll('.match').forEach(li =>
      li.querySelector('.match-open').addEventListener('click', () => openRecipe(li.dataset.id)));
  }

  async function addToGroceries() {
    const r = state.current, f = factor();
    let n = 0;
    r.ingredients.forEach((line, i) => {
      if (Units.isHeading(line) || state.off.has(i) || kitchenHasIngredient(line)) return;
      const { qty, name } = Units.scaleLine(line, f);
      state.list.push({ text: (qty ? qty + ' ' : '') + name, from: r.title, done: false });
      n++;
    });
    if (!n) {
      toast(`You already have everything for ${r.title} in your Kitchen.`);
      return;
    }
    await saveList();
    toast(`${n} missing item${n === 1 ? '' : 's'} added to groceries.`);
  }
